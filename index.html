{id:78,num:"#195",n_lista:988,nombre_comun:"Misto",nombre_cientifico:"Sicalis luteola",familia:"Thraupidae",orden:"Passeriformes",descripcion:{macho:"Semillero chico de pico corto y cónico, gris rosado. Ojo pardo. Corona y nuca pardo oliváceo con estrías negruzcas; zona entre el pico y el ojo y alrededor del ojo amarillo vivo. Dorso pardo oliváceo estriado de negruzco; rabadilla oliva. Alas y cola pardas, con los bordes de las plumas más claros y un poco de amarillo en el hombro. Garganta amarilla, pecho lavado de pardo oliváceo y vientre amarillo; zona bajo la cola blanquecina. Patas rosadas.",hembra:"La hembra es más parda por arriba y más apagada: garganta, pecho y flancos pardo claro, con el vientre amarillo. El juvenil se parece a la hembra, con el pecho estriado de pardo."},habitat:["pastizal","agrícola","humedal","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"11-14",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","Tucumán","Salta","Jujuy","Catamarca","San Juan","Mendoza","San Luis","La Pampa","Neuquén","Río Negro","Chubut","Santa Cruz","La Rioja"],curiosidades:"Vive en pastizales, campos cultivados, bordes de bañados y baldíos, donde anda en parejas o en bandadas que a veces son muy grandes. Come semillas e insectos en el suelo y se posa en pastos altos, arbustos y alambrados. En época de cría el macho sube en vuelo y baja lentamente cantando un chorro de trinos y zumbidos. Arma el nido en el suelo, escondido entre pastos o arbustos. Las poblaciones del sur migran hacia el norte en invierno.",sprites:{macho:"Sicalis_luteola_M",hembra:"Sicalis_luteola_F"},audio_ebird_code:"gryfin1",mapa:"Maps/Sicalis_luteola_map.png",thumb_sprite:"",exotica:false,amba:5.45},
{id:68,num:"#196",n_lista:1028,nombre_comun:"Corbatita",nombre_cientifico:"Sporophila caerulescens",familia:"Thraupidae",orden:"Passeriformes",descripcion:{macho:"Macho pequeño y elegante. Partes superiores gris-azuladas; alas y cola pardo-grisáceas. Garganta y babero pectorales negros. Finos bigotes blancos flanqueando la garganta. Collar blanco sobre el negro pectoral. Resto de partes inferiores blancas. Pico corto y robusto, blanco-amarillento. Patas negras.",hembra:"Hembra discreta. Partes superiores pardo-oliváceas. Partes inferiores ocre-amarillentas, más pálidas en el vientre. Sin el diseño negro y blanco del macho. Pico corto gris-oliváceo. Patas negras."},habitat:["pastizal","monte","arbolado","urbano"],residencia:"estival",tamanio:"chico",largo_cm:10,envergadura_cm:16,estado:"LC",provincias:["CABA","Buenos Aires","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Córdoba","Salta","Jujuy","Tucumán","Santiago del Estero","La Pampa","Mendoza","San Luis"],curiosidades:"Uno de los pájaros más comunes de Argentina. Los machos son buenos imitadores y pueden incorporar fragmentos del canto de otras especies a su compleja melodía. Es muy apreciado como ave de jaula, lo que lo convierte en víctima frecuente del tráfico ilegal.",sprites:{macho:"Sporophila_caerulescens_M",hembra:"Sporophila_caerulescens_F"},audio_ebird_code:"docsee1",mapa:"Maps/Sporophila_caerulescens_map.png",thumb_sprite:"",exotica:false,amba:12.81},
{id:168,num:"#197",n_lista:1032,nombre_comun:"Pepitero Gris",nombre_cientifico:"Saltator coerulescens",familia:"Thraupidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro mediano y robusto, de pico grueso y cola larga. Cabeza gris con una ceja blanquecina. Pico negro. Ojo pardo. Dorso gris; alas y cola negruzcas. Garganta ocrácea bordeada de negruzco. Pecho gris y vientre canela. Patas grisáceas. Macho y hembra son iguales."},habitat:["monte","ribereño","urbano"],residencia:"permanente",tamanio:"mediano",largo_cm:"21",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","Misiones","Salta","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Es muy cantor: da silbidos fuertes y melodiosos desde lo alto de los árboles, y en el Delta le dicen chiviro de la isla. Anda en parejas, bullanguero e inquieto, y come frutos, brotes, flores e insectos desde el suelo hasta las copas.",sprites:{adulto:"Saltator_coerulescens_D"},audio_ebird_code:"grasal3",mapa:"Maps/Saltator_coerulescens_map.png",thumb_sprite:"",exotica:false,amba:4.41},
{id:179,num:"#198",n_lista:1033,nombre_comun:"Pepitero Verdoso",nombre_cientifico:"Saltator similis",familia:"Thraupidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro mediano y robusto, de pico grueso y cola larga. Cabeza gris con una ceja blanca larga y una línea oscura en el bigote. Pico gris. Ojo pardo. Dorso gris con tono oliva. Alas pardo oscuras con los bordes de las plumas y las cubiertas oliva. Cola parda oscura. Garganta blanquecina; resto de abajo gris ocráceo. Patas grises. Macho y hembra son iguales."},habitat:["monte","bosque","ribereño","urbano"],residencia:"permanente",tamanio:"mediano",largo_cm:"21",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chaco","Corrientes","Entre Ríos","Formosa","Misiones","Santa Fe"],curiosidades:"Se parece mucho al Pepitero Gris, pero se lo reconoce por el verde oliva del dorso y las alas. Come frutos, flores, brotes y semillas, y también algunos insectos. Su canto es fuerte y melodioso, y por eso es muy buscado como ave de jaula.",sprites:{adulto:"Saltator_similis_D"},audio_ebird_code:"grwsal1",mapa:"Maps/Saltator_similis_map.png",thumb_sprite:"",exotica:false,amba:7.06},
{id:69,num:"#199",n_lista:1038,nombre_comun:"Verdón",nombre_cientifico:"Embernagra platensis",familia:"Thraupidae",orden:"Passeriformes",descripcion:{adulto:"Fringílido grande, de cola larga y pico grueso. Cabeza gris con lores y cara más oscuros que dan aspecto enmascarado. Desde la nuca, un tinte verde invade el gris y se funde con el dorso verde hierba, finamente estriado. Ala ampliamente bordeada de verde, del mismo tono que el dorso salvo un parche negruzco ancho en los terciarios. Cola oscura con bordes verde hierba anchos. El gris de la cara continúa en las partes inferiores, con la garganta algo más pálida, oscureciéndose en pecho y flancos. Vientre y zona anal blanquecinos, a veces con lavado canela. Ojo pardo oscuro. Pico naranja con el culmen negro. Patas rosado apagado.",juvenil:"El juvenil es bastante distinto del adulto: fuerte lavado amarillo en cara y garganta, con una ceja amarilla que contrasta con la corona y la mejilla más oscuras, y una media luna blanquecina nítida bajo el ojo. Todo el dorso es pardo pálido con estriado oscuro marcado. Partes inferiores blanco-amarillentas con estriado nítido en el pecho y los flancos altos. Pico oscuro."},habitat:["pastizal","bosque"],residencia:"permanente",tamanio:"mediano",largo_cm:"20.5-23",envergadura_cm:null,estado:"LC",provincias:[],curiosidades:"Es un ave típica de pastizales y áreas con arbustos. Aunque se lo clasifica como fringílido, algunos autores lo consideran más cercano a las tangaras. Su pico naranja y su cabeza gris con dorso verde hierba lo hacen inconfundible en el campo.",sprites:{adulto:"Embernagra_platensis_D",juvenil:"Embernagra_platensis_J"},audio_ebird_code:"grpfin1",mapa:"Maps/Embernagra_platensis_map.png",thumb_sprite:"",exotica:false,amba:2.36},
{id:92,num:"#200",n_lista:1044,nombre_comun:"Sietevestidos Pampeano",nombre_cientifico:"Poospiza nigrorufa",familia:"Thraupidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico y vistoso de pajonales y juncales. Corona y nuca gris parduscas. Cara negruzca, con una ceja larga y fina que es blanca adelante y se vuelve canela detrás del ojo, y una línea blanca tipo bigote que baja desde la base del pico por el costado de la garganta. Pico corto, gris pardusco con el borde de arriba y la punta negros. Ojo pardo oscuro. Dorso gris pardusco. Alas pardo oscuras con las cubiertas grises. Cola pardo oscura, con la punta de las plumas de los costados blanca, que se nota cuando la abre. Garganta, pecho y flancos castaño rojizos, con el centro del vientre blanco bien marcado. Patas negruzcas. La hembra es muy parecida, con el pecho algo más anaranjado y el dorso más oliváceo.",juvenil:"El juvenil es mucho más apagado: las partes de abajo son blanco cremosas con muchas estrías pardas, y la ceja se ve poco marcada y blancuzca."},habitat:["pastizal","humedal"],residencia:"permanente",tamanio:"chico",largo_cm:"14",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Córdoba"],curiosidades:"Vive en juncales, totorales y matorrales de pajonal cerca del agua, y en llanuras con grandes matas de cortadera; anda solo o en pareja y canta fuerte desde lo alto de un junco o un arbusto. Fue descripto por primera vez por el naturalista uruguayo Dámaso Larrañaga en 1811 como 'Motacilla bonariensis', pero ese trabajo no se publicó a tiempo y el nombre que quedó es el de d'Orbigny y Lafresnaye (1837), con localidad tipo en Santa Fe. Su nombre científico viene del latín 'niger' (negro) y 'rufus' (rojizo). Hasta 2017 incluía a la monterita del noroeste, que hoy es una especie aparte (Poospiza whitii).",sprites:{adulto:"Poospiza_nigrorufa_D"},audio_ebird_code:"barwaf1",mapa:"Maps/Poospiza_nigrorufa_map.png",thumb_sprite:"",exotica:false,amba:25.33},
{id:182,num:"#201",n_lista:1051,nombre_comun:"Monterita Litoraleña",nombre_cientifico:"Microspingus cabanisi",familia:"Thraupidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico de pico algo grueso y puntiagudo. Cabeza gris, más oscura en la corona, con una ceja fina blanquecina y una línea blanquecina en el bigote. Pico gris amarillento con la parte de arriba negruzca. Ojo castaño. Nuca gris; dorso pardusco; rabadilla rufa. Alas grisáceas con bordes pardos y un destello blanco en las plumas largas. Cola negruzca con casi la mitad de la pluma de afuera blanca. Garganta gris pálida a blanca; pecho gris; costados rufos; centro del vientre blanco; debajo de la cola canela pálido. Patas gris oscuras. La hembra es algo más apagada que el macho."},habitat:["monte","ribereño","bosque"],residencia:"permanente",tamanio:"chico",largo_cm:"15",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Corrientes","Entre Ríos","Misiones"],curiosidades:"Vive en bordes de selvas en galería y montes ribereños, casi siempre cerca de arroyos, y busca insectos y semillas a un par de metros del suelo. Hasta 2009 se la consideraba la misma especie que una monterita del sudeste de Brasil. Su nido es una taza de fibras vegetales, y a menudo lo parasita el Tordo Renegrido.",sprites:{adulto:"Microspingus_cabanisi_D"},audio_ebird_code:"gytwaf1",mapa:"Maps/Microspingus_cabanisi_map.png",thumb_sprite:"",exotica:false,amba:2.63},
{id:165,num:"#202",n_lista:1053,nombre_comun:"Monterita Cabeza Negra",nombre_cientifico:"Microspingus melanoleucus",familia:"Thraupidae",orden:"Passeriformes",descripcion:{macho:"Pájaro chico y esbelto, de cola larga. El macho tiene la cabeza negra. Pico negro. Ojo rojizo. Dorso gris; alas pardas. Cola con las plumas del centro pardas y las de los costados pardo oscuras con el tercio final blanco. Partes inferiores blancas con los costados grises. Patas negruzcas.",hembra:"La hembra tiene la cabeza y el dorso grises con tono ocráceo, abajo es blanquecina, y las alas y la cola son pardas."},habitat:["monte","bosque"],residencia:"invernal",tamanio:"chico",largo_cm:"13",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Rioja","Misiones","Salta","San Juan","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Anda en parejas o en grupitos de 6 a 8, muy inquietos, que se mueven rápido entre arbustos y ramas bajas avisándose con llamadas cortas. Busca semillas e insectos desde el suelo hasta unos 5 metros de altura. En Buenos Aires se ve más en otoño e invierno, cuando llega desde el norte.",sprites:{macho:"Microspingus_melanoleucus_M"},audio_ebird_code:"bcwfin2",mapa:"Maps/Microspingus_melanoleucus_map.png",thumb_sprite:"",exotica:false,amba:12.13},
{id:146,num:"#203",n_lista:1054,nombre_comun:"Cachilo Canela",nombre_cientifico:"Donacospiza albifrons",familia:"Thraupidae",orden:"Passeriformes",descripcion:{adulto:"Pajarito de cola larga, de color canela. Cabeza y parte alta del dorso grises con tono ocráceo, con una ceja blanquecina y la zona de la oreja gris. Pico negruzco. Ojo pardo oscuro. Resto del dorso canela con estrías pardas. Alas pardas con las plumas bordeadas de ocráceo. Cola larga, parda con los bordes ocráceos. Partes de abajo canela. Patas rosado oscuro. Macho y hembra son iguales."},habitat:["humedal","pastizal"],residencia:"permanente",tamanio:"chico",largo_cm:"16",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Misiones","Santa Fe"],curiosidades:"Vive en pajonales y juncales de bañados y orillas, donde se mueve inquieto entre los tallos. Anda solo o en pareja y, cuando lo molestan, hace vuelos bajos y cortos para volver a esconderse en la vegetación. Come semillas e insectos.",sprites:{adulto:"Donacospiza_albifrons_D"},audio_ebird_code:"ltrfin1",mapa:"Maps/Donacospiza_albifrons_map.png",thumb_sprite:"",exotica:false,amba:1.42},
{id:85,num:"#204",n_lista:1062,nombre_comun:"Cardenal Copete Rojo",nombre_cientifico:"Paroaria coronata",familia:"Thraupidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico y llamativo. Cabeza, copete puntiagudo, garganta y parte alta del pecho rojos; el copete lo levanta cuando se excita. Pico blancuzco o rosado con la punta y la línea de arriba negruzcas. Ojo pardo rojizo. Nuca gris con puntitos blancos. Dorso gris; alas y cola negruzcas. Pecho, vientre y plumas debajo de la cola blancos. Patas negruzcas. Macho y hembra son iguales.",juvenil:"Como el adulto, pero la cabeza, el copete y el babero son pardo anaranjados apagados en lugar de rojos, el dorso gris tiene un lavado pardo y el pico es más oscuro."},habitat:["monte","urbano","ribereño","humedal"],residencia:"permanente",tamanio:"chico",largo_cm:"18-19",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Tucumán","Salta","Jujuy","Mendoza","Río Negro","Catamarca","Neuquén","Chubut"],curiosidades:"Es muy común en plazas y parques, y abunda sobre todo en la región chaqueña. Anda en parejas, grupos o bandadas de hasta 50, y busca comida mucho en el suelo: semillas de pastos, frutos como los del tala y la mora, e insectos, incluidas hormigas y termitas aladas. Cría de septiembre a febrero en un nido en forma de taza de fibras vegetales, donde pone 3 o 4 huevos verdosos con manchas pardas. Lo parasita el Tordo Renegrido. Por su canto y su color es de los pájaros más buscados como mascota en la Argentina, y fue introducido en Hawái, Puerto Rico y Chile.",sprites:{adulto:"Paroaria_coronata_D"},audio_ebird_code:"reccar",mapa:"Maps/Paroaria_coronata_map.png",thumb_sprite:"",exotica:false,amba:31.74},
{id:162,num:"#205",n_lista:1063,nombre_comun:"Cardenilla",nombre_cientifico:"Paroaria capitata",familia:"Thraupidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico parecido a un cardenal pero sin copete. Cabeza roja. Pico naranja amarillento. Ojo rojizo. Dorso gris con tono pardo; alas y cola negruzcas. Garganta negruzca. Costados del cuello y partes inferiores blancos, con los costados y el vientre teñidos de ocráceo. Patas rosado naranja. Macho y hembra son iguales."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"chico",largo_cm:"17",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","Misiones","Neuquén","Río Negro","Salta","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Vive cerca del agua y camina con soltura sobre los camalotes y la vegetación flotante de esteros y orillas de ríos, buscando semillas e insectos. Anda en parejas o grupitos. Se la distingue del Cardenal Copete Rojo por no tener copete y por el pico amarillento. Por su color es muy buscada como ave de jaula, y por eso aparecen individuos escapados lejos de su zona.",sprites:{adulto:"Paroaria_capitata_D"},audio_ebird_code:"yebcar",mapa:"Maps/Paroaria_capitata_map.png",thumb_sprite:"",exotica:false,amba:10.96},
{id:131,num:"#206",n_lista:1064,nombre_comun:"Frutero Azul",nombre_cientifico:"Stephanophorus diadematus",familia:"Thraupidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico y robusto, de pico corto y grueso. Corona blanca como una diadema, con una pequeña mancha roja en la parte de adelante. Frente, cara y barbilla negras, como un antifaz. Pico negro. Ojo pardo. Resto del cuerpo azul violáceo brillante, que con poca luz se ve casi negro. Alas y cola negruzcas con los bordes de las plumas azules. Patas grisáceas. Macho y hembra son parecidos.",juvenil:"El juvenil es más apagado y oscuro, sin la corona blanca o con muy poco blanco, y sin la mancha roja."},habitat:["bosque","monte","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"19",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Corrientes","Misiones"],curiosidades:"Es uno de los pájaros más vistosos de las arboledas del Delta y la ribera, pero con poca luz su azul violáceo se apaga y parece un pájaro negro con la corona blanca. Come frutos, brotes, flores y semillas, y también algunos insectos; suele bajar a comederos y a frutales de quintas y jardines, sobre todo en invierno. Canta desde una rama alta una frase melodiosa y variada. En Buenos Aires vive todo el año en montes ribereños, selvas en galería y parques arbolados. Arma un nido en forma de taza en arbustos o árboles.",sprites:{adulto:"Stephanophorus_diadematus_D"},audio_ebird_code:"diatan1",mapa:"Maps/Stephanophorus_diadematus_map.png",thumb_sprite:"",exotica:false,amba:2.55},
{id:70,num:"#207",n_lista:1067,nombre_comun:"Naranjero",nombre_cientifico:"Rauenia bonariensis",familia:"Thraupidae",orden:"Passeriformes",descripcion:{macho:"Ave mediana con marcado dimorfismo sexual (ssp bonariensis). Cabeza, cuello y garganta azul-maíz brillante uniforme. Antifaz negro reducido en los lores y área ocular. Dorso y escápulas negros, extendiéndose a los lados del pecho formando un collar parcial negro. Rabadilla amarillo-anaranjado brillante. Alas pardas con bordes azules; cola negra bordeada de azul. Pecho a mitad del vientre amarillo-anaranjado intenso, vientre inferior amarillo brillante. Pico oscuro con mandíbula inferior gris-pálida. Ojo pardo-rojizo. Patas gris oscuro.",hembra:"Pardo-olivácea uniforme sin manchas contrastantes. Partes superiores pardo-oliva apagado. Partes inferiores ante-amarillento pálido. Sin antifaz ni collar. Pico gris. Patas oscuras. Notablemente más apagada que el macho."},habitat:["urbano","monte","pastizal","agrícola"],residencia:"permanente",tamanio:"chico",largo_cm:17,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Santiago del Estero","Córdoba","La Pampa","Tucumán","Salta","Jujuy","Mendoza","San Luis"],curiosidades:"El macho es una de las aves más coloridas de Buenos Aires. Se alimenta de frutas, semillas e insectos y es un visitante frecuente de jardines con frutales. El nombre 'bonariensis' de su nombre científico hace referencia a Buenos Aires, ciudad donde fue descripto por primera vez para la ciencia.",sprites:{macho:"Rauenia_bonariensis_M",hembra:"Rauenia_bonariensis_F"},audio_ebird_code:"baytan3",mapa:"Maps/Rauenia_bonariensis_map.png",thumb_sprite:"",exotica:false,amba:7.0},
{id:91,num:"#208",n_lista:1073,nombre_comun:"Celestino",nombre_cientifico:"Thraupis sayaca",familia:"Thraupidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico de color gris celeste, muy común en plazas y jardines. Cabeza gris con tono celeste. Pico corto y grueso, gris azulado con la punta de arriba negra. Ojo pardo oscuro. Dorso gris con tono celeste verdoso. Alas pardo oscuras con los bordes de las plumas y las cubiertas celeste verdosas, que forman un parche más vivo que el cuerpo. Cola negruzca con tono celeste verdoso. Pecho gris claro con tono celeste y vientre blancuzco. Patas gris azuladas. Macho y hembra son parecidos; la hembra es algo más apagada."},habitat:["urbano","monte","bosque","agrícola"],residencia:"permanente",tamanio:"chico",largo_cm:"16-18",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","Catamarca","La Rioja","Tucumán","Salta","Jujuy","San Juan","Mendoza"],curiosidades:"Es uno de los pájaros más comunes de las ciudades del este de Sudamérica: anda en parejas o grupitos por árboles de plazas y frutales, y come frutas, semillas, flores, brotes e insectos. Hasta come hojas de algunas plantas, algo poco común en pájaros. Hace un nido en forma de taza con fibras vegetales sobre las ramas y pone unos 3 huevos verdosos o crema con pintitas; la pareja incuba unos 14 días y los pichones dejan el nido a las dos semanas. Su canto es una mezcla apurada de silbidos agudos, algo desafinados. En Argentina y Paraguay también lo llaman 'chogüí', y algunas clasificaciones lo ubican en el género Tangara.",sprites:{adulto:"Thraupis_sayaca_D"},audio_ebird_code:"saytan1",mapa:"Maps/Thraupis_sayaca_map.png",thumb_sprite:"",exotica:false,amba:25.42}

let sel=null,tab={},flt=null,gridSex=null,drawerTab='ficha';
let user=null,seen=new Set(),llActive=false,celebrated=new Set();
// Modo ciudad: oculta especies con menos registros en el AMBA que AMBA_MIN (% del Benteveo, ver calcular_amba.py)
const AMBA_MIN=0.4;
let ciudad=false;
try{ciudad=localStorage.getItem('aviario_ciudad')==='true';}catch(e){}
function toggleCiudad(){ciudad=!ciudad;try{localStorage.setItem('aviario_ciudad',ciudad);}catch(e){}render();}

function loadState(){
  user=localStorage.getItem('aviario_user')||null;
  const s=localStorage.getItem('aviario_seen');
  seen=new Set(s?JSON.parse(s):[]);
  llActive=localStorage.getItem('aviario_ll')==='true';
  const c=localStorage.getItem('aviario_celebrated');
  celebrated=new Set(c?JSON.parse(c):[]);
}
function saveState(){
  if(user)localStorage.setItem('aviario_user',user);
  else localStorage.removeItem('aviario_user');
  localStorage.setItem('aviario_seen',JSON.stringify([...seen]));
  localStorage.setItem('aviario_ll',llActive?'true':'false');
  localStorage.setItem('aviario_celebrated',JSON.stringify([...celebrated]));
}
function isSeen(id){return seen.has(id);}

function openLogin(){document.getElementById('login-modal').classList.add('open');setTimeout(()=>document.getElementById('login-name').focus(),50);}
function closeLogin(){document.getElementById('login-modal').classList.remove('open');document.getElementById('login-name').value='';}
function doLogin(){
  const name=document.getElementById('login-name').value.trim();
  if(!name)return;
  user=name;
  saveState();
  closeLogin();
  render();
}
function logout(){if(!confirm('¿Cerrar sesión?'))return;user=null;llActive=false;saveState();render();}
function toggleLL(){if(!user)return;llActive=!llActive;saveState();render();}
function markSeen(id){
  if(isSeen(id)){seen.delete(id);}else{seen.add(id);}
  saveState();
  const curr=getUnlockedTrophies();
  const justUnlocked=TROPHIES.filter(t=>curr.has(t.id)&&!celebrated.has(t.id));
  render();
  if(justUnlocked.length>0){
    justUnlocked.forEach(t=>celebrated.add(t.id));
    saveState();
    showTrophyCel(justUnlocked);
  }
}
// Si se desbloquean varios logros a la vez, se muestran en fila: al cerrar uno aparece el siguiente
let celQueue=[];
function showTrophyCel(ts){celQueue=celQueue.concat(ts);if(!document.getElementById('trophy-cel-overlay').classList.contains('open'))showNextCel();}
function showNextCel(){
  const t=celQueue.shift();
  if(!t)return;
  document.getElementById('tc-label').textContent='¡Nuevo logro desbloqueado!'+(celQueue.length?` (quedan ${celQueue.length})`:'');
  document.getElementById('tc-icon').innerHTML=t.img?`<img src="Trofeos/${t.img}" alt="${t.name}">`:'';
  document.getElementById('tc-name').textContent=t.name;
  document.getElementById('tc-cond').textContent=t.cond;
  document.getElementById('trophy-cel-overlay').classList.add('open');
}
function closeTrophyCel(){document.getElementById('trophy-cel-overlay').classList.remove('open');if(celQueue.length)setTimeout(showNextCel,250);}
function openTrophyLb(img,name,cond){
  document.getElementById('trophy-lb-img').src='Trofeos/'+img;
  document.getElementById('trophy-lb-img').alt=name;
  document.getElementById('trophy-lb-name').textContent=name;
  document.getElementById('trophy-lb-cond').textContent=cond;
  document.getElementById('trophy-lb').classList.add('open');
}
function closeTrophyLb(){document.getElementById('trophy-lb').classList.remove('open');}

];
function getUnlockedTrophies(){
  const seenBirds=birds.filter(b=>seen.has(b.id));
  const u=new Set();
  if(seenBirds.length>=1)u.add('primera_pluma');
  const HAB_MIN=5;
  if(seenBirds.filter(b=>b.habitat.includes('urbano')).length>=HAB_MIN)u.add('obs_urbano');
  if(seenBirds.filter(b=>['humedal','ribereño','costa','laguna','marino'].some(h=>b.habitat.includes(h))).length>=HAB_MIN)u.add('orilla');
  if(seenBirds.some(b=>['Falconiformes','Accipitriformes'].includes(b.orden)))u.add('rapaz');
  if(seenBirds.some(b=>b.orden==='Strigiformes'))u.add('noche');
  if(seenBirds.filter(b=>b.habitat.includes('pastizal')).length>=HAB_MIN)u.add('pastizalero');
  if(seenBirds.some(b=>['NT','VU','EN','CR'].includes(b.estado)))u.add('en_peligro');
  if(seenBirds.length>=10)u.add('bandada');
  if(seenBirds.length>=25)u.add('conocedor');
  if(seenBirds.length>=50)u.add('guardabosques');
  if(seenBirds.length>=birds.length)u.add('maestro');
  const qualFams=[...new Set(birds.map(b=>b.familia))].filter(f=>birds.filter(b=>b.familia===f).length>=FAM_MIN);
  const famPcts=qualFams.map(f=>{
    const total=birds.filter(b=>b.familia===f).length;
    const seenN=birds.filter(b=>b.familia===f&&seen.has(b.id)).length;
    return seenN/total;
  });
  const maxPct=famPcts.length?Math.max(...famPcts):0;
  if(maxPct>=0.25)u.add('familia_bronce');
  if(maxPct>=0.50)u.add('familia_plata');
  if(famPcts.some(p=>p===1))u.add('familia_unida');
  // Un logro ya ganado (celebrado) no se pierde aunque crezca el catálogo o se desmarque una especie
  celebrated.forEach(id=>{if(TROPHIES.some(t=>t.id===id))u.add(id);});
  return u;
}
function openTrophies(){
  const u=getUnlockedTrophies();
  document.getElementById('trophy-count').textContent=u.size+'/'+TROPHIES.length;
  const trophyHtml=TROPHIES.map(t=>{
    const unlocked=u.has(t.id);
    const click=unlocked?`onclick="openTrophyLb('${t.img}','${t.name}','${t.cond}')"`:'';
    return `<div class="trophy-item${unlocked?' unlocked':''}" ${click}><div class="trophy-icon"><img src="Trofeos/${t.img}" alt="${t.name}"></div><div class="trophy-info"><div class="trophy-name">${t.name}</div><div class="trophy-cond">${t.cond}</div></div></div>`;
  }).join('');
  const tierDefs=[
    {pct:0.25,img:'Familia_completa_bronce.jpg',alt:'Bronce'},
    {pct:0.50,img:'Familia_completa_plata.jpg',alt:'Plata'},
    {pct:1.00,img:'Familia_completa_oro.jpg',alt:'Oro'},
  ];
  const qualFams=[...new Set(birds.map(b=>b.familia))].filter(f=>birds.filter(b=>b.familia===f).length>=FAM_MIN);
  const famData=qualFams.map(f=>{
    const total=birds.filter(b=>b.familia===f).length;
    const seenN=birds.filter(b=>b.familia===f&&seen.has(b.id)).length;
    return {f,total,seenN,pct:seenN/total};
  }).sort((a,b)=>b.pct-a.pct);
  const famHtml=famData.map(({f,total,seenN,pct})=>{
    const tiers=tierDefs.map(t=>`<img src="Trofeos/${t.img}" alt="${t.alt}" class="${pct>=t.pct?'earned':''}" title="${t.alt}">`).join('');
    return `<div class="fam-row"><div class="fam-row-top"><span class="fam-name">${f}</span><div class="fam-tiers">${tiers}</div></div><div class="fam-bar-wrap"><div class="fam-bar-bg"><div class="fam-bar-fill" style="width:${Math.round(pct*100)}%"></div></div><span class="fam-pct">${seenN}/${total}</span></div></div>`;
  }).join('');
  document.getElementById('trophy-list').innerHTML=trophyHtml+`<div class="fam-section-ttl">Familias</div><div style="display:flex;flex-direction:column;gap:6px">${famHtml}</div>`;
  document.getElementById('trophy-overlay').classList.add('open');
  document.getElementById('trophy-drawer').classList.add('open');
}
function closeTrophies(){
  document.getElementById('trophy-overlay').classList.remove('open');
  document.getElementById('trophy-drawer').classList.remove('open');
}

function isWide(k){return WIDE.includes(k);}
function isA(t,v){return flt&&flt.t===t&&flt.v===v;}
function tog(t,v){flt=isA(t,v)?null:{t,v};render();}
function setGridSex(v){gridSex=gridSex===v?null:v;render();}
function pickGridSprite(b){const ks=Object.keys(b.sprites);if(!ks.length)return{k0:null,sk0:null};if(b.thumb_sprite&&b.sprites[b.thumb_sprite])return{k0:b.thumb_sprite,sk0:b.sprites[b.thumb_sprite]};if(gridSex){const m=ks.find(k=>b.sprites[k]&&b.sprites[k].endsWith('_'+gridSex));if(m)return{k0:m,sk0:b.sprites[m]};}return{k0:ks[0],sk0:b.sprites[ks[0]] }; }
let lbSprites=[];let lbIdx=0;
function openLb(src){
  if(!sel)return;
  const b=birds.find(x=>x.id===sel);
  lbSprites=Object.entries(b.sprites).map(([k,v])=>({label:k,sk:v,src:SP[v]||''}));
  lbIdx=lbSprites.findIndex(x=>x.src===src);
  if(lbIdx<0)lbIdx=0;
  lbRender();
  document.getElementById('lb').classList.add('open');
}
function lbRender(){
  const item=lbSprites[lbIdx];
  document.getElementById('lb-img').src=item.src;
  document.getElementById('lb-label').textContent=item.label+(lbSprites.length>1?' ('+(lbIdx+1)+'/'+lbSprites.length+')':'');
  document.getElementById('lb-prev').disabled=lbIdx===0;
  document.getElementById('lb-next').disabled=lbIdx===lbSprites.length-1;
  const sex=item.sk.endsWith('_M')?'♂':item.sk.endsWith('_F')?'♀':'';
  document.getElementById('lb-sex').textContent=sex;
}
function lbNav(dir){
  const next=lbIdx+dir;
  if(next>=0&&next<lbSprites.length){lbIdx=next;lbRender();}
}
function closeLb(){document.getElementById('lb').classList.remove('open');}

function getSorted(list){
  const s=(document.getElementById('sort')||{value:'num'}).value;
  return [...list].sort((a,b)=>s==='nombre'?a.nombre_comun.localeCompare(b.nombre_comun,'es'):s==='cientifico'?a.nombre_cientifico.localeCompare(b.nombre_cientifico):a.n_lista-b.n_lista);
}
function getFiltered(){
  let list=birds;
  if(ciudad)list=list.filter(b=>b.amba==null||b.amba>=AMBA_MIN);
  if(flt){const{t,v}=flt;list=list.filter(b=>t==='habitat'?b.habitat.includes(v):t==='provincia'?b.provincias.includes(v):t==='estado'?b.estado===v:t==='tamanio'?b.tamanio===v:t==='familia'?b.familia===v:t==='orden'?b.orden===v:t==='residencia'?b.residencia===v:true);}
  const q=(document.getElementById('search')||{value:''}).value.toLowerCase();
  if(q)list=list.filter(b=>b.nombre_comun.toLowerCase().includes(q)||b.nombre_cientifico.toLowerCase().includes(q)||b.familia.toLowerCase().includes(q)||b.orden.toLowerCase().includes(q));
  return getSorted(list);
}

function pick(id){sel=id;drawerTab='ficha';const b=birds.find(x=>x.id===id);if(!tab[id])tab[id]=Object.keys(b.sprites)[0];render();scrollToDetail();}
function switchTab(t){drawerTab=t;document.querySelectorAll('.drawer-tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));document.querySelectorAll('.tab-pane').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));}
function st(id,t){tab[id]=t;render();}
function cls(){sel=null;render();}
function navBird(dir){
  const list=getFiltered();
  const idx=list.findIndex(b=>b.id===sel);
  if(idx===-1)return;
  const next=list[idx+dir];
  if(next)pick(next.id);
}
function scrollToDetail(){setTimeout(()=>{window.scrollTo({top:0,behavior:'smooth'});},50);}

document.addEventListener('keydown',e=>{
  const lbOpen=document.getElementById('lb').classList.contains('open');
  const tlbOpen=document.getElementById('trophy-lb').classList.contains('open');
  if(e.key==='Escape'){if(tlbOpen){closeTrophyLb();}else if(lbOpen){closeLb();}else{cls();}}
  if(lbOpen){
    if(e.key==='ArrowRight')lbNav(1);
    if(e.key==='ArrowLeft')lbNav(-1);
    return;
  }
  if(sel!==null){
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();navBird(1);}
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();navBird(-1);}
  }
});

function iTag(code,c){const r=isA('estado',code)?' active-ring':'';const cl=c?` onclick="tog('estado','${code}')" class="tag iucn-${code} clickable${r}"`:` class="tag iucn-${code}${r}"`;return `<span${cl}>${code}</span>`;}
function fTag(t,v,cls){const r=isA(t,v)?' active-ring':'';return `<span class="tag ${cls} clickable${r}" onclick="tog('${t}','${v}')">${v}</span>`;}

function renderHeader(){
  const el=document.getElementById('header-actions');
  if(!el)return;
  if(!user){
    el.innerHTML='<button class="login-btn" onclick="openLogin()">Iniciar sesión</button>';
  } else {
    el.innerHTML='<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><button class="ll-toggle'+(llActive?' on':'')+'" onclick="toggleLL()">'+(llActive?'Life List ✓':'Life List')+'</button><button class="trophy-btn" onclick="openTrophies()" title="Logros">🏆</button><span class="user-chip" onclick="logout()" title="Cerrar sesión">'+user+'</span></div>';
  }
  const sub=document.getElementById('subtitle');
  const pool=ciudad?birds.filter(b=>b.amba==null||b.amba>=AMBA_MIN):birds;
  if(sub){sub.textContent=(user&&llActive)?pool.filter(b=>seen.has(b.id)).length+'/'+pool.length+' vistas':pool.length+' especies'+(ciudad?' en la ciudad':'');}
  const ct=document.getElementById('city-toggle');
  if(ct){ct.classList.toggle('on',ciudad);ct.textContent=ciudad?'Modo ciudad ✓':'Modo ciudad';}
}

function render(){
  renderHeader();
  const list=getFiltered();
  let h='';
  if(flt)h+=`<div class="breadcrumb"><span>Filtrando por</span><span class="bc-tag">${flt.t}: ${flt.v}</span><button class="bc-close" onclick="flt=null;render()">&#10005;</button><span>${list.length} ${list.length===1?'ave':'aves'}</span></div>`;

  if(sel){
    const b=birds.find(x=>x.id===sel);
    const t=tab[b.id]||Object.keys(b.sprites)[0];
    const sk=b.sprites[t];
    const imgSrc=SP[sk]||'';
    const sexMain=sk.endsWith('_M')?'<span class="sex-badge">&#9794;</span>':sk.endsWith('_F')?'<span class="sex-badge">&#9792;</span>':'';
    const wide=isWide(t);
    const idx=list.findIndex(x=>x.id===sel);
    const hasPrev=idx>0;
    const hasNext=idx<list.length-1;
    const seenBtn=user&&llActive?`<button class="mark-seen-btn${isSeen(b.id)?' seen':''}" onclick="markSeen(${b.id})">${isSeen(b.id)?'✓ Vista':'Marcar como vista'}</button>`:'';
    h+=`<div class="detail">
      <div class="drawer-tabs">
        <button class="drawer-tab${drawerTab==='ficha'?' active':''}" data-tab="ficha" onclick="switchTab('ficha')">Ficha</button>
        <button class="drawer-tab${drawerTab==='dist'?' active':''}" data-tab="dist" onclick="switchTab('dist')">Distribución</button>
      </div>
      <div class="tab-pane${drawerTab==='ficha'?' active':''}" data-tab="ficha">
      <div class="detail-top">
        <div class="sprite-col">
          <div class="sprite-main${wide?' wide':''}" onclick="openLb('${imgSrc}')" title="Ver ampliado">
            <div class="sprite-wrap">
              ${imgSrc?`<img src="${imgSrc}" alt="${t}">`:'<span style="font-size:11px;color:#888780">pendiente</span>'}
              ${sexMain}
            </div>
          </div>
          <div class="sprite-thumbs">
            ${Object.entries(b.sprites).map(([tt,sk])=>`<div class="thumb-wrap"><div class="thumb${isWide(tt)?' wide':''}${t===tt?' active':''}${b.thumb_clip&&b.thumb_clip.includes(tt)?' thumb-clip':''}" onclick="st(${b.id},'${tt}')" title="${tt}"><img src="${SP[sk]||''}" alt="${tt}">${sk.endsWith('_M')?'<span class="thumb-sex">&#9794;</span>':sk.endsWith('_F')?'<span class="thumb-sex">&#9792;</span>':''}</div><span class="thumb-lbl">${tt}</span></div>`).join('')}
          </div>
          ${seenBtn}
        </div>
        <div class="detail-info">
          <div class="d-header">
            <div class="d-titles">
              <div class="d-name">${b.nombre_comun}</div>
              <div class="d-sci">${b.nombre_cientifico}</div>
            </div>
            <div class="nav-btns">
              <button class="nav-btn" onclick="navBird(-1)" ${hasPrev?'':'disabled'} title="Anterior (&#8592;)">&#8592;</button>
              <span style="font-size:11px;color:#888780;min-width:32px;text-align:center">${idx+1}/${list.length}</span>
              <button class="nav-btn" onclick="navBird(1)" ${hasNext?'':'disabled'} title="Siguiente (&#8594;)">&#8594;</button>
              <button class="close-btn" onclick="cls()" title="Cerrar">&#10005;</button>
            </div>
          </div>
          <div class="meta-grid">
            <div class="meta"><div class="meta-lbl">Familia</div><div class="meta-val clickable" onclick="tog('familia','${b.familia}')">${b.familia}</div></div>
            <div class="meta"><div class="meta-lbl">Orden</div><div class="meta-val clickable" onclick="tog('orden','${b.orden}')">${b.orden}</div></div>
            <div class="meta"><div class="meta-lbl">Estado</div><div class="meta-val">${iTag(b.estado,true)}</div></div>
            <div class="meta"><div class="meta-lbl">Tamaño</div><div class="meta-val clickable" onclick="tog('tamanio','${b.tamanio}')">${b.tamanio}</div></div>
            <div class="meta"><div class="meta-lbl">Largo</div><div class="meta-val">${b.largo_cm} cm</div></div>
            ${b.envergadura_cm?`<div class="meta"><div class="meta-lbl">Envergadura</div><div class="meta-val">${b.envergadura_cm} cm</div></div>`:''}
          </div>
          ${Object.entries(b.descripcion).map(([k,v])=>`<div class="desc-lbl">${k}</div><div class="desc-txt">${v}</div>`).join('')}
        </div>
      </div>
      <div class="sec-ttl">Hábitat</div>
      <div class="tags" style="margin-bottom:10px">${b.habitat.map(h=>fTag('habitat',h,HC[h]||'tag')).join('')}</div>
      <div class="sec-ttl">Residencia</div>
      <div class="tags" style="margin-bottom:10px">${fTag('residencia',b.residencia,RC[b.residencia]||'tag')}</div>
      <div class="sec-ttl">Provincias</div>
      <div class="provs">${b.provincias.map(p=>`<span class="prov${isA('provincia',p)?' prov-active':''}" onclick="tog('provincia','${p}')">${p}</span>`).join('')}</div>
      <div class="sec-ttl">Curiosidades</div>
      <div class="curiosidades">${b.curiosidades}</div>
    </div>
    <div class="tab-pane${drawerTab==='dist'?' active':''}" data-tab="dist" style="padding:12px 16px">
      ${b.mapa?`<img class="dist-map" src="${b.mapa}" alt="Mapa de distribución de ${b.nombre_comun}" loading="lazy">`:'<div class="no-map">Mapa de distribución no disponible aún.</div>'}
    </div>
    </div>`;
  }

  if(!list.length)h+='<div class="empty">No se encontraron aves con ese criterio.</div>';
  else{
    h+='<div class="grid-controls"><div class="sex-toggle"><button class="'+(gridSex==='M'?'on':'')+'" onclick="setGridSex(\'M\')">&#9794; Macho</button><button class="'+(gridSex==='F'?'on':'')+'" onclick="setGridSex(\'F\')">&#9792; Hembra</button></div></div>';
    h+='<div class="grid">';
    h+=list.map(b=>{
      const{k0,sk0}=pickGridSprite(b);const src=sk0?SP[sk0]||'':'';
      const badge0=sk0&&sk0.endsWith('_M')?'<span class="sex-badge">&#9794;</span>':sk0&&sk0.endsWith('_F')?'<span class="sex-badge">&#9792;</span>':'';
      const unseen=user&&llActive&&!isSeen(b.id);
      const seenMark=user&&llActive&&isSeen(b.id)?'<span class="seen-badge">✓</span>':'';
      return `<div class="card${sel===b.id?' active':''}" onclick="pick(${b.id})"><div class="card-img${unseen?' ll-unseen':''}">${src?`<div class="sprite-wrap"><img src="${src}" alt="${b.nombre_comun}">${badge0}${seenMark}</div>`:''}</div><div class="card-body"><div class="card-num">${b.num}</div><div class="card-name">${b.nombre_comun}${b.exotica?'<span class="exo-badge" title="Especie exótica: introducida por el ser humano">EX</span>':''}</div><div class="card-sci">${b.nombre_cientifico}</div><div class="tags">${iTag(b.estado,false)}<span class="tag ${TC[b.tamanio]}">${b.tamanio}</span></div></div></div>`;
    }).join('');
    h+='</div>';
  }
  document.getElementById('app').innerHTML=h;
}
loadState();
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
