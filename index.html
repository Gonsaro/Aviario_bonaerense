<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviario Bonaerense</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D9E75">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f4f0;color:#1a1a18;min-height:100vh}
@media(prefers-color-scheme:dark){body{background:#1a1a18;color:#f0ede4}}
.header{padding:1.25rem 1.5rem 0.75rem;border-bottom:0.5px solid rgba(0,0,0,0.1);background:#fff}
@media(prefers-color-scheme:dark){.header{background:#242420;border-color:rgba(255,255,255,0.08)}}
.logo{font-size:22px;font-weight:500}.logo span{color:#1D9E75}
.subtitle{font-size:12px;color:#888780;margin-top:2px}
.toolbar{display:flex;gap:8px;align-items:center;padding:0.75rem 1.5rem;border-bottom:0.5px solid rgba(0,0,0,0.08);background:#fff;flex-wrap:wrap}
@media(prefers-color-scheme:dark){.toolbar{background:#242420;border-color:rgba(255,255,255,0.06)}}
.toolbar input{flex:1;min-width:150px;padding:7px 10px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.15);background:#f5f4f0;font-size:13px;font-family:inherit;color:#1a1a18;outline:none}
@media(prefers-color-scheme:dark){.toolbar input{background:#1a1a18;border-color:rgba(255,255,255,0.1);color:#f0ede4}}
.toolbar select{padding:7px 10px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.15);background:#f5f4f0;font-size:13px;font-family:inherit;color:#1a1a18;cursor:pointer;outline:none}
@media(prefers-color-scheme:dark){.toolbar select{background:#1a1a18;border-color:rgba(255,255,255,0.1);color:#f0ede4}}
.sort-lbl{font-size:12px;color:#888780;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:1.25rem 1.5rem}
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color 0.15s,transform 0.1s}
@media(prefers-color-scheme:dark){.card{background:#2c2c28;border-color:rgba(255,255,255,0.08)}}
.card:hover{border-color:rgba(0,0,0,0.3);transform:translateY(-1px)}
.card.active{border:1.5px solid #1D9E75}
.card-img{width:100%;aspect-ratio:1/1;background:#f1efe8;display:flex;align-items:center;justify-content:center;overflow:hidden}
@media(prefers-color-scheme:dark){.card-img{background:#1f1f1c}}
.card-img img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
.card-body{padding:10px 12px 12px}
.card-num{font-size:11px;color:#888780;margin-bottom:2px}
.card-name{font-size:14px;font-weight:500;margin-bottom:3px}.card-name:has(.exo-badge){display:flex;align-items:center;gap:6px}.exo-badge{flex:none;font-size:9px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;padding:1px 5px;border-radius:8px;background:#c62828;color:#fff;border:1px solid #e53935}
.card-sci{font-size:11px;color:#888780;font-style:italic;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10px;padding:2px 7px;border-radius:10px;cursor:default}
.tag.clickable{cursor:pointer}
.iucn-LC{background:#EAF3DE;color:#27500A}
@media(prefers-color-scheme:dark){.iucn-LC{background:#173404;color:#C0DD97}}
.hab-humedal{background:#E6F1FB;color:#0C447C}.hab-ribere{background:#E1F5EE;color:#085041}
.hab-costa{background:#EEEDFE;color:#3C3489}.hab-pastizal{background:#EAF3DE;color:#27500A}
.hab-agricola{background:#FAEEDA;color:#633806}.hab-urbano{background:#F1EFE8;color:#444441}
.hab-monte{background:#FAECE7;color:#712B13}.hab-bosque{background:#E8F5E0;color:#1A4D0A}
.hab-aereo{background:#F0EEFB;color:#3D2D8A}.hab-laguna{background:#E6F1FB;color:#0C447C}
.tam-chico{background:#F0EEFB;color:#3D2D8A}.tam-mediano{background:#FFF0E0;color:#7A4010}
.tam-grande{background:#FCEBEB;color:#791F1F}
.res-permanente{background:#E1F5EE;color:#085041}.res-estival{background:#FAEEDA;color:#633806}.res-invernal{background:#E6F1FB;color:#0C447C}
.hab-arbolado{background:#E8F5E0;color:#2E5A12}.hab-marino{background:#E0EEF8;color:#0B3A66}
@media(prefers-color-scheme:dark){
  .hab-humedal{background:#042C53;color:#B5D4F4}.hab-ribere{background:#04342C;color:#9FE1CB}
  .hab-costa{background:#26215C;color:#CECBF6}.hab-pastizal{background:#173404;color:#C0DD97}
  .hab-agricola{background:#412402;color:#FAC775}.hab-urbano{background:#2C2C2A;color:#D3D1C7}
  .hab-monte{background:#4A1B0C;color:#F5C4B3}.hab-bosque{background:#0D2E04;color:#A8D88A}
  .hab-aereo{background:#1E1640;color:#C5BCEF}.hab-laguna{background:#042C53;color:#B5D4F4}
  .tam-chico{background:#1E1640;color:#C5BCEF}.tam-mediano{background:#3D2000;color:#F5C090}
  .tam-grande{background:#501313;color:#F7C1C1}
  .res-permanente{background:#04342C;color:#9FE1CB}.res-estival{background:#412402;color:#FAC775}.res-invernal{background:#042C53;color:#B5D4F4}
  .hab-arbolado{background:#14320A;color:#B2DB94}.hab-marino{background:#08294A;color:#A9CCEF}
}
.detail{background:#fff;border-top:0.5px solid rgba(0,0,0,0.1);padding:1.25rem}
@media(prefers-color-scheme:dark){.detail{background:#2c2c28;border-color:rgba(255,255,255,0.08)}}
.detail-top{display:flex;gap:1.25rem;margin-bottom:1rem;flex-wrap:wrap}
.sprite-col{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0}
.sprite-main{width:150px;height:150px;background:#f1efe8;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
@media(prefers-color-scheme:dark){.sprite-main{background:#1f1f1c}}
.sprite-main.wide{width:220px;height:130px}
.sprite-main img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
.sprite-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;width:100%;height:100%}
.sex-badge{position:absolute;top:4px;right:5px;font-size:13px;font-weight:700;color:#333;line-height:1;pointer-events:none;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.grid-controls{display:flex;gap:6px;padding:8px 1.5rem 4px;align-items:center}
.sex-toggle{display:inline-flex;border-radius:20px;border:1.5px solid #d8d5cc;overflow:hidden;background:#f1efe8}
.sex-toggle button{padding:4px 12px;border:none;border-radius:0;background:transparent;font-size:13px;font-family:inherit;cursor:pointer;color:#555;transition:background 0.15s,color 0.15s;line-height:1.4}
.sex-toggle button.on{background:#1D9E75;color:#fff;font-weight:600}
.sprite-thumbs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:220px}
.thumb-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.thumb{width:44px;height:44px;background:#f1efe8;border-radius:8px;border:0.5px solid rgba(0,0,0,0.1);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
@media(prefers-color-scheme:dark){.thumb{background:#1f1f1c;border-color:rgba(255,255,255,0.08)}}
.thumb.wide{width:64px;height:40px}.thumb.active{border:1.5px solid #1D9E75}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
.thumb-sex{position:absolute;top:1px;right:2px;font-size:7px;font-weight:700;color:#333;line-height:1;text-shadow:0 0 2px #fff,0 0 2px #fff}
.thumb-lbl{font-size:8px;color:#888780;text-align:center;line-height:1;padding:0 2px}
.detail-info{flex:1;min-width:200px}
.d-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.d-titles{flex:1}
.d-name{font-size:20px;font-weight:500;margin-bottom:2px}
.d-sci{font-size:13px;font-style:italic;color:#888780}
.nav-btns{display:flex;gap:6px;flex-shrink:0;align-items:center}
.nav-btn{background:#f1efe8;border:0.5px solid rgba(0,0,0,0.12);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:#444441;transition:background 0.1s}
.nav-btn:hover{background:#e4e2da}
.nav-btn:disabled{opacity:0.3;cursor:default}
@media(prefers-color-scheme:dark){.nav-btn{background:#1f1f1c;border-color:rgba(255,255,255,0.08);color:#b4b2a9}.nav-btn:hover{background:#2c2c28}}
.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.meta{background:#f1efe8;border-radius:8px;padding:8px 10px}
@media(prefers-color-scheme:dark){.meta{background:#1f1f1c}}
.meta-lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:#888780;margin-bottom:2px}
.meta-val{font-size:13px;font-weight:500}
.meta-val.clickable{cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(0,0,0,0.2)}
@media(prefers-color-scheme:dark){.meta-val.clickable{text-decoration-color:rgba(255,255,255,0.2)}}
.desc-lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:#888780;margin-bottom:3px;margin-top:8px}
.desc-txt{font-size:13px;color:#5f5e5a;line-height:1.6}
@media(prefers-color-scheme:dark){.desc-txt{color:#b4b2a9}}
.sec-ttl{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:#888780;margin:10px 0 6px}
.provs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.prov{font-size:11px;padding:2px 8px;border-radius:10px;background:#f1efe8;color:#5f5e5a;border:0.5px solid rgba(0,0,0,0.1);cursor:pointer}
@media(prefers-color-scheme:dark){.prov{background:#1f1f1c;color:#b4b2a9;border-color:rgba(255,255,255,0.08)}}
.prov.prov-active{outline:1.5px solid #1D9E75}
.curiosidades{font-size:13px;color:#5f5e5a;line-height:1.6;border-left:2px solid #1D9E75;padding-left:12px;margin-top:4px}
@media(prefers-color-scheme:dark){.curiosidades{color:#b4b2a9}}
.dist-map{width:100%;border-radius:8px;display:block;margin-top:4px}
.drawer-tabs{display:flex;border-bottom:1px solid rgba(0,0,0,0.08);background:#fff;position:sticky;top:0;z-index:1}
.drawer-tab{flex:1;padding:10px 0;font-size:13px;font-weight:500;color:#888780;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;transition:color 0.15s,border-color 0.15s}
.drawer-tab.active{color:#1D9E75;border-bottom-color:#1D9E75}
.tab-pane{display:none;padding:0}
.tab-pane.active{display:block}
.no-map{padding:40px 20px;text-align:center;color:#888780;font-size:13px}
@media(prefers-color-scheme:dark){.drawer-tabs{background:#242420}.drawer-tab.active{color:#1D9E75}}
@media(max-width:480px){
  body{overflow-x:hidden}
  .detail{padding:0.75rem}
  .detail-top{flex-direction:column;gap:0.75rem}
  .sprite-col{flex-direction:row;align-items:flex-start;gap:10px}
  .sprite-main{width:90px;height:90px;flex-shrink:0}
  .sprite-main.wide{width:130px;height:77px;flex-shrink:0}
  .sprite-thumbs{max-width:none;justify-content:flex-start}
  .detail-info{min-width:0}
  .meta-grid{grid-template-columns:repeat(2,1fr)}
  .d-name{font-size:17px}
}
.close-btn{background:none;border:none;cursor:pointer;font-size:18px;color:#888780;line-height:1;flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:8px;padding:0.5rem 1.5rem;font-size:12px;color:#888780;border-bottom:0.5px solid rgba(0,0,0,0.08);background:#fff;flex-wrap:wrap}
@media(prefers-color-scheme:dark){.breadcrumb{background:#2c2c28;border-color:rgba(255,255,255,0.08)}}
.bc-tag{background:#f1efe8;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:500;color:#1a1a18}
@media(prefers-color-scheme:dark){.bc-tag{background:#1f1f1c;color:#f0ede4}}
.bc-close{background:none;border:none;cursor:pointer;color:#888780;font-size:16px;padding:0;line-height:1}
.active-ring{outline:1.5px solid #1D9E75;outline-offset:1px}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:90vw;max-height:90vh;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:4px}
.lb-close{position:fixed;top:1rem;right:1.25rem;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1}
.lb-content{display:flex;flex-direction:column;align-items:center;gap:12px;cursor:zoom-out}
.lb-label{font-size:13px;color:rgba(255,255,255,0.7);letter-spacing:0.5px;text-transform:capitalize}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:24px;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background 0.15s;z-index:10000}
.lb-nav:hover{background:rgba(255,255,255,0.25)}
.lb-nav:disabled{opacity:0.2;cursor:default}
.lb-prev{left:1.25rem}
.lb-next{right:1.25rem}
.empty{padding:2rem 1.5rem;color:#888780;font-size:14px}
#header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.login-btn{padding:6px 12px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.15);background:#1D9E75;color:#fff;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap}
.login-btn:hover{background:#178a65}
.ll-toggle{padding:6px 12px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.15);background:#f1efe8;color:#1a1a18;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:background 0.15s,color 0.15s}
.ll-toggle.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
.city-toggle{align-self:center;padding:6px 14px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.15);background:#f1efe8;color:#1a1a18;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:background 0.15s,color 0.15s}
.city-toggle.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
.header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
/* En pantallas angostas el botón de modo ciudad baja a su propia fila, centrado */
@media(max-width:600px){.header-row{flex-wrap:wrap}.header-row .logo{white-space:nowrap}.city-toggle{order:3;flex:0 0 100%;margin-top:8px}}
.trophy-btn{padding:6px 8px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.15);background:#f1efe8;font-size:16px;cursor:pointer;line-height:1}
.user-chip{font-size:12px;color:#888780;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.user-chip:hover{color:#1a1a18}
.ll-unseen img{filter:grayscale(100%) opacity(0.55)}
.seen-badge{position:absolute;top:4px;left:5px;font-size:12px;color:#1D9E75;font-weight:700;line-height:1;text-shadow:0 0 3px #fff,0 0 3px #fff}
.mark-seen-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1.5px solid #1D9E75;background:transparent;color:#1D9E75;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;transition:background 0.15s,color 0.15s;margin-top:8px}
.mark-seen-btn.seen{background:#1D9E75;color:#fff}
.mark-seen-btn:hover:not(.seen){background:#f0faf5}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:10000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:1.5rem;width:280px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,0.2)}
.modal-title{font-size:18px;font-weight:500}
.modal-sub{font-size:12px;color:#888780;margin-top:-6px}
.modal input{padding:9px 12px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.15);font-size:14px;font-family:inherit;outline:none;background:#f5f4f0;color:#1a1a18}
.modal input:focus{border-color:#1D9E75}
.modal-btn{padding:9px;border-radius:8px;border:none;background:#1D9E75;color:#fff;font-size:14px;font-family:inherit;cursor:pointer;font-weight:500}
.modal-btn:hover{background:#178a65}
.modal-cancel{padding:9px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.12);background:#f1efe8;color:#444;font-size:14px;font-family:inherit;cursor:pointer}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:10001}
.drawer-overlay.open{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:300px;max-width:90vw;background:#fff;z-index:10002;transform:translateX(100%);transition:transform 0.25s ease;overflow-y:auto;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.25rem 0.75rem;border-bottom:0.5px solid rgba(0,0,0,0.1);position:sticky;top:0;background:#fff;z-index:1}
.drawer-title{font-size:18px;font-weight:500}
.drawer-count{font-size:12px;color:#888780;margin-left:6px}
#trophy-list{padding:0.75rem 1rem;display:flex;flex-direction:column;gap:8px}
.trophy-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#f5f4f0;opacity:0.38;transition:opacity 0.2s}
.trophy-item.unlocked{opacity:1;background:#f0faf5;border:0.5px solid rgba(29,158,117,0.3)}
.trophy-icon{width:56px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.trophy-icon img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}
.trophy-item.unlocked{cursor:pointer}
.trophy-info{flex:1;min-width:0}
.trophy-name{font-size:13px;font-weight:500;margin-bottom:2px}
.trophy-cond{font-size:11px;color:#888780}
.fam-section-ttl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#888780;font-weight:600;padding:12px 2px 4px}
.fam-row{display:flex;flex-direction:column;gap:5px;padding:8px 10px;border-radius:10px;background:#f5f4f0}
.fam-row-top{display:flex;justify-content:space-between;align-items:center}
.fam-name{font-size:12px;font-weight:500}
.fam-bar-wrap{display:flex;align-items:center;gap:8px}
.fam-bar-bg{flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,0.1);overflow:hidden}
.fam-bar-fill{height:100%;border-radius:3px;background:#1D9E75;transition:width 0.4s}
.fam-pct{font-size:10px;color:#888780;width:26px;text-align:right;white-space:nowrap}
.fam-tiers{display:flex;gap:3px;align-items:center}
.fam-tiers img{width:22px;height:22px;object-fit:contain;image-rendering:pixelated;opacity:0.22}
.fam-tiers img.earned{opacity:1}
.tc-icon img{width:110px;height:110px;object-fit:contain;image-rendering:pixelated}
.trophy-lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:10200;align-items:center;justify-content:center;cursor:zoom-out;flex-direction:column;gap:14px}
.trophy-lb.open{display:flex}
.trophy-lb img{max-width:80vw;max-height:75vh;object-fit:contain;image-rendering:pixelated}
.trophy-lb-name{font-size:15px;color:#fff;font-weight:500;text-align:center}
.trophy-lb-cond{font-size:12px;color:rgba(255,255,255,0.6);text-align:center}
.trophy-cel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.62);z-index:10100;align-items:center;justify-content:center}
.trophy-cel-overlay.open{display:flex}
.trophy-cel{background:#fff;border-radius:20px;padding:2rem 1.75rem 1.5rem;width:290px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 16px 56px rgba(0,0,0,0.28);animation:tc-pop 0.38s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes tc-pop{from{transform:scale(0.65);opacity:0}to{transform:scale(1);opacity:1}}
.tc-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#1D9E75;font-weight:700}
.tc-icon{font-size:58px;line-height:1;margin:4px 0}
.tc-name{font-size:20px;font-weight:600;margin-bottom:2px}
.tc-cond{font-size:12px;color:#888780}
.tc-btn{width:100%;padding:10px;border-radius:10px;border:none;background:#1D9E75;color:#fff;font-size:14px;font-family:inherit;cursor:pointer;font-weight:500;margin-top:6px;transition:background 0.15s}
.tc-btn:hover{background:#178a65}
@media(prefers-color-scheme:dark){
  .trophy-cel{background:#2c2c28;color:#f0ede4}
  .tc-cond{color:#888780}
  .modal{background:#2c2c28;color:#f0ede4}
  .modal input{background:#1a1a18;border-color:rgba(255,255,255,0.1);color:#f0ede4}
  .modal-cancel{background:#1f1f1c;color:#b4b2a9;border-color:rgba(255,255,255,0.08)}
  .drawer{background:#242420;color:#f0ede4}
  .drawer-header{background:#242420;border-color:rgba(255,255,255,0.08)}
  .trophy-item{background:#1f1f1c}
  .trophy-item.unlocked{background:#0a2018;border-color:rgba(29,158,117,0.4)}
  .fam-row{background:#1f1f1c}
  .fam-bar-bg{background:rgba(255,255,255,0.1)}
  .ll-toggle{background:#1f1f1c;color:#f0ede4;border-color:rgba(255,255,255,0.08)}
  .ll-toggle.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
  .city-toggle{background:#1f1f1c;color:#f0ede4;border-color:rgba(255,255,255,0.08)}
  .city-toggle.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
  .trophy-btn{background:#1f1f1c;border-color:rgba(255,255,255,0.08)}
  .mark-seen-btn{background:transparent;border-color:#1D9E75;color:#1D9E75}
  .mark-seen-btn.seen{background:#1D9E75;color:#fff}
  .mark-seen-btn:hover:not(.seen){background:#0a2018}
  .user-chip:hover{color:#f0ede4}
}
</style>
</head>
<body>
<div class="header">
  <div class="header-row">
    <div>
      <div class="logo">Aviar<span>io</span> <span style="font-size:13px;font-weight:400;color:#888780">Buenos Aires</span></div>
      <div class="subtitle" id="subtitle">50 especies</div>
    </div>
    <button class="city-toggle" id="city-toggle" onclick="toggleCiudad()" title="Muestra solo las aves que se ven en CABA y el Gran Buenos Aires">Modo ciudad</button>
    <div id="header-actions"></div>
  </div>
</div>
<div class="toolbar">
  <input type="text" id="search" placeholder="Buscar por nombre, familia u orden…" oninput="render()">
  <span class="sort-lbl">Ordenar:</span>
  <select id="sort" onchange="render()">
    <option value="num">Nº de especie</option>
    <option value="nombre">Nombre común A–Z</option>
    <option value="cientifico">Nombre científico A–Z</option>
  </select>
</div>
<div id="app"></div>
<div class="lb" id="lb">
  <button class="lb-close" onclick="closeLb()">&#10005;</button>
  <button class="lb-nav lb-prev" id="lb-prev" onclick="lbNav(-1)">&#8592;</button>
  <div class="lb-content" onclick="closeLb()">
    <div style="position:relative;display:inline-flex">
      <img id="lb-img" src="" alt="sprite ampliado">
      <span id="lb-sex" style="position:absolute;top:8px;right:10px;font-size:22px;font-weight:700;color:#333;text-shadow:0 0 4px #fff,0 0 4px #fff;pointer-events:none"></span>
    </div>
    <div class="lb-label" id="lb-label"></div>
  </div>
  <button class="lb-nav lb-next" id="lb-next" onclick="lbNav(1)">&#8594;</button>
</div>
<div class="modal-overlay" id="login-modal">
  <div class="modal">
    <div class="modal-title">Iniciar sesión</div>
    <div class="modal-sub">Solo tu nombre por ahora — el acceso real viene pronto.</div>
    <input type="text" id="login-name" placeholder="Tu nombre" autocomplete="off" maxlength="32" oninput="this.value=this.value.replace(/[<>]/g,'')" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="modal-btn" onclick="doLogin()">Entrar</button>
    <button class="modal-cancel" onclick="closeLogin()">Cancelar</button>
  </div>
</div>
<div class="drawer-overlay" id="trophy-overlay" onclick="closeTrophies()"></div>
<div class="drawer" id="trophy-drawer">
  <div class="drawer-header">
    <div><span class="drawer-title">Logros</span><span class="drawer-count" id="trophy-count"></span></div>
    <button class="close-btn" onclick="closeTrophies()">&#10005;</button>
  </div>
  <div id="trophy-list"></div>
</div>
<div class="trophy-lb" id="trophy-lb" onclick="closeTrophyLb()">
  <img id="trophy-lb-img" src="" alt="">
  <div class="trophy-lb-name" id="trophy-lb-name"></div>
  <div class="trophy-lb-cond" id="trophy-lb-cond"></div>
</div>
<div class="trophy-cel-overlay" id="trophy-cel-overlay" onclick="closeTrophyCel()">
  <div class="trophy-cel" onclick="event.stopPropagation()">
    <div class="tc-label" id="tc-label">¡Nuevo logro desbloqueado!</div>
    <div class="tc-icon" id="tc-icon"></div>
    <div class="tc-name" id="tc-name"></div>
    <div class="tc-cond" id="tc-cond"></div>
    <button class="tc-btn" onclick="closeTrophyCel()">¡Genial!</button>
  </div>
</div>

{id:124,num:"#001",n_lista:1,nombre_comun:"Ñandú",nombre_cientifico:"Rhea americana",familia:"Rheidae",orden:"Rheiformes",descripcion:{macho:"Ave enorme que no vuela, con cuello y patas muy largos y un plumaje suelto y desflecado. Cabeza chica, con la corona negra. Pico gris pardusco, ancho y aplanado. Ojo gris pardusco claro. Dorso gris y pardo. Alas grandes, grises, que usa para equilibrarse al correr. Base del cuello y pecho negros; vientre blanquecino. Patas grisáceas, fuertes, sin plumas, con tres dedos.",hembra:"La hembra es algo más chica y más clara, gris con el vientre blanquecino, casi sin negro en la base del cuello y el pecho."},habitat:["pastizal","agrícola"],residencia:"permanente",tamanio:"grande",largo_cm:180,envergadura_cm:null,estado:"NT",provincias:["Buenos Aires","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","Catamarca","Salta","Jujuy","Río Negro"],curiosidades:"Su nombre viene del guaraní 'ñandu guasu', que quiere decir 'araña grande'. Aunque no puede volar corre muy rápido y usa las alas para no perder el equilibrio en los giros. Come de todo: semillas, frutos, insectos, reptiles, ranas, pequeños mamíferos y pichones. En la época de cría el macho da un bramido parecido a un mugido y corteja a varias hembras; después cava un nido en el suelo, donde todas ellas ponen sus huevos —de 10 a 30 o más— y es él quien los incuba y cuida a los charitos. Mientras empolla puede volverse peligroso. A nivel mundial está considerado Casi Amenazado.",sprites:{macho:"Rhea_americana_M",hembra:"Rhea_americana_F"},audio_ebird_code:"grerhe1",mapa:"Maps/Rhea_americana_map.png",thumb_sprite:"",exotica:false,amba:0.03},
{id:132,num:"#002",n_lista:14,nombre_comun:"Inambú Campestre",nombre_cientifico:"Nothura maculosa",familia:"Tinamidae",orden:"Tinamiformes",descripcion:{adulto:"Ave de suelo mediana, rechoncha, de cuello fino, cabeza chica y cola casi invisible, parecida a una perdiz. Frente y corona oscuras con rayitas ocráceas; suele erizar las plumas de la corona en un copetito. Cuello ocráceo con estrías oscuras. Pico pardo. Ojo amarillo o pardo anaranjado. Dorso pardo manchado de negro, blanco y ocre. Alas pardas rayadas de ocre rojizo; las plumas de vuelo pardas con barras rojizas. Cola parda. Garganta blanca. Pecho ocráceo canela con manchitas pardas. Costados con barras pardas. Vientre ocráceo. Patas pardo amarillentas. Macho y hembra son iguales."},habitat:["pastizal","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:"20-25",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","Catamarca","Tucumán","Salta","Jujuy","Neuquén","Río Negro"],curiosidades:"Es la 'perdiz chica' o 'perdiz común' de los campos pampeanos, aunque no es una perdiz verdadera sino un inambú, pariente lejano del ñandú. Anda sola o en pareja entre los pastos y, ante un peligro, se queda quieta confiando en su plumaje que se confunde con el suelo; si se la acerca demasiado sale volando de golpe, con un aleteo ruidoso, y vuelve a bajar a poca distancia. Come semillas, brotes e insectos. Su voz es una serie de silbidos agudos y acelerados que se escucha mucho en primavera. Hace el nido en el suelo, escondido entre los pastos, y como en todos los inambúes es el macho el que incuba los huevos, de color vinoso brillante.",sprites:{adulto:"Nothura_maculosa_D"},audio_ebird_code:"sponot1",mapa:"Maps/Nothura_maculosa_map.png",thumb_sprite:"",exotica:false,amba:1.25},
{id:1,num:"#003",n_lista:20,nombre_comun:"Chajá",nombre_cientifico:"Chauna torquata",familia:"Anhimidae",orden:"Anseriformes",descripcion:{adulto:"Ave grande y robusta. Cabeza gris pálido con cresta gris desgreñada. Pico corto, gris oscuro a pardo grisáceo, con la base rosada. Ojo pardo, rodeado de piel desnuda roja. Fino collar blanco sobre collar negro angosto alrededor del cuello. Cuerpo y alas azul-gris con escamado pálido en el pecho. Partes inferiores gris-blancuzco. Patas largas rosadas a rojas, con uñas negras."},habitat:["humedal","pastizal","ribereño"],residencia:"permanente",tamanio:"grande",largo_cm:85,envergadura_cm:170,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Tucumán","Salta","Jujuy"],curiosidades:"Tiene un llamado muy potente que puede escucharse a varios kilómetros. A pesar de su tamaño es un gran volador y puede planear durante horas en corrientes de aire. Posee dos espolones óseos en cada ala que usa para defenderse.",sprites:{adulto:"Chauna_torquata_D"},audio_ebird_code:"souscr1",mapa:"Maps/Chauna_torquata_map.png",thumb_sprite:"",exotica:false,amba:19.52},
{id:158,num:"#004",n_lista:21,nombre_comun:"Sirirí Colorado",nombre_cientifico:"Dendrocygna bicolor",familia:"Anatidae",orden:"Anseriformes",descripcion:{adulto:"Pato de patas y cuello largos y postura erguida. Cabeza marrón rojiza, con la cara más clara. Cuello blanquecino estriado de pardo grisáceo, con una línea negra por detrás desde la nuca hasta el dorso. Pico y patas grises con tinte celeste. Ojo pardo oscuro. Dorso negro con las puntas de las plumas canela rojizo, que forman un barrado. Alas pardo oscuras con las cubiertas castañas. Rabadilla blanquecina; cola negra. Abajo canela, con los costados ocráceos estriados de crema. Macho y hembra son iguales."},habitat:["humedal","laguna","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:"42-50",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","Mendoza","Salta","Santa Fe","Santiago del Estero"],curiosidades:"Su nombre imita su silbido, que da en vuelo y se oye mucho de noche, porque suele moverse entre lagunas y arrozales después del atardecer. Anda en bandadas, camina bien y nada poco; come semillas y brotes de plantas acuáticas.",sprites:{adulto:"Dendrocygna_bicolor_D"},audio_ebird_code:"fuwduc",mapa:"Maps/Dendrocygna_bicolor_map.png",thumb_sprite:"",exotica:false,amba:6.24},
{id:2,num:"#005",n_lista:22,nombre_comun:"Sirirí Pampa",nombre_cientifico:"Dendrocygna viduata",familia:"Anatidae",orden:"Anseriformes",descripcion:{adulto:"Pato de silueta erguida con cuello largo. Cara y frente blancas, contrastando abruptamente con la corona y nuca negras. Cuello castaño intenso. Dorso, alas, cola y vientre negros. Flancos finamente barrados negro y blanco. Pico negro aplastado, con una banda gris celeste cerca de la punta. Patas grises. Ambos sexos similares."},habitat:["humedal","laguna","ribereño"],residencia:"permanente",tamanio:"mediano",largo_cm:50,envergadura_cm:90,estado:"LC",provincias:["CABA","Buenos Aires","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa"],curiosidades:"A diferencia de la mayoría de los patos, forma parejas que pueden durar toda la vida. Su canto es un silbido trillado triple, audible de noche, que le da el nombre popular. Puede nidificar en huecos de árboles.",sprites:{adulto:"Dendrocygna_viduata_D"},audio_ebird_code:"wfwduc1",mapa:"Maps/Dendrocygna_viduata_map.png",thumb_sprite:"",exotica:false,amba:14.25},
{id:169,num:"#006",n_lista:24,nombre_comun:"Ganso Doméstico",nombre_cientifico:"Anser anser",familia:"Anatidae",orden:"Anseriformes",descripcion:{adulto:"Ganso grande y pesado, de vientre redondeado y cuello grueso. El tipo más parecido a su antepasado silvestre es gris pardo: cabeza y cuello gris pardos, pico grueso naranja con la punta blanquecina y ojo oscuro. Dorso y alas gris pardos con los bordes de las plumas claros, que forman un barrado prolijo. Pecho gris claro, vientre y plumas de debajo de la cola blancos. Patas anaranjadas. Hay razas domésticas todas blancas o manchadas de blanco y gris. Macho y hembra son iguales."},habitat:["urbano","agrícola","humedal"],residencia:"permanente",tamanio:"grande",largo_cm:"74-91",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chubut","Córdoba","Entre Ríos","Jujuy","Mendoza","Neuquén","Río Negro","Salta","San Luis","Santa Cruz","Santa Fe","Tierra del Fuego"],curiosidades:"Desciende del Ganso Común silvestre de Europa y Asia, domesticado hace miles de años para carne, huevos y plumas. En el campo se lo cría suelto en patios y chacras, y en parques y lagunas urbanas vive en grupos semisilvestres. Es muy territorial: grazna fuerte y estira el cuello ante cualquier intruso, por eso se lo usa como 'perro guardián'.",sprites:{adulto:"Anser_anser_D"},audio_ebird_code:"gragoo",mapa:"Maps/Anser_anser_map.png",thumb_sprite:"",exotica:true,amba:2.84},
{id:3,num:"#007",n_lista:25,nombre_comun:"Cisne Cuello Negro",nombre_cientifico:"Cygnus melancoryphus",familia:"Anatidae",orden:"Anseriformes",descripcion:{adulto:"El mayor cisne de Sudamérica, inconfundible. Cuello y cabeza completamente negros. Fina línea blanca desde la base del pico hasta la nuca, por encima del ojo. Cuerpo y alas enteramente blancos. Carúncula roja prominente en la base del pico azulado. Patas rosadas. Muy acuático; se desplaza torpemente en tierra."},habitat:["humedal","laguna","ribereño"],residencia:"permanente",tamanio:"grande",largo_cm:115,envergadura_cm:170,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Córdoba","Mendoza","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Es el único cisne nativo de Sudamérica. Los adultos transportan a los pichones recién nacidos sobre el dorso para protegerlos de los depredadores acuáticos. La carúncula roja en la base del pico se agranda visiblemente durante la temporada reproductiva.",sprites:{adulto:"Cygnus_melancoryphus_D"},audio_ebird_code:"blnswa2",mapa:"Maps/Cygnus_melancoryphus_map.png",thumb_sprite:"",exotica:false,amba:12.24},
{id:4,num:"#008",n_lista:26,nombre_comun:"Coscoroba",nombre_cientifico:"Coscoroba coscoroba",familia:"Anatidae",orden:"Anseriformes",descripcion:{adulto:"Ave grande, enteramente blanca salvo las puntas de las primarias, que son negras (visibles principalmente en vuelo). Pico anaranjado-rojo brillante con una cuña rosada clara en la punta. Ojo amarillo claro. Patas rojas. Sin dimorfismo sexual. Juvenil con manchas pardo-grisáceas en el cuerpo y pico oscuro."},habitat:["humedal","laguna","ribereño"],residencia:"permanente",tamanio:"grande",largo_cm:100,envergadura_cm:145,estado:"LC",provincias:["Buenos Aires","Santa Fe","Entre Ríos","Corrientes","Córdoba","Mendoza","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Es el cisne más pequeño del mundo y el único de su género. A pesar de su parecido con los cisnes, está más emparentado con los patos silbadores. Su nombre imita el llamado característico que emite: 'cos-co-roba'.",sprites:{adulto:"Coscoroba_coscoroba_D"},audio_ebird_code:"cosswa1",mapa:"Maps/Coscoroba_coscoroba_map.png",thumb_sprite:"",exotica:false,amba:17.3},
{id:79,num:"#009",n_lista:35,nombre_comun:"Pato de Collar",nombre_cientifico:"Callonetta leucophrys",familia:"Anatidae",orden:"Anseriformes",descripcion:{macho:"Pato chico y muy vistoso. Cara crema pálida, casi lisa. Una línea negra baja desde la frente por atrás de la cabeza y la nuca hasta el costado del cuello, y por delante del cuello tiene un collar blanco angosto. Pico celeste grisáceo. Ojo pardo oscuro. Dorso y hombros castaño vivo. En el ala plegada se ve el espejo verde metálico; la mancha blanca grande del ala solo se ve en vuelo. Rabadilla y cola negras. Pecho rosado durazno con pintitas oscuras. Flancos gris suave, finamente vermiculados. Mancha blanca a los costados de la zona de la cola. Patas rosadas.",hembra:"La hembra es más parda y tiene el pico plomizo azulado, más apagado que el del macho: dorso pardo oliváceo, cabeza parda con ceja blanca y manchas blancas en la cara y el cuello; partes inferiores claras con barrado fino pardo. Conserva la mancha blanca del ala, la mancha blanca atrás del flanco y las patas rosadas."},habitat:["humedal","ribereño","bosque"],residencia:"permanente",tamanio:"mediano",largo_cm:"35-38",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Tucumán","Salta","Jujuy","Catamarca"],curiosidades:"A diferencia de la mayoría de los patos, se posa en ramas: tiene uñas largas y puntiagudas en los dedos. Prefiere lagunas y arroyos rodeados de árboles, porque anida en huecos de troncos y a veces en los grandes nidos de la cotorra. Las parejas son muy unidas y el macho ayuda a criar a los patitos, que al nacer se tiran del nido al suelo. Su voz es un maullido suave en la hembra y un silbido largo en el macho.",sprites:{macho:"Callonetta_leucophrys_M",hembra:"Callonetta_leucophrys_F",vuelo:"Callonetta_leucophrys_V"},audio_ebird_code:"rintea1",mapa:"Maps/Callonetta_leucophrys_map.png",thumb_sprite:"",exotica:false,amba:10.31},
{id:5,num:"#010",n_lista:36,nombre_comun:"Pato Cutirí",nombre_cientifico:"Amazonetta brasiliensis",familia:"Anatidae",orden:"Anseriformes",descripcion:{macho:"Pato pequeño y elegante. Cabeza pardo-acanelada con área grisácea pálida en la mejilla. Pico rojo coral. Ojo pardo oscuro. Dorso pardo-oscuro. Espejo alar verde iridiscente con borde blanco, visible en reposo y en vuelo. Flancos y pecho pardo-moteados. Vientre pardo. Patas rojo-anaranjadas.",hembra:"Similar al macho pero con pico gris-oscuro, manchas blanquecinas en la cara y colores más apagados. Ojo pardo."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"mediano",largo_cm:38,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Córdoba","Tucumán","Salta","Jujuy"],curiosidades:"Es el pato más común y extendido de los montes y bañados fluviales bonaerenses. Suele verse en parejas o grupos pequeños navegando entre la vegetación acuática. A diferencia de la mayoría de los patos, anida en huecos de árboles.",sprites:{macho:"Amazonetta_brasiliensis_M",hembra:"Amazonetta_brasiliensis_F",vuelo:"Amazonetta_brasiliensis_V"},audio_ebird_code:"bratea1",mapa:"Maps/Amazonetta_brasiliensis_map.png",thumb_sprite:"",exotica:false,amba:17.34},
{id:82,num:"#011",n_lista:45,nombre_comun:"Pato Capuchino",nombre_cientifico:"Spatula versicolor",familia:"Anatidae",orden:"Anseriformes",descripcion:{adulto:"Pato chico. Mitad superior de la cabeza y nuca pardo muy oscuro, casi negro, hasta debajo del ojo; cara, garganta y parte alta del cuello color crema. Pico celeste, con la línea de arriba y la punta negras y una mancha amarilla en la base. Ojo pardo oscuro. Dorso pardo oscuro con los bordes de las plumas ocráceos. En el ala, un espejo verde metálico bordeado de blanco. Rabadilla y plumas de la base de la cola finamente vermiculadas de negro y blanco. Pecho ocráceo con pintitas negras que en los flancos se transforman en un barrado negro, gris y blanco. Patas grises. La hembra es parecida, algo más apagada y con menos amarillo en el pico."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"mediano",largo_cm:"38-43",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego","Catamarca","San Juan","Formosa"],curiosidades:"Su nombre viene de la 'capucha' oscura que contrasta con la cara clara. Es un pato tranquilo que vive en parejas o grupos chicos en lagunas, bañados y charcas de agua dulce, sobre todo las de orillas con juncos y poca vegetación flotante. Come semillas, plantas acuáticas, insectos y otros invertebrados chicos. Hace el nido escondido entre la vegetación de la orilla y pone de 5 a 10 huevos, que se incuban durante 23 a 24 días.",sprites:{adulto:"Spatula_versicolor_D",vuelo:"Spatula_versicolor_V"},audio_ebird_code:"siltea1",mapa:"Maps/Spatula_versicolor_map.png",thumb_sprite:"",exotica:false,amba:22.73},
{id:105,num:"#012",n_lista:46,nombre_comun:"Pato Cuchara",nombre_cientifico:"Spatula platalea",familia:"Anatidae",orden:"Anseriformes",descripcion:{macho:"Pato mediano, fácil de reconocer por su pico negro, largo y muy ancho en la punta, como una cuchara. Cabeza ocrácea clara con pintitas pardas, más oscura en la corona. Ojo blanco, muy llamativo en la cara. Dorso moteado de negro. Alas pardas, con las plumas de arriba celestes y una franja blanca, y un espejo verde; en reposo casi no se ven, se lucen en vuelo. Cola parda y ocrácea. Pecho y costados castaño rojizos moteados de negro; vientre más claro. Debajo de la cola, negro con una mancha blanca a los costados. Patas amarillas.",hembra:"La hembra es parda, con la cabeza ocrácea con pintitas y rayitas oscuras, la garganta blanquecina, las plumas del dorso bordeadas de canela y la parte de abajo ocrácea acanelada manchada de pardo oscuro. Mismo pico grande. Ojo pardo oscuro, patas grises y el dibujo del ala igual pero más apagado."},habitat:["humedal"],residencia:"permanente",tamanio:"mediano",largo_cm:"45-56",envergadura_cm:"66-73",estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Santiago del Estero","Catamarca","Córdoba","San Luis","San Juan","Mendoza","La Pampa","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego","Corrientes","Chaco","Formosa","Tucumán","Salta","Jujuy"],curiosidades:"Su pico en forma de cuchara tiene los bordes con laminillas, como un peine, que funcionan de colador: nada con el pico metido en el agua y filtra semillas, plantitas, crustáceos, insectos y otros bichitos chicos. A veces sumerge la cabeza y medio cuerpo para comer. Anda en bandadas grandes en lagunas, esteros y bañados. Hace el nido en el suelo, entre los pastos cerca del agua, forrado con pasto y plumas, y pone hasta 10 huevos color crema. Las poblaciones del sur migran hacia el norte en invierno.",sprites:{macho:"Spatula_platalea_M",hembra:"Spatula_platalea_F",vuelo:"Spatula_platalea_V"},audio_ebird_code:"redsho1",mapa:"Maps/Spatula_platalea_map.png",thumb_sprite:"",exotica:false,amba:3.58},
{id:159,num:"#013",n_lista:50,nombre_comun:"Pato Colorado",nombre_cientifico:"Spatula cyanoptera",familia:"Anatidae",orden:"Anseriformes",descripcion:{macho:"Pato mediano. El macho tiene la corona negra y el resto de la cabeza, el cuello, el pecho y el vientre castaño rojizos. Pico negro. Ojo amarillo a naranja rojizo. Dorso pardo con las plumas bordeadas de ocráceo. Alas pardas con las cubiertas celestes y blancas y un espejo verde, que se ven sobre todo en vuelo. Plumas de debajo de la cola negras. Patas naranjas.",hembra:"La hembra es parda, con la corona negruzca, la cara y el cuello ocráceos manchados de pardo, el pecho canela moteado de pardo oscuro y el dorso pardo con bordes ocráceo canela. Ojo pardo, patas grises."},habitat:["humedal","laguna"],residencia:"permanente",tamanio:"mediano",largo_cm:"35-48",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Córdoba","Entre Ríos","Jujuy","La Pampa","La Rioja","Mendoza","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"],curiosidades:"El macho, todo castaño rojizo con el ojo rojo, es de los patos más llamativos de las lagunas. Pariente del Pato Cuchara, come filtrando el agua de la superficie con el pico. Anda en parejas o grupos chicos, a veces mezclado con otros patos.",sprites:{macho:"Spatula_cyanoptera_M"},audio_ebird_code:"cintea",mapa:"Maps/Spatula_cyanoptera_map.png",thumb_sprite:"",exotica:false,amba:1.75},
{id:144,num:"#014",n_lista:51,nombre_comun:"Pato Overo",nombre_cientifico:"Mareca sibilatrix",familia:"Anatidae",orden:"Anseriformes",descripcion:{adulto:"Pato mediano, con la frente y la cara blancas y una mancha oscura en la nuca y la parte de atrás del cuello con brillos verdes y violetas. Cabeza parda. Pico azulado con la base y la punta negras. Ojo pardo. Dorso pardo oscuro con las plumas bordeadas de blanco. Alas pardas con una gran mancha blanca en las cubiertas. Rabadilla blanca. Pecho barrado de pardo y blanco; resto de abajo blanco, con los costados canela. Patas pardas. La hembra es parecida pero más apagada."},habitat:["humedal","laguna","costa"],residencia:"permanente",tamanio:"mediano",largo_cm:"43-54",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chubut","Córdoba","Entre Ríos","La Pampa","Mendoza","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Tierra del Fuego"],curiosidades:"El macho tiene un silbido fuerte y musical, muy distinto del graznido de otros patos. Come sobre todo plantas, pastando en las orillas o arrancando vegetación del agua. Las parejas son muy unidas y el macho ayuda a cuidar a los patitos. Las poblaciones del sur migran hacia el norte en invierno.",sprites:{adulto:"Mareca_sibilatrix_D"},audio_ebird_code:"chiwig1",mapa:"Maps/Mareca_sibilatrix_map.png",thumb_sprite:"",exotica:false,amba:0.76},
{id:137,num:"#015",n_lista:52,nombre_comun:"Pato Gargantilla",nombre_cientifico:"Anas bahamensis",familia:"Anatidae",orden:"Anseriformes",descripcion:{adulto:"Pato mediano, fácil de reconocer por su cara blanca. Frente, corona, nuca y parte de atrás del cuello castaño rojizos con puntitos negros. Mejillas, garganta y frente del cuello blancos. Pico plomizo, con una mancha roja en la base de la parte de arriba. Ojo pardo castaño. Dorso pardo oscuro con las plumas bordeadas de canela. Alas pardas oscuras, con un espejo verde metálico bordeado de canela. Pecho pardo claro con puntos negros; resto de abajo pardo claro. Cola ocrácea, en punta. Patas pardas. Macho y hembra son parecidos; la hembra es algo más apagada."},habitat:["humedal","laguna"],residencia:"permanente",tamanio:"mediano",largo_cm:"38-51",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"],curiosidades:"La cara y la garganta blancas, que contrastan con la gorra castaña, lo hacen inconfundible entre los patos. Anda en parejas o grupos chicos, a veces mezclado con otros patos, en lagunas, bañados y también en aguas algo saladas. Come plantas acuáticas, semillas e invertebrados, que busca hundiendo la cabeza o volcándose con la cola para arriba. Hace el nido en el suelo, escondido entre la vegetación cerca del agua.",sprites:{adulto:"Anas_bahamensis_D"},audio_ebird_code:"whcpin",mapa:"Maps/Anas_bahamensis_map.png",thumb_sprite:"",exotica:false,amba:0.42},
{id:6,num:"#016",n_lista:53,nombre_comun:"Pato Maicero",nombre_cientifico:"Anas georgica",familia:"Anatidae",orden:"Anseriformes",descripcion:{adulto:"Pato mediano de aspecto esbelto. Cabeza parda con corona oscura y una ceja pálida apenas insinuada. Cuello largo y fino. Cuerpo pardo claro con escamado oscuro en el dorso y los flancos. Especulum alar negro con borde posterior blanco visible en vuelo. Vientre ante pálido. Pico largo, negro con franja amarilla lateral característica. Patas grises. Sexos similares."},habitat:["humedal","laguna","ribereño","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:55,envergadura_cm:85,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"Es uno de los patos más comunes de la región pampeana. Se alimenta de semillas, gramíneas y granos en campos agrícolas, de ahí su nombre. Forma grandes bandadas fuera de la época reproductiva.",sprites:{adulto:"Anas_georgica_D"},audio_ebird_code:"yebpin1",mapa:"Maps/Anas_georgica_map.png",thumb_sprite:"",exotica:false,amba:7.81},
{id:7,num:"#017",n_lista:54,nombre_comun:"Pato Barcino",nombre_cientifico:"Anas flavirostris",familia:"Anatidae",orden:"Anseriformes",descripcion:{adulto:"Pato pequeño y compacto. Cabeza y cuello gris pálido a ante, densamente moteados y vermiculados de negro, más oscuros que el resto del cuerpo. Partes superiores negras y pardas. Vientre y flancos gris a pardo pálido, con manchas más oscuras en el pecho. Espejo alar negro aterciopelado con brillo verde metálico, bordeado por delante de una banda rufa y por detrás de blanco o ante. Pico amarillo con el culmen y la punta negros, mandíbula gris pálido a crema. Ojo pardo oscuro. Patas grises."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"mediano",largo_cm:"35-45",envergadura_cm:null,estado:"LC",provincias:[],curiosidades:"Se distingue del Pato Maicero, muy similar, por el color del pico y del ojo: como dice el dicho popular, 'pato barcino, ojo de chino; pato maicero, ojo de tero' — el Barcino tiene un sombreado alrededor del ojo que lo hace ver como estirado y el Maicero, en cambio tiene el ojo redondo.",sprites:{adulto:"Anas_flavirostris_D"},audio_ebird_code:"yebtea1",mapa:"Maps/Anas_flavirostris_map.png",thumb_sprite:"",exotica:false,amba:30.63},
{id:8,num:"#018",n_lista:55,nombre_comun:"Pato Picazo",nombre_cientifico:"Netta peposaca",familia:"Anatidae",orden:"Anseriformes",descripcion:{macho:"Macho de aspecto llamativo. Cabeza y cuello negro intenso con reflejos violáceos. Gran escudete rosado en la base del pico del mismo color, con punta negra. Pecho negro. Flancos finamente vermiculados castaño sobre blanco. Vientre y rabadilla blancos. Alas oscuras con banda blanca visible en vuelo. Patas anaranjadas. Ojo rojo.",hembra:"Hembra parda discreta. Cabeza oscura con amplia franja blanca en la mejilla. Pico azul-grisáceo con punta pálida. Cuerpo marrón oscuro, partes inferiores algo más claras. Patas gris oliváceas."},habitat:["humedal","laguna"],residencia:"permanente",tamanio:"mediano",largo_cm:55,envergadura_cm:82,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Córdoba","Corrientes","Mendoza","La Pampa","Río Negro","Neuquén"],curiosidades:"El macho desarrolla un llamativo escudete rosado en la base del pico durante la época reproductiva, que se reduce fuera de ella. Bucea con frecuencia para alimentarse de plantas acuáticas y macroinvertebrados del fondo.",sprites:{macho:"Netta_peposaca_M",hembra:"Netta_peposaca_F"},audio_ebird_code:"robpoc1",mapa:"Maps/Netta_peposaca_map.png",thumb_sprite:"",exotica:false,amba:24.69},
{id:178,num:"#019",n_lista:57,nombre_comun:"Pato Cabeza Negra",nombre_cientifico:"Heteronetta atricapilla",familia:"Anatidae",orden:"Anseriformes",descripcion:{macho:"Pato chico. El macho tiene la cabeza y el cuello negros. Pico negro con una mancha roja en la base. Ojo pardo oscuro. Dorso pardo negruzco salpicado de canela. Pecho y costados pardo canela salpicados de negruzco. Plumas de debajo de la cola canela. Alas pardo oscuras con la punta de las secundarias blanca. Patas pardas.",hembra:"La hembra tiene la cabeza parda, una ceja y la garganta blanquecinas, y el pico pardo grisáceo sin la mancha roja."},habitat:["humedal","laguna"],residencia:"permanente",tamanio:"mediano",largo_cm:"35-40",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chaco","Chubut","Córdoba","Entre Ríos","Jujuy","La Pampa","La Rioja","Mendoza","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero"],curiosidades:"Es el único pato del mundo que no hace nido ni cría a sus patitos: pone los huevos en nidos de otras aves acuáticas, sobre todo gallaretas y gaviotas capucho café. Los patitos nacen tan desarrollados que a las pocas horas dejan el nido y se arreglan solos. Anda en grupitos, a veces mezclado con otros patos y gallaretas.",sprites:{macho:"Heteronetta_atricapilla_M"},audio_ebird_code:"blhduc1",mapa:"Maps/Heteronetta_atricapilla_map.png",thumb_sprite:"",exotica:false,amba:3.93},
{id:118,num:"#020",n_lista:60,nombre_comun:"Pato Zambullidor Chico",nombre_cientifico:"Oxyura vittata",familia:"Anatidae",orden:"Anseriformes",descripcion:{macho:"Pato chico y rechoncho, de cuello corto y grueso y cola rígida, que muchas veces lleva levantada. Cabeza y cuello negros. Pico celeste azulado muy llamativo, con la uña de la punta negra. Ojo pardo oscuro. Base del cuello, dorso, pecho y costados castaño rojizos parejos. Alas y cola pardas. Resto de abajo gris pardusco. Patas grisáceas.",hembra:"La hembra es muy distinta: parda, con una banda blanquecina debajo del ojo y la garganta blanquecina. Pico pardo. Dorso pardo barrado de ocráceo; pecho y vientre pardos y ocráceos."},habitat:["humedal"],residencia:"permanente",tamanio:"mediano",largo_cm:"36-46",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","La Rioja","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut","Santa Cruz","Corrientes"],curiosidades:"Es un gran buceador: se zambulle para buscar semillas, plantas, crustáceos, insectos y caracoles, y nada con la cola rígida levantada y abierta como un abanico. En época de cría el macho hace ruidos como chasquidos y roces para cortejar. Hace un nido grande y profundo con hojas, tallos y juncos, escondido en juncales y totorales de lagunas y esteros, y pone hasta 8 huevos blancos de cáscara áspera, muy grandes para su tamaño; a veces se encuentran nidos con hasta 12 huevos porque pusieron más de una hembra. Solo la hembra los incuba.",sprites:{macho:"Oxyura_vittata_M",hembra:"Oxyura_vittata_F"},audio_ebird_code:"lakduc1",mapa:"Maps/Oxyura_vittata_map.png",thumb_sprite:"",exotica:false,amba:7.4},
{id:106,num:"#021",n_lista:64,nombre_comun:"Pava de Monte Ribereña",nombre_cientifico:"Penelope obscura",familia:"Cracidae",orden:"Galliformes",descripcion:{adulto:"Ave grande, parecida a una gallina de cola larga, de color general oscuro. Frente y corona negras. Cara con piel desnuda gris y una papada de piel roja en la garganta. Pico negruzco. Ojo pardo. Cuello, pecho y dorso pardos con reflejos verdosos y las plumas bordeadas de blanco, que le dan un aspecto jaspeado. Resto del cuerpo pardo con reflejos verdosos. Cola larga, marrón oscura. Patas gris oscuras. Macho y hembra son iguales."},habitat:["ribereño","bosque"],residencia:"permanente",tamanio:"grande",largo_cm:"70-75",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Corrientes"],curiosidades:"Vive en los montes que bordean los ríos, como los del delta del Paraná, y pasa casi todo el tiempo en los árboles, donde come hojas, flores, frutos y semillas. Arma un nido en forma de plataforma con palitos y tallos, forrado con hojas, y pone 2 o 3 huevos blancos entre octubre y diciembre; el macho se encarga de construirlo. Cuando hay peligro, los adultos abren la cola para tapar a los pichones, que se esconden debajo mientras se mueven. Aunque no está amenazada a nivel mundial, sufre la caza y la pérdida de los montes ribereños.",sprites:{adulto:"Penelope_obscura_D"},audio_ebird_code:"dulgua1",mapa:"Maps/Penelope_obscura_map.png",thumb_sprite:"",exotica:false,amba:3.34},
{id:9,num:"#022",n_lista:71,nombre_comun:"Flamenco Austral",nombre_cientifico:"Phoenicopterus chilensis",familia:"Phoenicopteridae",orden:"Phoenicopteriformes",descripcion:{adulto:"Ave grande e inconfundible. Plumaje rosado pálido con las alas rosado-rojo intenso y negro en las primarias. Cuello muy largo y flexible. Pico abultado y curvado hacia abajo, de color rosado con la mitad distal negra. Ojo amarillo claro. Patas largas gris azuladas con las articulaciones y las membranas rojas. Los juveniles son grises parduzcos. La coloración rosada proviene de los pigmentos de los crustáceos que consume."},habitat:["laguna","costa","humedal"],residencia:"estival",tamanio:"grande",largo_cm:110,envergadura_cm:145,estado:"NT",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","La Pampa","Mendoza","San Luis","Neuquén","Río Negro","Chubut","Santa Cruz"],curiosidades:"Se alimenta filtrando agua con el pico invertido, atrapando algas y pequeños crustáceos. Forma colonias reproductivas en salares y lagunas saladas. Su color rosado depende directamente de la dieta — en cautiverio sin carotenoides en la comida se vuelve blanco.",sprites:{adulto:"Phoenicopterus_chilensis_D",juvenil:"Phoenicopterus_chilensis_J"},audio_ebird_code:"chifla1",mapa:"Maps/Phoenicopterus_chilensis_map.png",thumb_sprite:"",exotica:false,amba:0.23},
{id:10,num:"#023",n_lista:74,nombre_comun:"Macá Cara Blanca",nombre_cientifico:"Rollandia rolland",familia:"Podicipedidae",orden:"Podicipediformes",descripcion:{adulto:"Ave acuática pequeña y rechoncha. Cabeza y cuello negro brillante con llamativo penacho facial blanco estriado a los lados de la cara. Ojo rojo intenso. Pico corto y recto oscuro. Dorso pardo oscuro, flancos y parte del vientre canela-anaranjado cálido con escamado oscuro. Nada con el cuerpo muy bajo en el agua. Los pies lobulados son visibles bajo la superficie."},habitat:["humedal","ribereño","laguna"],residencia:"permanente",tamanio:"chico",largo_cm:28,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Chaco","Formosa","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Endémica de Sudamérica. Raramente vuela y prefiere escapar zambulléndose. Sus patas están tan hacia atrás del cuerpo que casi no puede caminar en tierra. Los polluelos nacen cubiertos de plumón y los padres los llevan sobre el lomo.",sprites:{adulto:"Rollandia_rolland_D"},audio_ebird_code:"whtgre3",mapa:"Maps/Rollandia_rolland_map.png",thumb_sprite:"",exotica:false,amba:20.5},
{id:152,num:"#024",n_lista:76,nombre_comun:"Macá Pico Grueso",nombre_cientifico:"Podilymbus podiceps",familia:"Podicipedidae",orden:"Podicipediformes",descripcion:{adulto:"Macá mediano y compacto, de pico corto y grueso como de gallina. Cabeza pardo negruzca, con los costados y el cuello pardo ocráceos. Pico color hueso, con una faja negra en el medio en época de cría. Ojo pardo con un anillo blanco. Garganta negra en época de cría y blanquecina el resto del año. Dorso pardo negruzco. Abajo blanquecino con tono gris ocráceo. Patas gris negruzcas."},habitat:["humedal","laguna"],residencia:"permanente",tamanio:"mediano",largo_cm:"30",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Su pico grueso le permite comer cangrejos, caracoles y peces más grandes que los otros macás. Cuando se siente amenazado se hunde despacio hasta dejar solo la cabeza afuera, como un submarino. Hace un nido flotante de plantas acuáticas y tapa los huevos con vegetación cuando se aleja.",sprites:{adulto:"Podilymbus_podiceps_D"},audio_ebird_code:"pibgre",mapa:"Maps/Podilymbus_podiceps_map.png",thumb_sprite:"",exotica:false,amba:15.11},
{id:11,num:"#025",n_lista:77,nombre_comun:"Macá Grande",nombre_cientifico:"Podiceps major",familia:"Podicipedidae",orden:"Podicipediformes",descripcion:{adulto:"El mayor de los macás. Cuello largo y esbelto. Cabeza con corona gris oscuro-verdosa con cresta corta más oscura en época reproductiva. Cuello rufo-anaranjado vivo. Partes superiores gris-oscuras. Partes inferiores blancuzco-plateadas. Pico largo, recto y puntiagudo, bicolor: borde superior gris oscuro, lados y mandíbula inferior amarillo-grisáceo pálido. Ojo pardo-rojizo. Fuera del período reproductivo, el cuello se vuelve gris-blanquecino y se pierde la cresta."},habitat:["humedal","ribereño","costa"],residencia:"permanente",tamanio:"grande",largo_cm:60,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","La Pampa","Córdoba","Mendoza","Neuquén","Río Negro","Chubut","Santa Cruz"],curiosidades:"Buceador experto que puede permanecer bajo el agua durante más de un minuto. Sus patas están ubicadas muy atrás en el cuerpo, lo que lo hace torpe en tierra pero muy ágil en el agua. Al volar, muestra manchas blancas en las alas. Sus polluelos viajan sobre el lomo de los adultos.",sprites:{adulto:"Podiceps_major_D"},audio_ebird_code:"gregre1",mapa:"Maps/Podiceps_major_map.png",thumb_sprite:"",exotica:false,amba:13.49},
{id:208,num:"#026",n_lista:78,nombre_comun:"Macá Plateado",nombre_cientifico:"Podiceps occipitalis",familia:"Podicipedidae",orden:"Podicipediformes",descripcion:{adulto:"Macá chico. Cabeza gris pardusca, con plumas amarillentas en la zona de la oreja que forman un penacho. Nuca negra, con una línea que baja por detrás del cuello. Pico gris negruzco, o gris con la punta negruzca. Ojo rojo anaranjado. Garganta gris. Cuello blanco por delante y gris pardusco por detrás. Dorso gris pardusco oscuro. Alas como el dorso, con las plumas largas de afuera pardas y las de adentro blancas. Partes inferiores blancas. Patas grises con un tinte oliva. Macho y hembra son iguales. Fuera de la época de cría y en el juvenil no tiene las plumas amarillentas de la oreja."},habitat:["laguna","humedal"],residencia:"permanente",tamanio:"mediano",largo_cm:"28",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chubut","Córdoba","Jujuy","La Pampa","Mendoza","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"],curiosidades:"Anda en parejas o en grupos, a veces grandes, junto a gallaretas y patos en lagunas abiertas. Se zambulle para comer insectos acuáticos y pequeños crustáceos. Como todos los macaes, tiene las patas muy atrás del cuerpo: nada y bucea muy bien, pero en tierra camina con dificultad.",sprites:{adulto:"Podiceps_occipitalis_D"},audio_ebird_code:"silgre1",mapa:"Maps/Podiceps_occipitalis_map.png",thumb_sprite:"",exotica:false,amba:0.06},
{id:12,num:"#027",n_lista:81,nombre_comun:"Paloma Doméstica",nombre_cientifico:"Columba livia",familia:"Columbidae",orden:"Columbiformes",descripcion:{adulto:"Ave mediana y robusta de silueta compacta. Cabeza pequeña gris azulada con irisaciones verdes y violáceas en el cuello. Dorso gris con dos barras alares negras bien visibles. Pecho gris con irisaciones. Vientre gris pálido. Cola gris con banda terminal negra. Pico fino, gris con cera blanca en la base. Patas rojas. El plumaje es muy variable en poblaciones ferales: existen individuos blancos, negros, pardos y mezclados."},habitat:["urbano","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:32,envergadura_cm:64,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"Especie introducida, descendiente de la paloma bravía doméstica. Vive en ciudades de todo el mundo y puede orientarse usando el campo magnético terrestre y referencias visuales. Fue la primera ave domesticada por el ser humano, hace más de 5.000 años.",sprites:{adulto:"Columba_livia_D"},audio_ebird_code:"rocpig",mapa:"Maps/Columba_livia_map.png",thumb_sprite:"",exotica:true,amba:81.37},
{id:13,num:"#028",n_lista:83,nombre_comun:"Paloma Picazuró",nombre_cientifico:"Patagioenas picazuro",familia:"Columbidae",orden:"Columbiformes",descripcion:{adulto:"Paloma grande y robusta. Cabeza y cuello borravinos. Atrás del cuello las plumas tienen una banda blanca angosta y la punta negra, formando un escamado blanco y negro en la nuca. Pico negro. Ojo rojo, con piel roja alrededor. Dorso pardo; dorso bajo, rabadilla y plumas de arriba de la cola gris plomizo. Alas grises con las primarias pardo oscuro; las cubiertas mayores grises orilladas de blanco forman una línea blanca en el ala plegada, y las menores son gris ocráceo con bordes blanquecinos. Cola gris con una ancha banda negra en la punta. Parte de abajo gris vinosa. Patas rojizas."},habitat:["bosque","urbano","pastizal"],residencia:"permanente",tamanio:"mediano",largo_cm:34,envergadura_cm:null,estado:"LC",provincias:[],curiosidades:"Es la paloma silvestre más grande y común de la región. Forma grandes bandadas fuera de la época reproductiva y puede causar daños en cultivos.",sprites:{adulto:"Patagioenas_picazuro_D",vuelo:"Patagioenas_picazuro_V"},audio_ebird_code:"picpig2",mapa:"Maps/Patagioenas_picazuro_map.png",thumb_sprite:"",exotica:false,amba:106.61},
{id:80,num:"#029",n_lista:84,nombre_comun:"Paloma Manchada",nombre_cientifico:"Patagioenas maculosa",familia:"Columbidae",orden:"Columbiformes",descripcion:{adulto:"Paloma grande, del tamaño de la doméstica. Cabeza y cuello grises, apenas vinosos. Pico negruzco con la base blanca. Ojo gris claro. A diferencia de la Picazuró, no tiene escamado en el cuello. Parte alta del dorso y cubiertas del ala pardo oscuro con muchas pintitas blanco crema; plumas de vuelo negruzcas. Parte baja del dorso y rabadilla gris azulado; cola gris oscuro con una banda negra en la punta. Partes inferiores gris apenas vinoso. En general se ve como una paloma gris, sin rosados ni violetas. Patas rojas. La hembra es parecida, con la cabeza y el cuello más apagados."},habitat:["monte","bosque","agrícola","pastizal","urbano"],residencia:"permanente",tamanio:"mediano",largo_cm:"32-33",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","La Rioja","Catamarca","Tucumán","Salta","Jujuy","Neuquén","Río Negro"],curiosidades:"Es una de las palomas grandes más comunes del centro del país y está ampliando su distribución gracias al avance de los cultivos. Anda en bandadas que buscan semillas y granos en el suelo, como girasol y arroz, y a veces se mezcla con otras palomas. Al levantar vuelo hace mucho ruido con las alas. Puede criar en casi cualquier época del año: arma un nido frágil de palitos en un árbol y pone uno o dos huevos blancos. En los altos Andes del noroeste vive otra subespecie, con una ancha franja blanca en el ala.",sprites:{adulto:"Patagioenas_maculosa_D",vuelo:"Patagioenas_maculosa_V"},audio_ebird_code:"spwpig3",mapa:"Maps/Patagioenas_maculosa_map.png",thumb_sprite:"",exotica:false,amba:12.0},
{id:187,num:"#030",n_lista:90,nombre_comun:"Yerutí Gris",nombre_cientifico:"Leptotila verreauxi",familia:"Columbidae",orden:"Columbiformes",descripcion:{adulto:"Paloma mediana. Corona grisácea. Pico negro. Ojo anaranjado. Nuca, parte de atrás del cuello y espalda con brillo verde y violeta. Dorso pardo. Alas pardas, canela por debajo. Cola parda con una banda blanca en las plumas de los costados. Garganta blanca; resto de abajo color vino; vientre y plumas de debajo de la cola blanquecinos. Patas rosadas. Macho y hembra son iguales."},habitat:["monte","bosque","ribereño","urbano"],residencia:"permanente",tamanio:"mediano",largo_cm:"30",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Rioja","Mendoza","Misiones","Salta","San Juan","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Pasa mucho tiempo caminando por el suelo de montes y parques, buscando semillas y frutos caídos, y al asustarse sale volando con un aleteo ruidoso. Su canto es un arrullo grave y triste, de una o dos notas, que se oye más de lo que se la ve. Anda sola o en pareja.",sprites:{adulto:"Leptotila_verreauxi_D"},audio_ebird_code:"whtdov",mapa:"Maps/Leptotila_verreauxi_map.png",thumb_sprite:"",exotica:false,amba:25.18},
{id:14,num:"#031",n_lista:95,nombre_comun:"Torcaza",nombre_cientifico:"Zenaida auriculata",familia:"Columbidae",orden:"Columbiformes",descripcion:{adulto:"Paloma mediana y esbelta. Cabeza gris azulada con dos manchas negras en la cara — una debajo del ojo y otra en la mejilla. Cuello con irisaciones rosado-violáceas. Dorso pardo-grisáceo. Alas con manchas negras dispersas. Pecho rosado que se funde con el vientre más pálido. Cola larga y graduada, gris con bordes blancos en las plumas externas. Pico oscuro. Patas rojas."},habitat:["pastizal","agrícola","urbano","monte"],residencia:"permanente",tamanio:"mediano",largo_cm:28,envergadura_cm:45,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"Una de las aves más abundantes de la región pampeana. Forma bandadas enormes — a veces de miles de individuos — en campos agrícolas donde puede causar daños en cultivos de girasol y sorgo. Es una especie cinegética muy cazada en Argentina.",sprites:{adulto:"Zenaida_auriculata_D"},audio_ebird_code:"eardov1",mapa:"Maps/Zenaida_auriculata_map.png",thumb_sprite:"",exotica:false,amba:101.38},
{id:15,num:"#032",n_lista:105,nombre_comun:"Torcacita Picuí",nombre_cientifico:"Columbina picui",familia:"Columbidae",orden:"Columbiformes",descripcion:{adulto:"La paloma más pequeña de la región. Cabeza gris-azulada. Pequeña mancha negra delante del ojo. Dorso pardo-grisáceo. Alas con barra alar negra-azulada iridiscente característica y manchas blancas en las coberteras, muy llamativas en reposo. Cola parda con plumas externas blancas. Pecho rosáceo pálido que se funde con el vientre blancuzco. Ojo gris pálido a celeste. Pico fino y oscuro. Patas rosadas."},habitat:["urbano","pastizal","agrícola","monte"],residencia:"permanente",tamanio:"chico",largo_cm:20,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Neuquén","Río Negro"],curiosidades:"Es la palomita más abundante y extendida de Argentina. Se alimenta de semillas recogidas del suelo y es frecuente en plazas, jardines y bordes de camino. El diseño blanco y negro de sus alas es muy llamativo al volar. Emite un arrullo suave y repetitivo.",sprites:{adulto:"Columbina_picui_D"},audio_ebird_code:"pigdov1",mapa:"Maps/Columbina_picui_map.png",thumb_sprite:"",exotica:false,amba:24.3},
{id:73,num:"#033",n_lista:106,nombre_comun:"Pirincho",nombre_cientifico:"Guira guira",familia:"Cuculidae",orden:"Cuculiformes",descripcion:{adulto:"Cuclillo mediano de cola larga y aspecto desaliñado. Copete desflecado ocre-anaranjado, casi siempre erguido; cabeza ocrácea con finas estrías oscuras. Pico amarillo-anaranjado, algo curvo. Ojo amarillo-anaranjado rodeado de un anillo de piel amarilla. Dorso y alas pardo oscuro con estrías blancas. Parte baja del dorso blanca y rabadilla ocrácea, muy visibles en vuelo. Cola larga y ancha, parda oscura con amplia punta blanca. Garganta y pecho blanco-ocráceos con finas estrías pardas; vientre blanco-ocráceo liso. Patas gris azuladas."},habitat:["urbano","pastizal","monte","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:34,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","Tucumán","Salta","Jujuy","Catamarca","San Luis","La Pampa","Mendoza","San Juan","La Rioja","Río Negro","Neuquén","Chubut"],curiosidades:"Vive en grupos ruidosos que se acurrucan juntos en una rama para tomar sol a primera hora de la mañana. Anida en forma comunal: varias hembras ponen en un mismo nido y a veces expulsan los huevos de las otras. Su grito descendente 'pío-pío-pirrrr' es uno de los sonidos típicos del campo bonaerense.",sprites:{adulto:"Guira_guira_D",vuelo:"Guira_guira_V"},audio_ebird_code:"guicuc1",mapa:"Maps/Guira_guira_map.png",thumb_sprite:"",exotica:false,amba:17.63},
{id:183,num:"#034",n_lista:115,nombre_comun:"Cuclillo Canela",nombre_cientifico:"Coccyzus melacoryphus",familia:"Cuculidae",orden:"Cuculiformes",descripcion:{adulto:"Ave mediana y esbelta, de cola larga. Cabeza gris plomiza con una franja negra en la oreja. Pico negro, algo curvo. Ojo pardo oscuro con un anillo oliva anaranjado. Dorso y alas gris parduscos. Cola larga, con las plumas del centro gris parduscas y las de los costados negras con puntas blancas; por debajo es negra con grandes manchas blancas. Partes inferiores ocráceas. Patas grises. Macho y hembra son iguales."},habitat:["monte","bosque","ribereño","arbolado"],residencia:"estival",tamanio:"mediano",largo_cm:"28",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Salta","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Llega en primavera y se va en otoño. A diferencia de muchos cuclillos del mundo, no parasita: arma su propio nido, una plataforma floja de palitos. Se mueve solo y con calma por la parte media de los árboles, y come muchas orugas, incluso las peludas que otras aves evitan.",sprites:{adulto:"Coccyzus_melacoryphus_D"},audio_ebird_code:"dabcuc1",mapa:"Maps/Coccyzus_melacoryphus_map.png",thumb_sprite:"",exotica:false,amba:2.7},
{id:16,num:"#035",n_lista:168,nombre_comun:"Picaflor Verde",nombre_cientifico:"Chlorostilbon lucidus",familia:"Trochilidae",orden:"Apodiformes",descripcion:{macho:"El colibrí más pequeño y común de la región. Plumaje totalmente verde iridiscente brillante, más intenso en la cabeza y garganta. Cola corta y ahorquillada, más oscura. Pico recto y fino, rojo con punta oscura.",hembra:"Verde iridiscente en las partes superiores. Ceja blanca. Partes inferiores blanco-grisáceas. Cola con bordes blancos terminales. Pico recto y fino."},habitat:["urbano","monte","pastizal"],residencia:"permanente",tamanio:"chico",largo_cm:9,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Tucumán","Salta","Jujuy","Mendoza","San Luis"],curiosidades:"El único colibrí que se reproduce regularmente en Buenos Aires y CABA. Sus alas baten entre 50 y 80 veces por segundo, produciendo el zumbido característico. Puede volar hacia atrás y mantenerse inmóvil en el aire frente a las flores. Visita preferentemente flores rojas y tubulares.",sprites:{macho:"Chlorostilbon_lucidus_M",hembra:"Chlorostilbon_lucidus_F"},audio_ebird_code:"glbeme1",mapa:"Maps/Chlorostilbon_lucidus_map.png",thumb_sprite:"",exotica:false,amba:34.91},
{id:100,num:"#036",n_lista:174,nombre_comun:"Picaflor Garganta Blanca",nombre_cientifico:"Leucochloris albicollis",familia:"Trochilidae",orden:"Apodiformes",descripcion:{macho:"Picaflor chico, algo más grande que el Picaflor Común. Cabeza y dorso verdes con brillo dorado o bronceado. Pico recto, de largo mediano, con la parte de arriba negruzca y la de abajo roja con la punta negra. Alas oscuras. Cola verde en el centro y verde negruzca a los costados, con las puntas blancas. Mentón verde con bordecitos blancos y garganta blanca muy llamativa. Mejillas y pecho verde brillante, formando una banda. Ojo oscuro y patas chiquitas oscuras. Centro del vientre blanco, costados verdes y plumas de abajo de la cola blancas.",hembra:"La hembra es muy parecida al macho pero menos brillante, con el verde más apagado. Los juveniles tienen el pecho y el vientre gris pardusco, con menos blanco, y las puntas de la cola pardas."},habitat:["urbano","monte","bosque"],residencia:"permanente",tamanio:"chico",largo_cm:"10-11.5",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Corrientes","Misiones","Córdoba","Neuquén","Río Negro"],curiosidades:"Es el único integrante de su género, y su nombre científico lo dice todo: 'Leucochloris' quiere decir 'blanco y verde' y 'albicollis', 'cuello blanco'. Se adapta muy bien a plazas, parques y jardines, y en las últimas décadas se fue extendiendo hacia el sur y el oeste de la provincia de Buenos Aires. Toma néctar de muchísimas flores, nativas e introducidas, sobre todo de bromelias como el clavel del aire, y también caza insectos al vuelo. Es muy territorial y persigue a otros picaflores con un trino metálico rápido. Su canto es una serie de notas agudas y zumbadas, 'bziii-bzi-bzi-bzi'. La hembra hace un nidito en forma de taza con pelusa vegetal y telas de araña, cubierto de líquenes, y pone 2 huevos.",sprites:{macho:"Leucochloris_albicollis_M",hembra:"Leucochloris_albicollis_F"},audio_ebird_code:"whthum2",mapa:"Maps/Leucochloris_albicollis_map.png",thumb_sprite:"",exotica:false,amba:2.99},
{id:77,num:"#037",n_lista:176,nombre_comun:"Picaflor Bronceado",nombre_cientifico:"Hylocharis chrysura",familia:"Trochilidae",orden:"Apodiformes",descripcion:{adulto:"Picaflor mediano de pico recto, rojo coral con la punta negra. Cabeza verde dorado iridiscente, con una pequeña mancha blanca justo detrás del ojo. Ojo negro. Dorso y alas verde dorado iridiscente; cola bronce dorado brillante. Patas negras. Barbilla rufo pálido; garganta, pecho y vientre verde dorado iridiscente. Según la luz puede verse apagado. La hembra es casi igual al macho, algo más opaca y con la parte baja del vientre grisácea."},habitat:["urbano","monte","bosque"],residencia:"permanente",tamanio:"chico",largo_cm:"8-10",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","Tucumán","Salta","Jujuy","La Pampa"],curiosidades:"Es uno de los picaflores más comunes en plazas, parques y jardines del noreste bonaerense. Toma néctar de una enorme variedad de flores nativas y exóticas, y también caza insectos al vuelo y roba arañitas de las telas. Su canto es un trino agudo y repetido, parecido al de un grillo. La hembra arma sola un nidito en forma de taza con fibras vegetales y telas de araña, decorado por fuera con líquenes y trocitos de hojas, sobre una rama fina y horizontal.",sprites:{adulto:"Hylocharis_chrysura_D"},audio_ebird_code:"gilhum1",mapa:"Maps/Hylocharis_chrysura_map.png",thumb_sprite:"",exotica:false,amba:32.77},
