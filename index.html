{id:115,num:"#141",n_lista:769,nombre_comun:"Piojito Tiquitiqui",nombre_cientifico:"Serpophaga subcristata",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Pajarito muy chico y activo. Cabeza gris olivácea con estrías negruzcas y plumas blancas en el centro de la corona que casi siempre están escondidas y a veces levanta como un copetito. Ceja fina blanca, zona entre el pico y el ojo blanca y una línea oscura que pasa por el ojo. Pico negro, corto y fino. Ojo pardo. Dorso gris oliváceo. Alas negruzcas con bordes ocráceos y dos bandas claras, blanquecinas a ocráceas. Cola negruzca con los bordes de afuera blanquecinos. Garganta blanquecina, pecho gris y vientre amarillento. Patas negras. Macho y hembra son iguales."},habitat:["monte","urbano","agrícola"],residencia:"permanente",tamanio:"chico",largo_cm:"11",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","La Rioja","Catamarca","Tucumán","Salta","Jujuy","Río Negro","Chubut"],curiosidades:"Pesa apenas entre 6 y 9 gramos. Se mueve sin parar entre arbustos y árboles bajos, revisando ramas y hojas en busca de insectos, arañas y larvas, y a veces revolotea para atraparlos. Su canto es un trino rápido, casi mecánico, 'psi-psi-psiiiii', y entre sus nombres populares están 'tiquitiqui', 'titirití' y 'turí-turí'. Macho y hembra construyen juntos una tacita de fibras vegetales cubierta por fuera con líquenes y a veces con bolsitas de huevos de araña, y forrada con plumas y pelos; la esconden en arbustos, muchas veces espinosos.",sprites:{adulto:"Serpophaga_subcristata_D"},audio_ebird_code:"y01036",mapa:"Maps/Serpophaga_subcristata_map.png",thumb_sprite:"",exotica:false,amba:27.95},
{id:48,num:"#142",n_lista:774,nombre_comun:"Benteveo",nombre_cientifico:"Pitangus sulphuratus",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Ave mediana y llamativa. Corona negra con una mancha amarilla central oculta que se muestra cuando se excita. Ceja blanca ancha y máscara facial negra muy contrastante. Garganta blanca. Partes inferiores amarillo brillante. Dorso y alas pardo-rufo con bordes claros en las plumas. Cola parda con bordes rufos. Pico largo y robusto, negro. Patas oscuras."},habitat:["urbano","ribereño","humedal","pastizal","bosque"],residencia:"permanente",tamanio:"mediano",largo_cm:24,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"Su nombre imita su canto característico. Es uno de los tiránidos más grandes y agresivos, capaz de atacar aves mucho más grandes para defender su territorio. Se alimenta de insectos, frutos, pequeños peces y hasta carroña.",sprites:{adulto:"Pitangus_sulphuratus_D"},audio_ebird_code:"grekis",mapa:"Maps/Pitangus_sulphuratus_map.png",thumb_sprite:"",exotica:false,amba:100.0},
{id:49,num:"#143",n_lista:776,nombre_comun:"Picabuey",nombre_cientifico:"Machetornis rixosa",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Tirano mediano y terrícola. Corona gris con copete naranja oculto, raramente visible. Ceja blanca bien marcada. Cara y mejillas grises. Dorso y alas pardo-oliváceos. Cola parda con bordes rufos. Garganta blancuzca. Pecho y vientre amarillo intenso. Ojo pardo-rojizo a rojo oscuro. Patas largas y robustas. Camina activamente sobre el suelo y trepa al lomo del ganado."},habitat:["pastizal","agrícola","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:21,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Tucumán"],curiosidades:"Conocido por posarse sobre vacas, caballos y otras reses para capturar los insectos que estas espantan con su movimiento. Es uno de los pocos tiranos que se alimenta principalmente en el suelo. Se lo distingue por sus patas inusualmente largas para la familia y su comportamiento caminador.",sprites:{adulto:"Machetornis_rixosa_D"},audio_ebird_code:"cattyr",mapa:"Maps/Machetornis_rixosa_map.png",thumb_sprite:"",exotica:false,amba:41.79},
{id:101,num:"#144",n_lista:779,nombre_comun:"Benteveo Rayado",nombre_cientifico:"Myiodynastes maculatus",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Del tamaño de un benteveo, pero todo rayado. Corona negruzca, con una mancha amarilla escondida que casi nunca se ve. Ceja blanca, una banda oscura que cruza el ojo como un antifaz y una línea blanca debajo. Pico negro, fuerte, con la base de la parte de abajo más clara. Ojo pardo. Dorso pardo oscuro con estrías blanquecinas. Rabadilla canela, estriada de oscuro. Alas pardas con bordes blanquecinos en las plumas. Cola parda con los bordes de las plumas castaño rojizos. Partes de abajo blanquecinas con tono ocráceo, todas cubiertas de estrías pardo oscuras. Patas negras. Macho y hembra son iguales."},habitat:["bosque","monte","urbano"],residencia:"estival",tamanio:"mediano",largo_cm:"20-23",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Mendoza"],curiosidades:"Llega en primavera desde el norte de Sudamérica para criar, y en otoño vuelve a migrar hacia Perú, Ecuador y Brasil. No construye su propio nido: usa huecos de árboles, nidos viejos o rotos de horneros y carpinteros, y hasta cajas nido, donde pone 3 o 4 huevos manchados. Se queda quieto en las ramas altas y sale a cazar insectos al vuelo, pero también come muchos frutos. Se lo ubica fácil por su grito agudo y fuerte, parecido a un 'squiii-zip' o al chirrido de una bisagra.",sprites:{adulto:"Myiodynastes_maculatus_D"},audio_ebird_code:"strfly1",mapa:"Maps/Myiodynastes_maculatus_map.png",thumb_sprite:"",exotica:false,amba:13.48},
{id:50,num:"#145",n_lista:785,nombre_comun:"Suirirí Real",nombre_cientifico:"Tyrannus melancholicus",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Tiránido grande y conspicuo. Cabeza gris con corona amarilla-anaranjada oculta entre las plumas (raramente visible). Dorso verde-oliváceo. Alas y cola pardo-negruzcas con márgenes pálidos. Garganta gris pálida. Pecho gris-oliváceo. Vientre amarillo brillante. Pico ancho y robusto, negro. Patas negras. Ambos sexos iguales."},habitat:["monte","arbolado","urbano","pastizal"],residencia:"estival",tamanio:"mediano",largo_cm:20,envergadura_cm:38,estado:"LC",provincias:["CABA","Buenos Aires","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Córdoba","Salta","Jujuy","Tucumán","Santiago del Estero"],curiosidades:"A pesar de su nombre ('melancólico'), es sumamente agresivo y defiende su territorio atacando a aves mucho más grandes, incluyendo gavilanes y caranchos. La corona de plumas amarillas que normalmente mantiene oculta solo la eriza durante el cortejo o situaciones de alarma.",sprites:{adulto:"Tyrannus_melancholicus_D"},audio_ebird_code:"trokin",mapa:"Maps/Tyrannus_melancholicus_map.png",thumb_sprite:"",exotica:false,amba:23.6},
{id:51,num:"#146",n_lista:786,nombre_comun:"Tijereta",nombre_cientifico:"Tyrannus savana",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Tirano mediano de partes superiores oscuras y partes inferiores blancas. Cabeza negra, con una mancha amarilla semioculta en la corona. Dorso gris, tono variable según la subespecie. Alas y cola negras. Cola extremadamente larga y profundamente ahorquillada, generalmente más larga que el cuerpo y más larga en el macho que en la hembra. Garganta y partes inferiores blancas. Pico corto y oscuro. Patas oscuras.",juvenil:"Juveniles y hembras carecen de las largas plumas de la cola del macho adulto. Presentan la misma combinación de corona y alas negras, dorso gris y partes inferiores blancas, pero con cola moderadamente ahorquillada y de longitud normal."},habitat:["pastizal","urbano"],residencia:"permanente",tamanio:"mediano",largo_cm:"adulto con cola: hasta 40 cm (cola más larga en el macho)",envergadura_cm:null,estado:"LC",provincias:[],curiosidades:"Es habitual verlo posado en lo alto de postes de alambrado o arbustos, desde donde sale a cazar insectos al vuelo o se alimenta de frutos. Durante la migración forma bandadas muy numerosas, con dormideros de hasta 10.000 individuos.",sprites:{adulto:"Tyrannus_savana_D",juvenil:"Tyrannus_savana_J",vuelo:"Tyrannus_savana_V"},audio_ebird_code:"fotfly",mapa:"Maps/Tyrannus_savana_map.png",thumb_sprite:"juvenil",exotica:false,amba:10.06},
{id:200,num:"#147",n_lista:791,nombre_comun:"Burlisto Pico Canela",nombre_cientifico:"Myiarchus swainsoni",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro mediano y esbelto, de cabeza algo despeinada. Pico negro con la base de abajo canela. Ojo pardo. Dorso pardo oliváceo. Alas pardas con los bordes de las plumas blanquecinos. Cola parda. Garganta y pecho grises; vientre amarillento. Patas negras. Macho y hembra son iguales."},habitat:["monte","bosque","arbolado","urbano"],residencia:"estival",tamanio:"mediano",largo_cm:"20",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Llega en primavera a criar y en otoño migra hacia el norte, hasta la Amazonia. Caza insectos al vuelo desde una rama o los recoge del follaje, y también come frutos. Anida en huecos de árboles, a veces en nidos viejos de carpintero.",sprites:{adulto:"Myiarchus_swainsoni_D"},audio_ebird_code:"swafly1",mapa:"Maps/Myiarchus_swainsoni_map.png",thumb_sprite:"",exotica:false,amba:2.76},
{id:109,num:"#148",n_lista:795,nombre_comun:"Mosqueta Estriada",nombre_cientifico:"Myiophobus fasciatus",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Pajarito chico, de tonos pardos. Cabeza parda, con una mancha amarilla o anaranjada en la corona que casi siempre está escondida y se ve cuando el ave se excita. Una línea corta blanquecina entre el pico y el ojo. Pico negro, con la base de la parte de abajo gris rosada. Ojo pardo. Dorso pardo con tono canela. Alas pardas con dos bandas ocráceas y bordes ocráceos en las plumas. Cola parda. Garganta y vientre blanquecinos, a veces con tono amarillento en el vientre; pecho y costados con estrías pardas cortas. Patas negras. La hembra tiene la mancha de la corona más chica o no la tiene, y el pecho menos estriado; el juvenil no tiene mancha en la corona."},habitat:["monte","bosque","urbano"],residencia:"estival",tamanio:"chico",largo_cm:"11-14",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Mendoza","La Pampa"],curiosidades:"Es confiada pero difícil de ver, porque se mueve por las partes sombrías de los arbustos y árboles bajos, donde busca insectos en el follaje y a veces revolotea para atraparlos. Llega en primavera a criar y en otoño migra al norte. La hembra hace un nidito en forma de taza con fibras vegetales y raicillas unidas con telas de araña, colgado de una rama a baja altura y a veces con fibras u hojas colgando por fuera. Pone 2 huevos color crema con una corona de manchitas en el extremo más ancho. El tordo renegrido suele dejarle sus huevos en el nido.",sprites:{adulto:"Myiophobus_fasciatus_D"},audio_ebird_code:"brcfly1",mapa:"Maps/Myiophobus_fasciatus_map.png",thumb_sprite:"",exotica:false,amba:9.98},
{id:52,num:"#149",n_lista:800,nombre_comun:"Churrinche",nombre_cientifico:"Pyrocephalus rubinus",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{macho:"Macho inconfundible: corona, garganta, pecho y vientre rojo escarlata brillante. Antifaz, dorso, alas y cola negro-pizarra intenso. Pico corto y negro. Patas negras.",hembra:"Hembra muy diferente al macho. Partes superiores gris-parduscas; alas y cola pardo oscuras. Pecho blancuzco con fino estriado pardo. Vientre y subcaudales rosáceo pálido. Pico y patas negros."},habitat:["pastizal","monte","ribereño","arbolado"],residencia:"estival",tamanio:"chico",largo_cm:14,envergadura_cm:25,estado:"LC",provincias:["CABA","Buenos Aires","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Córdoba","La Pampa","Mendoza","San Luis","Salta","Jujuy","Tucumán","Santiago del Estero","San Juan","La Rioja","Catamarca","Neuquén","Río Negro"],curiosidades:"Solo el macho luce el llamativo plumaje escarlata; la hembra y los juveniles son discretamente pardos. Durante el cortejo el macho realiza un vuelo ondulante ascendente mientras canta, exhibiendo su plumaje. El nombre del género Pyrocephalus significa 'cabeza de fuego' en griego.",sprites:{macho:"Pyrocephalus_rubinus_M",hembra:"Pyrocephalus_rubinus_F"},audio_ebird_code:"verfly",mapa:"Maps/Pyrocephalus_rubinus_map.png",thumb_sprite:"",exotica:false,amba:6.87},
{id:136,num:"#150",n_lista:808,nombre_comun:"Sobrepuesto Austral",nombre_cientifico:"Lessonia rufa",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{macho:"Pájaro chico y terrícola. El macho es todo negro, con el dorso castaño rojizo como una montura. Pico negro y fino. Ojo pardo. Patas negras.",hembra:"La hembra es mucho más apagada: corona parda, dorso castaño, rabadilla y cola pardas oscuras, alas pardas oscuras. Cara y partes de abajo blanquecinas ocráceas, con las plumas de debajo de la cola blanquecinas. Pico y patas negros, ojo pardo."},habitat:["pastizal","costa","humedal"],residencia:"permanente",tamanio:"chico",largo_cm:"12",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","La Rioja","Catamarca","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Su nombre viene del parche castaño del lomo del macho, que parece 'sobrepuesto' sobre el plumaje negro; en el campo le dicen negrito, colegial o potro ensillado. Cría sobre todo en la Patagonia, y en Buenos Aires es mucho más común entre fines del verano y el invierno, mientras que en noviembre y diciembre casi no se lo ve. Pasa casi todo el tiempo en el suelo, en costas, orillas de lagunas y pastos cortos, donde corre detrás de los insectos y abre y cierra rápidamente las alas y la cola. A veces se posa en yuyos o arbustos bajos.",sprites:{macho:"Lessonia_rufa_M"},audio_ebird_code:"ausneg1",mapa:"Maps/Lessonia_rufa_map.png",thumb_sprite:"",exotica:false,amba:0.53},
{id:53,num:"#151",n_lista:810,nombre_comun:"Pico de Plata",nombre_cientifico:"Hymenops perspicillatus",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{macho:"Ave pequeña de postura erguida y patas largas. Plumaje enteramente negro. Gran carnosidad amarilla alrededor del ojo, con tinte verdoso. Iris amarillo. Pico amarillo pálido, casi blanquecino a distancia. Ala negra con las primarias mayormente blancas, con base y puntas negras, visible en reposo y muy notorio en vuelo. Cola negra. Patas negras.",hembra:"Partes superiores pardo oscuras. Ceja ante o blanco-ante y lores pálidos. Carnosidad ocular reducida y más apagada que en el macho. Dorso estriado de negro con bordes pardo pálido. Dos barras alares ante. Remeras rufas distintivas, visibles en vuelo. Cola oscura. Partes inferiores blanquecino-apagadas con estriado oscuro en el pecho. Pico oscuro con mandíbula inferior parda. Patas negras."},habitat:["pastizal","humedal","ribereño"],residencia:"permanente",tamanio:"chico",largo_cm:"13-16",envergadura_cm:null,estado:"LC",provincias:[],curiosidades:"Su nombre viene del pico amarillo pálido casi blanco. El macho realiza un despliegue aéreo característico: vuela en círculo vertical desde la percha mostrando las alas blancas, con un chasquido audible en el punto más alto del vuelo.",sprites:{macho:"Hymenops_perspicillatus_M",hembra:"Hymenops_perspicillatus_F"},audio_ebird_code:"spetyr1",mapa:"Maps/Hymenops_perspicillatus_map.png",thumb_sprite:"",exotica:false,amba:8.89},
{id:154,num:"#152",n_lista:816,nombre_comun:"Suirirí Amarillo",nombre_cientifico:"Satrapa icterophrys",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Pajarito mediano. Corona y dorso verde oliváceos, con una ceja amarilla bien marcada. Pico y patas negros. Ojo pardo. Alas y cola pardas, con las cubiertas del ala y las plumas de vuelo internas bordeadas de blanquecino. Partes de abajo amarillas. Macho y hembra son parecidos; la hembra es más apagada."},habitat:["monte","arbolado","humedal"],residencia:"permanente",tamanio:"chico",largo_cm:"16",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","Misiones","Salta","Santa Fe","Tucumán"],curiosidades:"Se posa a baja altura en arbustos y árboles y sale volando para atrapar insectos en el aire, volviendo a la misma rama. En época de cría es muy confiado y se deja ver de cerca. Hace un nido en forma de taza en una horqueta.",sprites:{adulto:"Satrapa_icterophrys_D"},audio_ebird_code:"yebtyr2",mapa:"Maps/Satrapa_icterophrys_map.png",thumb_sprite:"",exotica:false,amba:8.87},
{id:163,num:"#153",n_lista:829,nombre_comun:"Monjita Blanca",nombre_cientifico:"Xolmis irupero",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico, casi todo blanco puro. Pico negro. Ojo pardo. Alas blancas con las puntas de las plumas largas negras. Cola blanca con la punta negra. Patas negras. Macho y hembra son iguales."},habitat:["pastizal","agrícola","monte"],residencia:"permanente",tamanio:"chico",largo_cm:"17",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Su blanco se ve de lejos cuando se posa en alambrados, postes y cables al costado de los caminos rurales, desde donde baja al suelo o sale al vuelo a cazar insectos. Tiene muchísimos nombres populares, como viudita, nievecita, palomita de la Virgen o boyerito blanco. Anida en huecos de árboles o postes y a veces usa nidos viejos de hornero.",sprites:{adulto:"Xolmis_irupero_D"},audio_ebird_code:"whimon1",mapa:"Maps/Xolmis_irupero_map.png",thumb_sprite:"",exotica:false,amba:0.42},
{id:204,num:"#154",n_lista:831,nombre_comun:"Monjita Coronada",nombre_cientifico:"Neoxolmis coronatus",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro mediano. Frente, cejas, garganta y partes inferiores blancas. Corona negra y una línea negra detrás del ojo. Pico negro. Ojo pardo. Dorso gris pardusco. Alas negras con una mancha blanca en las plumas largas y las cubiertas bordeadas de blanco. Cola negra. Patas negras. Macho y hembra son iguales."},habitat:["pastizal","agrícola","monte"],residencia:"invernal",tamanio:"mediano",largo_cm:"20",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Corrientes","Córdoba","Entre Ríos","La Pampa","La Rioja","Mendoza","Río Negro","Salta","San Juan","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Cría en la Patagonia y en otoño viaja al norte, por eso en Buenos Aires se la ve sobre todo en invierno. Anda sola y se posa en lugares expuestos, como yuyos altos, alambrados y postes, desde donde caza insectos en el aire o se tira al suelo, donde puede correr detrás de ellos.",sprites:{adulto:"Neoxolmis_coronatus_D"},audio_ebird_code:"bkcmon1",mapa:"Maps/Neoxolmis_coronatus_map.png",thumb_sprite:"",exotica:false,amba:0.26},
{id:126,num:"#155",n_lista:850,nombre_comun:"Tachurí Sietecolores",nombre_cientifico:"Tachuris rubrigastra",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Pajarito diminuto y muy colorido de los juncales. Cabeza negra azulada, con el copete estriado de amarillo y el centro rojo. Pico fino y negro. Ojo gris celeste. Dorso verde oliva. Alas negras con una banda blanca. Cola negra con las plumas de los costados blancas. Costados de la garganta blanquecinos y centro amarillo. Pecho y vientre amarillos, con una banda negra a los lados del vientre. Debajo de la cola, rosado. Patas largas y negras. La hembra es parecida pero más apagada; el juvenil no tiene la cara negra ni la banda del pecho."},habitat:["humedal"],residencia:"permanente",tamanio:"chico",largo_cm:"10.5-11.5",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","Salta","Jujuy","Neuquén","Río Negro","Chubut","Santa Cruz"],curiosidades:"Le dicen 'siete colores' por su plumaje: negro, azul, verde, amarillo, blanco, rojo y rosado en un pájaro de apenas 11 centímetros. Vive entre juncos y totoras de lagunas, bañados y esteros, donde se mueve rápido, saltando y revoloteando para atrapar insectos en la vegetación o al vuelo. Su nido es una obra de arte: una tacita honda en forma de cono, hecha con tiras húmedas de junco que se endurecen al secarse, atada a un junco, una espadaña o un duraznillo. Pone 3 huevos, a veces 4, de color crema.",sprites:{adulto:"Tachuris_rubrigastra_D"},audio_ebird_code:"mcrtyr1",mapa:"Maps/Tachuris_rubrigastra_map.png",thumb_sprite:"",exotica:false,amba:2.55},
{id:129,num:"#156",n_lista:851,nombre_comun:"Juan Chiviro",nombre_cientifico:"Cyclarhis gujanensis",familia:"Vireonidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico y robusto, de cabeza grande y pico grueso y ganchudo. Frente y ceja castañas. Corona gris con tono castaño. Cara y collar de la nuca grises. Pico gris. Ojo naranja o rojo. Dorso verde oliva. Alas pardas con bordes oliva. Cola oliva. Garganta blanquecina. Collar amarillo en el pecho. Resto de abajo blanquecino con tono canela. Patas rosadas. Macho y hembra son iguales."},habitat:["bosque","monte","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"15",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","La Rioja","Catamarca","Tucumán","Salta","Jujuy"],curiosidades:"Se lo oye mucho más de lo que se lo ve: canta todo el año, desde lo alto de los árboles, una frase silbada y fuerte que repite sin cansarse, y de ahí su nombre popular de 'buen cantor'. Anda solo, recorriendo despacio la parte media y alta de los árboles de montes, parques y arboledas de la ciudad, donde revisa ramitas y levanta líquenes en busca de insectos y arañas; también come frutos y semillas. Su nido es una taza colgante atada a ramas horquilladas, hecha de fibras vegetales, forrada con raicillas y cubierta por fuera de líquenes y claveles del aire unidos con tela de araña. Pone 2 o 3 huevos blancos con pintas castañas.",sprites:{adulto:"Cyclarhis_gujanensis_D"},audio_ebird_code:"rubpep1",mapa:"Maps/Cyclarhis_gujanensis_map.png",thumb_sprite:"",exotica:false,amba:7.03},
{id:202,num:"#157",n_lista:856,nombre_comun:"Urraca Criolla",nombre_cientifico:"Cyanocorax chrysops",familia:"Corvidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro grande y llamativo, con plumas cortas y paradas en la frente. Cabeza, cuello y pecho negros, con una ceja y la nuca celestes. Pico negro. Ojo amarillo. Dorso negro violáceo. Alas pardas y violáceas. Cola negra y violácea con una banda ancha blanquecina en la punta. Resto de abajo blanquecino a amarillento. Patas negras. Macho y hembra son iguales."},habitat:["monte","bosque","ribereño"],residencia:"permanente",tamanio:"mediano",largo_cm:"35",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Entre Ríos","Formosa","Jujuy","Misiones","Salta","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Anda en grupos ruidosos y curiosos que se llaman con una gran variedad de gritos, silbidos y chasquidos. Come casi de todo: frutos, insectos, huevos, pichones y hasta restos de comida, y a veces esconde alimento para más tarde. En Buenos Aires vive en las selvas ribereñas del Delta y el norte de la provincia.",sprites:{adulto:"Cyanocorax_chrysops_D"},audio_ebird_code:"plcjay1",mapa:"Maps/Cyanocorax_chrysops_map.png",thumb_sprite:"",exotica:false,amba:1.11},
{id:54,num:"#158",n_lista:862,nombre_comun:"Golondrina Parda",nombre_cientifico:"Progne tapera",familia:"Hirundinidae",orden:"Passeriformes",descripcion:{adulto:"Golondrina mediana de aspecto robusto. Partes superiores, corona y cara uniformemente pardo arenoso. Garganta y vientre blancos. Collar pardo cruzando el pecho. Cola corta y levemente ahorquillada. Pico corto y ancho. Se distingue de otras golondrinas por su dorso totalmente pardo y el collar pectoral pardo."},habitat:["aéreo","pastizal","agrícola","humedal"],residencia:"estival",tamanio:"chico",largo_cm:17,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Tucumán","Salta","Jujuy"],curiosidades:"A diferencia de la mayoría de las golondrinas, no construye su propio nido sino que ocupa cuevas de horneros, vizcachas u otras cavidades. Migra hacia el norte en el otoño y regresa en primavera. Suele posarse en cables y alambrados en grupos numerosos.",sprites:{adulto:"Progne_tapera_D"},audio_ebird_code:"brcmar1",mapa:"Maps/Progne_tapera_map.png",thumb_sprite:"",exotica:false,amba:30.39},
{id:55,num:"#159",n_lista:864,nombre_comun:"Golondrina Doméstica",nombre_cientifico:"Progne chalybea",familia:"Hirundinidae",orden:"Passeriformes",descripcion:{macho:"Ave mediana y aerodinámica. Partes superiores, corona y cara azul-púrpura oscuro con brillo iridiscente intenso. Garganta y pecho grises ondulados de blanquecino; resto de abajo blanquecino. Cola corta y levemente ahorquillada. Pico corto y ancho. Ojo oscuro.",hembra:"Similar al macho pero con las partes superiores azul-gris apagado y tono parduzco en la cabeza y cara. Partes inferiores gris-blancuzco con leve estriado en el pecho."},habitat:["aéreo","urbano","ribereño","humedal"],residencia:"estival",tamanio:"chico",largo_cm:18,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro","Chubut"],curiosidades:"Migra desde América del Norte cada año para pasar el verano austral en Argentina. Pasa la mayor parte de su vida en vuelo cazando insectos. Suele anidar en colonias bajo aleros y puentes.",sprites:{macho:"Progne_chalybea_M",hembra:"Progne_chalybea_F",vuelo:"Progne_chalybea_V"},audio_ebird_code:"gybmar",mapa:"Maps/Progne_chalybea_map.png",thumb_sprite:"",exotica:false,amba:34.48},
{id:188,num:"#160",n_lista:865,nombre_comun:"Golondrina Negra",nombre_cientifico:"Progne elegans",familia:"Hirundinidae",orden:"Passeriformes",descripcion:{macho:"Golondrina grande, de cola ahorquillada. El macho es todo negro azulado brillante. Pico negro. Ojo oscuro. Alas y cola negras. Patas negras.",hembra:"La hembra es negra por arriba y gris oscura por abajo, con las plumas terminadas en blanquecino, que le dan un aspecto escamado."},habitat:["aéreo","urbano","pastizal","humedal"],residencia:"estival",tamanio:"chico",largo_cm:"20",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chubut","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Llega en primavera a criar y en otoño migra al norte de Sudamérica. Caza insectos en vuelo y a menudo anda junto a la Golondrina Doméstica. Anida en huecos de edificios, puentes, árboles o nidos viejos de hornero.",sprites:{macho:"Progne_elegans_M"},audio_ebird_code:"soumar",mapa:"Maps/Progne_elegans_map.png",thumb_sprite:"",exotica:false,amba:0.88},
{id:104,num:"#161",n_lista:867,nombre_comun:"Golondrina Ceja Blanca",nombre_cientifico:"Tachycineta leucorrhoa",familia:"Hirundinidae",orden:"Passeriformes",descripcion:{adulto:"Golondrina chica, de alas largas y cola apenas ahorquillada. Corona, nuca y dorso azul brillante con un leve tono verdoso. Una línea blanca fina sale de la base del pico y pasa por encima del ojo, como una ceja corta; la zona entre el pico y el ojo y las mejillas son negras con brillo azulado. Pico chico, negro. Ojo pardo. Alas y cola pardo oscuras; algunas plumas del ala tienen la punta blanca. Rabadilla blanca. Toda la parte de abajo blanca, incluso debajo de las alas. Patas negras. Macho y hembra son iguales.",juvenil:"El juvenil es más apagado: el dorso es gris pardusco en lugar de azul brillante y el pecho tiene un tono grisáceo. Conserva la ceja y la rabadilla blancas."},habitat:["aéreo","pastizal","humedal","urbano"],residencia:"estival",tamanio:"chico",largo_cm:"13",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","Tucumán","Salta","Jujuy","Catamarca"],curiosidades:"Durante años se la consideró la misma especie que la Golondrina Patagónica; se la distingue por la ceja blanca y porque es blanca debajo de las alas. Vuela bajo, a ras del suelo y del agua, cazando insectos, y toma agua en pleno vuelo rozando la superficie de lagunas y charcos. No cava su nido: aprovecha huecos de árboles, postes, caños, aleros, nidos viejos de horneros y carpinteros o cajas nido, y lo forra con pasto y plumas. En Argentina cría de octubre a febrero; después la mayoría migra al norte para pasar el invierno.",sprites:{adulto:"Tachycineta_leucorrhoa_D"},audio_ebird_code:"whrswa1",mapa:"Maps/Tachycineta_leucorrhoa_map.png",thumb_sprite:"",exotica:false,amba:26.25},
{id:71,num:"#162",n_lista:870,nombre_comun:"Golondrina Tijerita",nombre_cientifico:"Hirundo rustica",familia:"Hirundinidae",orden:"Passeriformes",descripcion:{adulto:"Golondrina esbelta de cola muy larga y profundamente ahorquillada, con las plumas externas prolongadas en finas 'tijeras'. Frente, mentón y garganta castaño-rojizos. Corona, nuca, dorso y rabadilla azul acero brillante. Alas y cola negruzcas con brillo azulado; la cola abierta muestra una hilera de manchas blancas cerca de la base. Una banda pectoral azul oscura, a veces incompleta, separa la garganta del resto de las partes inferiores, que son canela a ocre-anaranjadas. Pico corto y negro. Patas cortas negruzcas.",juvenil:"El juvenil es más apagado: dorso pardo-azulado con poco brillo, frente y garganta canela pálido, partes inferiores más blanquecinas y cola mucho más corta, sin las tijeras largas del adulto. Es el plumaje que más se ve en Buenos Aires durante el verano."},habitat:["pastizal","humedal","agrícola","aéreo"],residencia:"estival",tamanio:"chico",largo_cm:"17-19",envergadura_cm:"32-34.5",estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","Tucumán","Salta","Jujuy","Catamarca","San Juan","Mendoza","San Luis","La Pampa","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Es la golondrina más extendida del mundo. La mayoría llega a la Argentina desde Norteamérica para pasar nuestro verano, pero desde la década de 1980 una población empezó a criar en la provincia de Buenos Aires (Mar Chiquita), algo excepcional para una migratoria boreal. Caza insectos en vuelo rasante sobre pastizales y lagunas.",sprites:{adulto:"Hirundo_rustica_D",juvenil:"Hirundo_rustica_J",vuelo:"Hirundo_rustica_V"},audio_ebird_code:"barswa",mapa:"Maps/Hirundo_rustica_map.png",thumb_sprite:"",exotica:false,amba:10.56},
{id:56,num:"#163",n_lista:872,nombre_comun:"Ratona",nombre_cientifico:"Troglodytes musculus",familia:"Troglodytidae",orden:"Passeriformes",descripcion:{adulto:"Ave pequeña, ágil e inquieta. Plumaje generalmente pardo-grisáceo uniforme, sin marcas de campo obvias a distancia. Dorso pardo, partes inferiores ocráceo pálido a grisáceo. Ceja pálida, a menudo poco marcada, sin estriado en la corona. Alas levemente barradas de pardo oscuro o negro. Cola corta, redondeada, frecuentemente mantenida erguida hacia arriba. Pico recto en la base, curvándose suavemente hacia una punta fina. Ojo oscuro. Patas color carne pálido. Sexos idénticos en coloración."},habitat:["bosque","urbano","pastizal"],residencia:"permanente",tamanio:"chico",largo_cm:"11-13",envergadura_cm:null,estado:"LC",provincias:[],curiosidades:"Es una de las aves más adaptables de América, presente desde México hasta Tierra del Fuego. Se adapta con facilidad a ambientes muy alterados por el ser humano y es común en ciudades y zonas suburbanas. Suele verse trepando y buscando alimento en grietas y huecos de árboles.",sprites:{adulto:"Troglodytes_musculus_D"},audio_ebird_code:"houwre4",mapa:"Maps/Troglodytes_musculus_map.png",thumb_sprite:"",exotica:false,amba:63.97},
{id:176,num:"#164",n_lista:875,nombre_comun:"Ratona Aperdizada",nombre_cientifico:"Cistothorus platensis",familia:"Troglodytidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro muy chico, de cola corta que suele llevar levantada. Pico negruzco con la parte de abajo amarillenta. Ojo pardo. Dorso pardo oscuro con estrías ocráceas; rabadilla canela. Alas pardo claras con barras ocráceas. Cola ocrácea con barras pardo oscuras. Garganta blanquecina y resto de abajo ocráceo. Patas pardas. Macho y hembra son iguales."},habitat:["pastizal","humedal"],residencia:"estival",tamanio:"chico",largo_cm:"10",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Catamarca","Chubut","Corrientes","Córdoba","Entre Ríos","Jujuy","La Pampa","Mendoza","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"],curiosidades:"Vive escondida en pastizales altos y húmedos, donde se mueve como un ratoncito entre las matas. Para cantar sube a la punta de un yuyo con la cola levantada y larga un trino variado y rápido; enseguida se vuelve a zambullir en el pasto. Hace un nido en forma de bola, con entrada lateral, tejido entre los pastos.",sprites:{adulto:"Cistothorus_platensis_D"},audio_ebird_code:"sedwre",mapa:"Maps/Cistothorus_platensis_map.png",thumb_sprite:"",exotica:false,amba:0.04},
{id:74,num:"#165",n_lista:878,nombre_comun:"Tacuarita Azul",nombre_cientifico:"Polioptila dumicola",familia:"Polioptilidae",orden:"Passeriformes",descripcion:{macho:"Pájaro muy chico y delgado, de cola larga que suele mover y abrir. Corona, nuca y dorso gris azulado. Antifaz negro ancho que cubre frente, zona entre el pico y el ojo y alrededor del ojo, con una fina línea blanca por debajo. Pico fino, gris plomizo oscuro. Ojo pardo oscuro. Alas pardo-negruzcas con las cubiertas y secundarias ribeteadas de blanco. Cola negra con las plumas externas blancas. Garganta y pecho gris claro, que pasa a blanquecino en el vientre. Patas gris plomizo oscuro.",hembra:"La hembra no tiene el antifaz negro: donde el macho es negro, ella es blanquecina, formando una cara clara bordeada atrás por una fina línea oscura detrás de la oreja. Partes superiores gris azuladas, algo más apagadas que en el macho. Mismo patrón de alas y cola."},habitat:["monte","bosque","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"11-13",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","San Luis","La Pampa","Mendoza"],curiosidades:"Recorre sin descanso ramas y arbustos a los saltitos y en vuelos cortos, buscando insectos, larvas y arañas; a menudo se suma a bandadas mixtas con otros pajaritos. La hembra construye un nido en forma de taza con raicillas, telas de araña y plumas, y lo recubre por fuera con trocitos de corteza que lo camuflan en la rama. Pone hasta cuatro huevos celestes con pintas rojizas.",sprites:{macho:"Polioptila_dumicola_M",hembra:"Polioptila_dumicola_F"},audio_ebird_code:"masgna1",mapa:"Maps/Polioptila_dumicola_map.png",thumb_sprite:"",exotica:false,amba:39.28},
{id:196,num:"#166",n_lista:884,nombre_comun:"Zorzal Patagónico",nombre_cientifico:"Turdus falcklandii",familia:"Turdidae",orden:"Passeriformes",descripcion:{adulto:"Zorzal grande. Cabeza pardo negruzca hasta debajo del ojo. Pico amarillo anaranjado. Ojo oscuro con un anillo fino amarillo anaranjado. Dorso, alas y cola pardo oliváceos. Garganta ante con estrías negruzcas marcadas. Pecho y vientre ocráceos, más pálidos que el dorso. Patas amarillo anaranjadas. Macho y hembra son iguales."},habitat:["bosque","urbano","agrícola","monte"],residencia:"permanente",tamanio:"mediano",largo_cm:"23-26",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Chubut","La Pampa","Mendoza","Neuquén","Río Negro","Santa Cruz","Tierra del Fuego"],curiosidades:"Es el zorzal más austral del mundo: llega hasta Tierra del Fuego y las islas Malvinas. Busca lombrices e insectos caminando por el suelo de bosques, jardines y chacras, y también come frutos. Su canto es un silbido fuerte y melodioso.",sprites:{adulto:"Turdus_falcklandii_D"},audio_ebird_code:"austhr1",mapa:"Maps/Turdus_falcklandii_map.png",thumb_sprite:"",exotica:false,amba:0.01},
{id:57,num:"#167",n_lista:888,nombre_comun:"Zorzal Colorado",nombre_cientifico:"Turdus rufiventris",familia:"Turdidae",orden:"Passeriformes",descripcion:{adulto:"Ave mediana y robusta. Cabeza, dorso y alas pardo oliva oscuro uniforme. Garganta blanquecina estriada de pardo. Pecho gris ocráceo; abdomen y plumas de abajo de la cola canela rufo. Cola parda larga. Pico amarillo-anaranjado. Anillo ocular naranja amarillento. Patas grisáceas."},habitat:["urbano","bosque","monte","pastizal"],residencia:"permanente",tamanio:"mediano",largo_cm:25,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"Canta especialmente al amanecer y al atardecer con un silbido melodioso y variado. Se alimenta de frutos, lombrices e insectos que busca en el suelo entre hojas caídas. Es muy común en parques y jardines urbanos.",sprites:{adulto:"Turdus_rufiventris_D"},audio_ebird_code:"rubthr1",mapa:"Maps/Turdus_rufiventris_map.png",thumb_sprite:"",exotica:false,amba:101.52},
{id:58,num:"#168",n_lista:889,nombre_comun:"Zorzal Chalchalero",nombre_cientifico:"Turdus amaurochalinus",familia:"Turdidae",orden:"Passeriformes",descripcion:{adulto:"Zorzal mediano de colores discretos. Partes superiores pardo-oliváceas. Garganta blancuzca con finas estrías pardas longitudinales, rasgo diagnóstico. Pecho pardo-grisáceo pálido con estrías tenues. Vientre blancuzco. Pico amarillo-anaranjado. Patas pardo-opacas. Notablemente más pálido que el Zorzal colorado. Carece de anillo ocular amarillo."},habitat:["urbano","monte","pastizal","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:23,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","Tucumán","Salta","Jujuy"],curiosidades:"Tiene un canto fluido y melodioso, aunque algo más sencillo que el del Zorzal colorado. Comparte hábitat con él en muchas áreas de Buenos Aires. Se alimenta de frutos, lombrices e insectos. 'Pío' hace referencia a sus partes inferiores pálidas, en contraste con el 'colorado' de su pariente de pecho rufo.",sprites:{adulto:"Turdus_amaurochalinus_D"},audio_ebird_code:"crbthr1",mapa:"Maps/Turdus_amaurochalinus_map.png",thumb_sprite:"",exotica:false,amba:37.44},
{id:59,num:"#169",n_lista:897,nombre_comun:"Calandria Grande",nombre_cientifico:"Mimus saturninus",familia:"Mimidae",orden:"Passeriformes",descripcion:{adulto:"Ave mediana y esbelta de postura erguida. Ceja blanca bien marcada sobre una línea ocular oscura. Corona y partes superiores pardo-grisáceas. Alas con dos barras blancas visibles y bordes claros en las plumas secundarias. Cola larga con plumas externas de puntas blancas. Partes inferiores blanco-ante pálido, más cálido en el pecho y flancos. Rabadilla canela. Pico mediano, fino y levemente curvado, negro. Patas largas y negras."},habitat:["urbano","pastizal","agrícola","monte"],residencia:"permanente",tamanio:"mediano",largo_cm:25,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"Es uno de los mejores imitadores de cantos del país, capaz de reproducir los sonidos de docenas de otras especies. Canta con persistencia durante casi todo el año, incluso de noche. Suele cantar desde lo alto de un arbusto o poste.",sprites:{adulto:"Mimus_saturninus_D"},audio_ebird_code:"chbmoc1",mapa:"Maps/Mimus_saturninus_map.png",thumb_sprite:"",exotica:false,amba:79.36},
{id:133,num:"#170",n_lista:898,nombre_comun:"Calandria Real",nombre_cientifico:"Mimus triurus",familia:"Mimidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro mediano y esbelto, de cola larga, parecido a la Calandria Grande pero con mucho blanco en alas y cola. Corona gris parda. Ceja blanca y una línea oscura que pasa por el ojo. Pico negro, fino y algo curvo. Ojo pardo. Dorso gris pardusco. Rabadilla canela. Alas pardas oscuras con una gran banda blanca, que se ve con el ala cerrada y resalta mucho en vuelo. Cola con las plumas del centro negras y las de los costados blancas. Garganta blanca. Pecho y vientre ocráceos, más canela en los costados. Patas negras. Macho y hembra son iguales.",juvenil:"El juvenil es parecido al adulto, pero tiene el pecho con pintas oscuras y menos blanco en el ala."},habitat:["monte","pastizal","agrícola","urbano"],residencia:"invernal",tamanio:"mediano",largo_cm:"22",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","La Rioja","Catamarca","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut"],curiosidades:"Le dicen 'calandria de invierno' porque en Buenos Aires se la ve sobre todo en los meses fríos, cuando llega desde el centro y el oeste del país, donde cría. Cuando vuela se abre como un abanico blanco y negro: la gran banda blanca de las alas y los costados blancos de la cola la hacen inconfundible. Pasa mucho tiempo en el suelo, donde camina y corre detrás de insectos, y también come semillas y frutos que busca hasta unos 5 m de altura. Su canto es complejo y variado, e imita las voces de otras aves.",sprites:{adulto:"Mimus_triurus_D"},audio_ebird_code:"whbmoc1",mapa:"Maps/Mimus_triurus_map.png",thumb_sprite:"",exotica:false,amba:3.89},
{id:194,num:"#171",n_lista:900,nombre_comun:"Estornino Crestado",nombre_cientifico:"Acridotheres cristatellus",familia:"Sturnidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro mediano, negro con reflejos verdosos en la parte de abajo, y una cresta corta y desflecada sobre la frente que tapa la base del pico. Pico color marfil. Ojo naranja o amarillo. Alas negras con una mancha blanca en la base de las plumas largas, que se nota mucho en vuelo y a veces con el ala cerrada. Cola negra con la punta azulina. Plumas de debajo de la cola negras con puntas blancas. Patas amarillas. Macho y hembra son iguales; la hembra tiene la cresta algo más chica."},habitat:["urbano","agrícola","pastizal"],residencia:"permanente",tamanio:"mediano",largo_cm:"25",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Córdoba","Santa Fe"],curiosidades:"Es originario del sur de China y Vietnam. Llegó a Buenos Aires a fines de la década de 1980, probablemente con aves escapadas o liberadas, y desde entonces se expandió por la ciudad y el conurbano. Camina por el pasto como un tordo, anida en huecos de edificios y árboles, y compite por esos sitios con aves nativas.",sprites:{adulto:"Acridotheres_cristatellus_D"},audio_ebird_code:"cremyn",mapa:"Maps/Acridotheres_cristatellus_map.png",thumb_sprite:"",exotica:true,amba:1.57},
{id:72,num:"#172",n_lista:901,nombre_comun:"Estornino Pinto",nombre_cientifico:"Sturnus vulgaris",familia:"Sturnidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro robusto, de cola corta, alas triangulares y pico largo y puntiagudo. Plumaje negro con brillos violáceos y verdosos, densamente salpicado de pintas blancas en cabeza, pecho y vientre, y de pintas ocráceas en dorso y alas. Plumas de las alas con bordes ocre. Pico negruzco. Patas rosado-rojizas. Iris pardo intenso en el macho, pardo-grisáceo en la hembra.",reproductivo:"Con el desgaste de las plumas en primavera, las pintas casi desaparecen y el plumaje luce negro lustroso con reflejos violetas y verdes. Pico amarillo, con la base gris-azulada en el macho y rosada en la hembra. Patas rosado-rojizas.",juvenil:"El juvenil es muy distinto: pardo grisáceo parejo, sin pintas ni brillo, algo más pálido abajo y con la barbilla blanquecina. Plumas del ala y de la cola orilladas de canela. Pico negruzco."},habitat:["urbano","agrícola","pastizal"],residencia:"permanente",tamanio:"mediano",largo_cm:"19-23",envergadura_cm:"31-44",estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Córdoba","La Pampa","Mendoza","San Luis","Santiago del Estero","Corrientes","Río Negro"],curiosidades:"Especie exótica, originaria de Eurasia. Se detectó por primera vez en jardines de la ciudad de Buenos Aires en 1987 y desde entonces se expandió unos 7,5 km por año por la región pampeana. Compite con aves nativas por los huecos para anidar, como carpinteros y golondrinas. Es un gran imitador de sonidos.",sprites:{adulto:"Sturnus_vulgaris_D",reproductivo:"Sturnus_vulgaris_R",juvenil:"Sturnus_vulgaris_J"},audio_ebird_code:"eursta",mapa:"Maps/Sturnus_vulgaris_map.png",thumb_sprite:"",exotica:true,amba:57.62},
{id:60,num:"#173",n_lista:902,nombre_comun:"Gorrión",nombre_cientifico:"Passer domesticus",familia:"Passeridae",orden:"Passeriformes",descripcion:{macho:"Ave chica y rechoncha. Corona gris con franjas castaño-rojizas en los lados. Cara gris con una mancha negra en la garganta y pecho que varía según la estación. Dorso castaño con rayas negras. Alas pardas con una barra alar blanca. Vientre gris pálido. Pico corto y cónico, oscuro en época reproductiva y más claro fuera de ella. Patas rosadas.",hembra:"Más apagada. Sin el negro en la garganta. Ceja ante pálida bien marcada. Dorso pardo rayado. Pico más claro. Patas rosadas."},habitat:["urbano","agrícola"],residencia:"permanente",tamanio:"chico",largo_cm:15,envergadura_cm:24,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"Especie introducida desde Europa en el siglo XIX. Es una de las aves más distribuidas del mundo gracias a su asociación con los asentamientos humanos. Los machos con mayor mancha negra en el pecho tienen mayor éxito reproductivo.",sprites:{macho:"Passer_domesticus_M",hembra:"Passer_domesticus_F"},audio_ebird_code:"houspa",mapa:"Maps/Passer_domesticus_map.png",thumb_sprite:"",exotica:true,amba:59.46},
{id:174,num:"#174",n_lista:906,nombre_comun:"Cachirla Goteada",nombre_cientifico:"Anthus correndera",familia:"Motacillidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico y esbelto, que camina por el suelo. Corona estriada de pardo oscuro y ante; cara clara con ceja blanquecina y una raya oscura fina en la mejilla. Pico pardo, con la base de abajo pálida y la punta oscura. Ojo pardo. Dorso pardo oscuro jaspeado de ocre, con dos líneas blancas a los costados del lomo. Alas pardas con las plumas ribeteadas de ocráceo. Cola parda con las plumas de los costados blanquecinas. Garganta y vientre blanquecinos; pecho con un leve tinte ocráceo y manchas pardo oscuras en forma de gota, que siguen como estrías por los costados. Patas rosadas, con la uña de atrás muy larga. Macho y hembra son iguales."},habitat:["pastizal","agrícola"],residencia:"estival",tamanio:"chico",largo_cm:"15",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Catamarca","Chubut","Corrientes","Córdoba","Entre Ríos","Jujuy","La Pampa","Mendoza","Neuquén","Río Negro","Salta","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"],curiosidades:"Camina y corre entre los pastos cortos buscando insectos, y al asustarse vuela mostrando los costados blancos de la cola. En primavera el macho sube en vuelo cantando y baja planeando con las alas abiertas. Anida en el suelo, escondido entre las matas de pasto.",sprites:{adulto:"Anthus_correndera_D"},audio_ebird_code:"corpip1",mapa:"Maps/Anthus_correndera_map.png",thumb_sprite:"",exotica:false,amba:0.73},
{id:206,num:"#175",n_lista:908,nombre_comun:"Cachirla Pálida",nombre_cientifico:"Anthus hellmayri",familia:"Motacillidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico y esbelto, que camina por el suelo. Pico negruzco. Ojo pardo. Dorso pardo oscuro jaspeado de ocre oscuro. Alas pardo oscuras. Cola pardo oscura con las plumas de los costados ocres, con una franja fina parda oscura. Abajo grisáceo, con un tono ocre en el pecho, apenas jaspeado de pardo oscuro. Patas rosadas. Macho y hembra son iguales."},habitat:["pastizal","agrícola"],residencia:"permanente",tamanio:"chico",largo_cm:"14",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Catamarca","Chubut","Corrientes","Córdoba","Entre Ríos","Jujuy","La Pampa","Mendoza","Neuquén","Río Negro","Salta","San Luis","Santa Cruz","Santa Fe","Tucumán"],curiosidades:"Se parece mucho a la Cachirla Goteada, pero tiene el pecho más liso, con pocas estrías finas, y le faltan las líneas blancas del lomo. Vive en pastizales de altura y de llanura, y en primavera el macho canta en vuelo, subiendo y bajando en planeo.",sprites:{adulto:"Anthus_hellmayri_D"},audio_ebird_code:"helpip1",mapa:"Maps/Anthus_hellmayri_map.png",thumb_sprite:"",exotica:false,amba:0.45},
{id:61,num:"#176",n_lista:913,nombre_comun:"Cabecitanegra",nombre_cientifico:"Spinus magellanicus",familia:"Fringillidae",orden:"Passeriformes",descripcion:{macho:"Pequeño fringílido de pico cónico y puntiagudo. Capucha negra que cubre toda la cabeza, garganta y pecho superior, con un corte limpio contra el amarillo del pecho inferior. Dorso oliva. Pecho inferior, vientre y rabadilla amarillo brillante. Parches amarillo brillante en el ala plegada que contrastan con las plumas de vuelo negras. Cola negra, levemente ahorquillada.",hembra:"Similar al macho pero sin capucha negra: cabeza amarillo-oliva apagada. Dorso oliva. Partes inferiores amarillo pálido. Parches amarillos en el ala más tenues que en el macho."},habitat:["bosque","pastizal","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"10-12",envergadura_cm:null,estado:"LC",provincias:[],curiosidades:"El siskin más ampliamente distribuido de Sudamérica. Se mueve en bandadas ruidosas con vuelo ondulante, alimentándose de semillas tanto en la vegetación como en el suelo.",sprites:{macho:"Spinus_magellanicus_M",hembra:"Spinus_magellanicus_F"},audio_ebird_code:"hoosis1",mapa:"Maps/Spinus_magellanicus_map.png",thumb_sprite:"",exotica:false,amba:39.55},
{id:155,num:"#177",n_lista:926,nombre_comun:"Cachilo Ceja Amarilla",nombre_cientifico:"Ammodramus humeralis",familia:"Passerellidae",orden:"Passeriformes",descripcion:{adulto:"Pajarito chico de pastizal. Dorso gris con estrías pardas. Ceja amarilla, más marcada delante del ojo. Pico córneo grisáceo con la parte de arriba negruzca. Ojo pardo. Alas pardas con las plumas bordeadas de gris y el borde del ala amarillo. Cola parda, corta, con un fino borde ocráceo. Garganta y partes de abajo blanquecinas, con los costados ocráceos. Patas córneo rosadas. Macho y hembra son iguales."},habitat:["pastizal","agrícola"],residencia:"permanente",tamanio:"chico",largo_cm:"12",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","Misiones","Salta","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Pasa casi todo el tiempo en el suelo, entre los pastos, por donde corre rápido más que volar. Para cantar sube a un poste, un alambre o un pasto alto, y su canto es un trino agudo y fino, como de insecto.",sprites:{adulto:"Ammodramus_humeralis_D"},audio_ebird_code:"graspa1",mapa:"Maps/Ammodramus_humeralis_map.png",thumb_sprite:"",exotica:false,amba:0.49},
{id:62,num:"#178",n_lista:930,nombre_comun:"Chingolo",nombre_cientifico:"Zonotrichia capensis",familia:"Passerellidae",orden:"Passeriformes",descripcion:{adulto:"Ave pequeña y terrícola muy familiar. Corona gris bordeada por franjas negras a los lados. Ceja blanca bien definida. Bigotilla negra prominente. Nuca y cuello rufo-ante. Dorso pardo con estrías negras. Barras alares blancas. Cola parda. Garganta blanca. Pecho gris blancuzco con una mancha negra a cada lado. Vientre blancuzco. Patas color carne."},habitat:["urbano","pastizal","monte","agrícola"],residencia:"permanente",tamanio:"chico",largo_cm:15,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro","Chubut"],curiosidades:"Es uno de los pájaros más comunes e identificables de Argentina. Su canto sencillo y repetitivo al amanecer forma parte del paisaje sonoro de jardines, plazas y campos de todo el país. Se alimenta principalmente de semillas recogidas del suelo. Convive con facilidad con los humanos.",sprites:{adulto:"Zonotrichia_capensis_D"},audio_ebird_code:"rucspa1",mapa:"Maps/Zonotrichia_capensis_map.png",thumb_sprite:"",exotica:false,amba:71.13},
{id:103,num:"#179",n_lista:934,nombre_comun:"Pecho Colorado",nombre_cientifico:"Leistes superciliaris",familia:"Icteridae",orden:"Passeriformes",descripcion:{macho:"Pajarito de campo, robusto, de cola corta. Macho casi todo negro, con una ceja blanca bien marcada detrás del ojo. Pico negro, puntiagudo, con la base de la parte de abajo grisácea. Ojo pardo oscuro. Dorso, alas y cola negros, con los 'hombros' rojos. Garganta, frente del cuello y pecho de un rojo intenso; resto de abajo negro. Patas negruzcas. Fuera de la época de cría las plumas negras tienen bordes gris pardusco y el macho se ve más apagado.",hembra:"La hembra es muy distinta: parda con estrías ocráceas en el dorso, ceja y garganta ocráceas, pecho ocráceo con un tinte rosado, y pecho, vientre y costados jaspeados de oscuro. Alas pardas con bordes ocráceos y cola con barras pardo oscuras y claras."},habitat:["pastizal","agrícola"],residencia:"estival",tamanio:"chico",largo_cm:"18",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","Tucumán","Salta","Jujuy","Catamarca"],curiosidades:"En primavera el macho sube volando hasta unos 10 metros y se deja caer con las alas plegadas como un paracaídas mientras canta un zumbido seguido de notas cortadas; también canta desde postes, alambrados y yuyos altos. Vive en pastizales, alfalfares y sembrados, y fuera de la época de cría anda en bandadas que pueden ser muy grandes. Hace el nido en el suelo, una tacita de pasto escondida entre los yuyos. Sufre mucho a los tordos, que le dejan sus huevos: una vez se encontró un nido con 19 huevos de tordo y uno solo de pecho colorado.",sprites:{macho:"Leistes_superciliaris_M"},audio_ebird_code:"whbbla2",mapa:"Maps/Leistes_superciliaris_map.png",thumb_sprite:"",exotica:false,amba:3.32},
{id:113,num:"#180",n_lista:936,nombre_comun:"Loica",nombre_cientifico:"Leistes loyca",familia:"Icteridae",orden:"Passeriformes",descripcion:{macho:"La más grande de las loicas, robusta, de cola larga y pico largo y puntiagudo. Cabeza negruzca con una ceja larga, roja entre el pico y el ojo y blanca detrás del ojo, y un bigote blanco corto. Pico blanquecino azulado con la punta oscura. Ojo pardo oscuro. Dorso, alas y cola pardos con estrías negruzcas; algunas plumas del hombro rojas. Barbilla, garganta y pecho rojo rosado intenso, con los costados negruzcos. Vientre negro; costados y la parte de abajo de la cola estriados de ante y negro. Patas gris pardas.",hembra:"La hembra es más apagada: la ceja es toda blanca, no tiene rojo en la cara, la garganta es blanca y el dorso más claro. La parte de abajo es grisácea, muy estriada de negruzco, con el centro del pecho y del vientre teñido de rojo pálido o rosado."},habitat:["pastizal","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:"24-27",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Córdoba","San Luis","La Pampa","Mendoza","San Juan","Catamarca","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Es la loica típica de la Patagonia y del oeste del país, y también vive en Buenos Aires, donde en la costa atlántica se la encuentra entre los pastos de los médanos. Se la ve mucho posada en postes de alambrado, rocas y arbustos, mostrando el pecho rojo. Come sobre todo insectos que busca en el suelo dando vuelta hojas y restos, y fuera de la época de cría forma bandadas de hasta 100 aves. La hembra arma el nido en el suelo, una taza de pasto muy escondida entre la vegetación, y es tan cuidadosa que nunca baja directo a él: aterriza cerca y llega caminando agachada para no delatarlo.",sprites:{macho:"Leistes_loyca_M"},audio_ebird_code:"lotmea1",mapa:"Maps/Leistes_loyca_map.png",thumb_sprite:"",exotica:false,amba:0.01},
{id:150,num:"#181",n_lista:938,nombre_comun:"Boyero Negro",nombre_cientifico:"Cacicus solitarius",familia:"Icteridae",orden:"Passeriformes",descripcion:{adulto:"Pájaro mediano, todo negro, de cola larga. Pico largo, grueso y puntiagudo, verde pálido con la base celeste, muy llamativo. Ojo rojo. Patas gris oscuras. Macho y hembra son iguales; el macho es apenas más grande."},habitat:["monte","ribereño","arbolado"],residencia:"permanente",tamanio:"mediano",largo_cm:"24-25",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","Misiones","Salta","Santa Fe","Santiago del Estero"],curiosidades:"Recorre los árboles solo o en pareja, revisando cortezas y flores con su pico largo para sacar insectos. Cuelga un nido largo en forma de bolsa tejida, a menudo sobre el agua. Tiene un canto muy variado, con silbidos, maullidos y sonidos metálicos.",sprites:{adulto:"Cacicus_solitarius_D"},audio_ebird_code:"sobcac1",mapa:"Maps/Cacicus_solitarius_map.png",thumb_sprite:"",exotica:false,amba:10.67},
{id:107,num:"#182",n_lista:942,nombre_comun:"Boyerito",nombre_cientifico:"Icterus pyrrhopterus",familia:"Icteridae",orden:"Passeriformes",descripcion:{adulto:"Pájaro esbelto, de cola larga, todo negro con los 'hombros' canela, como una charretera. Pico negro, fino, recto y puntiagudo. Ojo pardo rojizo. Dorso, alas y cola negros; la mancha canela del hombro se ve bien con el ala plegada. Garganta, pecho y vientre negros. Patas gris plomizo. Macho y hembra son iguales; el juvenil es negro más apagado y tiene la mancha del hombro más pálida."},habitat:["monte","bosque","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"19-20",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Mendoza"],curiosidades:"Recorre las ramas y el follaje de los árboles, muchas veces colgado cabeza abajo, buscando insectos, arañas, frutas, flores, néctar y hasta savia. Es común en plazas y arbolados de la ciudad. Teje un nido en forma de bolsita colgante con fibras vegetales o crines, atado a ramas o a la parte de abajo de una hoja grande, como las de las palmeras; a veces lo cuelga en plantas de maceta, en clavel del aire o en nidos abandonados de otras aves. Pone 3 o 4 huevos y los dos padres alimentan a los pichones. Es uno de los pájaros a los que el tordo renegrido les deja sus huevos.",sprites:{adulto:"Icterus_pyrrhopterus_D"},audio_ebird_code:"epaori4",mapa:"Maps/Icterus_pyrrhopterus_map.png",thumb_sprite:"",exotica:false,amba:22.71},
{id:110,num:"#183",n_lista:943,nombre_comun:"Tordo Pico Corto",nombre_cientifico:"Molothrus rufoaxillaris",familia:"Icteridae",orden:"Passeriformes",descripcion:{adulto:"Tordo mediano, todo negro con un brillo suave, sin el reflejo violáceo del Tordo Renegrido. Pico negro, corto y cónico. Ojo pardo rojizo. Dorso, alas y cola negros. Debajo del ala tiene plumas castañas que casi nunca se ven con el ala cerrada. Garganta, pecho y vientre negros. Patas negras. La hembra es parecida al macho pero algo más apagada.",juvenil:"El juvenil es muy distinto del adulto: pardo grisáceo con las alas rufas, casi igual al Tordo Músico, que es el que lo cría. Anda en bandadas junto a ellos y cambia al plumaje negro a las pocas semanas."},habitat:["pastizal","agrícola","monte","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:17,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","La Rioja","Catamarca","Tucumán","Salta","Jujuy","Neuquén","Río Negro"],curiosidades:"No hace nido ni cría a sus pichones: pone sus huevos en el nido de otras aves, casi siempre del Tordo Músico. Es el único parásito de cría conocido cuyos pichones imitan a los del ave que los cría: tienen casi el mismo plumaje y hasta copian los pedidos de comida de los pichones de Tordo Músico. En un solo nido pueden aparecer muchos huevos, porque varias hembras llegan a poner en el mismo. Suele andar en parejas o en bandadas junto con el Tordo Músico, y busca semillas e insectos en el suelo, muchas veces cerca del ganado. Su voz es un grito fuerte, explosivo y penetrante.",sprites:{adulto:"Molothrus_rufoaxillaris_D"},audio_ebird_code:"scrcow1",mapa:"Maps/Molothrus_rufoaxillaris_map.png",thumb_sprite:"",exotica:false,amba:13.83},
{id:63,num:"#184",n_lista:945,nombre_comun:"Tordo Renegrido",nombre_cientifico:"Molothrus bonariensis",familia:"Icteridae",orden:"Passeriformes",descripcion:{macho:"Ave mediana. Plumaje enteramente negro azulado con brillo iridiscente azul-violáceo intenso. Pico corto y cónico oscuro. Ojo oscuro. Patas negras. Cola larga.",hembra:"Plumaje pardo-grisáceo uniforme, ligeramente más pálido en las partes inferiores. Pico corto y cónico oscuro. Ojo oscuro. Patas negras. Cola larga."},habitat:["urbano","pastizal","agrícola","ribereño"],residencia:"permanente",tamanio:"chico",largo_cm:19,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"Es un pájaro parásito de nidada: pone sus huevos en los nidos de otras especies para que las críen. No construye nido propio. Una hembra puede poner hasta 40 huevos por temporada en distintos nidos.",sprites:{macho:"Molothrus_bonariensis_M",hembra:"Molothrus_bonariensis_F"},audio_ebird_code:"shicow",mapa:"Maps/Molothrus_bonariensis_map.png",thumb_sprite:"",exotica:false,amba:51.37},
{id:64,num:"#185",n_lista:946,nombre_comun:"Federal",nombre_cientifico:"Amblyramphus holosericeus",familia:"Icteridae",orden:"Passeriformes",descripcion:{adulto:"Ave mediana de contraste muy llamativo. Cabeza, garganta, pecho superior y muslos de color anaranjado-escarlata intenso. Todo el resto del cuerpo negro profundo: dorso, alas, vientre, cola y patas. Pico largo y puntiagudo, oscuro. Ojo pardo oscuro. Sexos similares. Inmaduro con plumaje totalmente negro, con escarlata que aparece gradualmente."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"mediano",largo_cm:24,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Córdoba","Tucumán"],curiosidades:"Habita exclusivamente entre los juncales y cañaverales de lagunas y bañados. Su plumaje escarlata y negro lo hace inconfundible. Se alimenta principalmente de insectos acuáticos y sus larvas. El nombre 'federal' hace alusión a los colores de la escarapela argentina.",sprites:{adulto:"Amblyramphus_holosericeus_D"},audio_ebird_code:"schbla1",mapa:"Maps/Amblyramphus_holosericeus_map.png",thumb_sprite:"",exotica:false,amba:2.16},
{id:65,num:"#186",n_lista:949,nombre_comun:"Tordo Músico",nombre_cientifico:"Agelaioides badius",familia:"Icteridae",orden:"Passeriformes",descripcion:{adulto:"Ictérido de tamaño mediano-pequeño y plumaje monomórfico apagado. Cabeza y partes superiores pardo-grisáceas, algo más pálidas en las partes inferiores. Pico, lores y zona alrededor del ojo oscuros a negros. Alas rufas o castañas, con las puntas de las primarias, porciones internas de las secundarias y la cola negruzcas. Ojo oscuro. Patas oscuras."},habitat:["pastizal","bosque","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"18-19",envergadura_cm:null,estado:"LC",provincias:[],curiosidades:"Es el único ictérido de la región con rufo visible en las alas. A diferencia de otros tordos, cría sus propios huevos y pichones, y suele albergar en su nido los huevos del Tordo Pico Corto, un parásito de nidada que lo elige casi exclusivamente.",sprites:{adulto:"Agelaioides_badius_D"},audio_ebird_code:"bawcow4",mapa:"Maps/Agelaioides_badius_map.png",thumb_sprite:"",exotica:false,amba:57.42},
{id:84,num:"#187",n_lista:951,nombre_comun:"Varillero Ala Amarilla",nombre_cientifico:"Agelasticus thilius",familia:"Icteridae",orden:"Passeriformes",descripcion:{macho:"Pájaro chico de juncales. Todo negro, con una mancha amarilla en el hombro que a veces esconde entre las plumas y se ve bien en vuelo. Pico cónico, puntiagudo y negro. Ojo pardo. Por debajo del ala, las tapadas también son amarillas. En primavera puede mostrar algún jaspeado pardusco. Patas negras.",hembra:"Muy distinta al macho. Corona pardo oscura y una ceja ancha blancuzca bien marcada. Cachete pardo oscuro. Dorso pardo con estrías oscuras y algunos bordes castaños; alas pardo oscuras con bordes más claros. Partes inferiores pardo ocráceas claras con estrías oscuras, salvo la barbilla y la garganta. Hombros y tapadas amarillos, como el macho. Pico negro. Ojo pardo. Patas negras."},habitat:["humedal","ribereño","pastizal","agrícola"],residencia:"permanente",tamanio:"chico",largo_cm:"18-19",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","Neuquén","Río Negro","Chubut","Santa Cruz","Salta","Jujuy","Catamarca","La Rioja"],curiosidades:"Vive en juncales, totorales y la vegetación de la orilla de lagunas y bañados, y fuera de la época de cría también sale a campos barrosos, pastizales y cultivos cercanos. Come sobre todo insectos acuáticos y semillas, además de arañas, crustáceos y caracolitos, y suele andar en bandadas. Cría en colonias: la hembra teje un nido en forma de taza entre juncos o totoras y pone de 2 a 4 huevos claros con manchas oscuras. Es parasitado a menudo por el Tordo Renegrido. En Chile lo llaman 'trile'.",sprites:{macho:"Agelasticus_thilius_M"},audio_ebird_code:"yewbla2",mapa:"Maps/Agelasticus_thilius_map.png",thumb_sprite:"",exotica:false,amba:10.62},
{id:66,num:"#188",n_lista:952,nombre_comun:"Varillero Congo",nombre_cientifico:"Chrysomus ruficapillus",familia:"Icteridae",orden:"Passeriformes",descripcion:{macho:"Macho de aspecto contrastado. Frente, corona y garganta castaño-rojizas brillantes. Todo el resto del plumaje negro intenso: pecho, dorso, alas y cola. Pico largo, cónico y puntiagudo, negro. Patas negras.",hembra:"Hembra discreta. Partes superiores pardo oscuras con suave estriado. Garganta ante pálida. Pecho y vientre pardo-oliváceo. Sin el capucho castaño del macho. Pico negro cónico. Patas negras."},habitat:["humedal","laguna","ribereño"],residencia:"permanente",tamanio:"chico",largo_cm:17,envergadura_cm:28,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa"],curiosidades:"Forma colonias de nidificación en juncales y totorales, a menudo junto a otras aves acuáticas. Fuera de la temporada reproductiva puede congregarse en bandadas de hasta un millar de individuos. Su nombre 'congo' alude al negro intenso del plumaje del macho.",sprites:{macho:"Chrysomus_ruficapillus_M",hembra:"Chrysomus_ruficapillus_F"},audio_ebird_code:"chcbla2",mapa:"Maps/Chrysomus_ruficapillus_map.png",thumb_sprite:"",exotica:false,amba:3.86},
{id:75,num:"#189",n_lista:955,nombre_comun:"Pecho Amarillo",nombre_cientifico:"Pseudoleistes virescens",familia:"Icteridae",orden:"Passeriformes",descripcion:{adulto:"Ictérido robusto de pico largo, fino y puntiagudo. Cabeza pardo oscuro con tono oliváceo. Pico negro. Ojo pardo. Dorso, alas y cola pardo oliváceo oscuro; los hombros y las cubiertas de las alas son amarillo intenso, casi ocultos con el ala plegada y muy llamativos en vuelo. Garganta y parte alta del pecho pardo oliváceo; la parte baja del pecho y el vientre son amarillo intenso, con un corte neto. Flancos y zona bajo la cola pardos. Patas negras. Macho y hembra iguales.",juvenil:"El juvenil tiene la garganta amarillenta, el pecho estriado de amarillo y pardo y la mandíbula inferior amarillenta."},habitat:["humedal","pastizal","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:"20-24",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Córdoba","San Luis","La Pampa"],curiosidades:"Muy sociable: anda en parejas o en grupos de hasta 25-30 individuos que buscan insectos, lombrices, larvas, crustáceos y semillas en el suelo cerca de lagunas y bañados, mientras uno de ellos vigila posado en un junco o una rama. Vuela bajo, con aleteos repetidos y cortos planeos, mostrando el amarillo de los hombros. Arma un nido en forma de taza con ramitas y barro.",sprites:{adulto:"Pseudoleistes_virescens_D",juvenil:"Pseudoleistes_virescens_J",vuelo:"Pseudoleistes_virescens_V"},audio_ebird_code:"baymar1",mapa:"Maps/Pseudoleistes_virescens_map.png",thumb_sprite:"",exotica:false,amba:2.62},
{id:127,num:"#190",n_lista:956,nombre_comun:"Arañero Cara Negra",nombre_cientifico:"Geothlypis velata",familia:"Parulidae",orden:"Passeriformes",descripcion:{macho:"Pajarito chico, verde oliva y amarillo, que anda escondido en pastizales y matorrales húmedos. Antifaz negro ancho que va de la frente al ojo y cubre las mejillas. Corona gris plomiza. Pico negruzco arriba y rosado en la base de abajo. Ojo pardo oscuro. Dorso verde oliva. Alas pardas con bordes oliva. Cola parda olivácea. Garganta, pecho y vientre amarillo intenso. Patas rosadas.",hembra:"La hembra no tiene antifaz negro ni corona gris: la cabeza es pardo oliva, con una línea amarillenta clara sobre el ojo. Dorso pardo grisáceo, más apagado que el del macho. Garganta, pecho y vientre amarillo pálido."},habitat:["humedal","pastizal","ribereño","monte"],residencia:"estival",tamanio:"chico",largo_cm:"13-14.3",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","La Rioja","Catamarca","Tucumán","Salta","Jujuy"],curiosidades:"Es más fácil oírlo que verlo: anda oculto a poca altura entre pajonales, bañados, matorrales y yuyales de orillas de caminos, y en la época de cría el macho canta sin parar un silbido melodioso, a veces desde una percha a la vista. Come insectos, arañas y larvas que busca desde el suelo hasta unos 2 metros de altura. Llega a Buenos Aires en primavera para criar y en otoño la mayoría se va hacia el norte. Hace un nido en forma de taza, de fibras vegetales y raicillas, en el suelo o entre los pastos a baja altura, y pone 3 huevos blancos con pintas castañas y grises.",sprites:{macho:"Geothlypis_velata_M"},audio_ebird_code:"masyel5",mapa:"Maps/Geothlypis_velata_map.png",thumb_sprite:"",exotica:false,amba:12.68},
{id:111,num:"#191",n_lista:958,nombre_comun:"Pitiayumí",nombre_cientifico:"Setophaga pitiayumi",familia:"Parulidae",orden:"Passeriformes",descripcion:{macho:"Pajarito muy chico e inquieto, de cola corta. Cabeza gris azulada, con la zona entre el pico y el ojo negra. Pico fino, negruzco arriba y amarillo abajo. Ojo pardo oscuro. Dorso gris azulado con una mancha verde oliva en la espalda. Alas negruzcas con bordes grises y dos bandas blancas. Cola negruzca con blanco en las plumas de los costados. Garganta y pecho amarillos con un fuerte tono anaranjado. Vientre amarillo. Patas rosadas o rojizas.",hembra:"La hembra es parecida al macho pero más apagada, con poco o nada de anaranjado en el pecho, y sin el negro entre el pico y el ojo."},habitat:["monte","bosque","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"9-11",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","La Rioja","Catamarca","Tucumán","Salta","Jujuy"],curiosidades:"Su nombre viene del guaraní: en Paraguay 'pitpit pitiayumi' es el nombre de un pajarito de pecho amarillo. Es muy movedizo y recorre las ramas medias y altas de los árboles revisando claveles del aire y líquenes en busca de insectos; también come néctar, flores y frutos, y a veces caza al vuelo. Su canto es un trino muy agudo que sube y baja. Arma el nido dentro de una mata de líquenes, con forma de bolsita o globo, forrado por dentro con algunas cerdas, y pone 3 huevos blancos con pintitas.",sprites:{macho:"Setophaga_pitiayumi_M"},audio_ebird_code:"tropar",mapa:"Maps/Setophaga_pitiayumi_map.png",thumb_sprite:"",exotica:false,amba:20.48},
{id:123,num:"#192",n_lista:965,nombre_comun:"Arañero Coronado Chico",nombre_cientifico:"Basileuterus culicivorus",familia:"Parulidae",orden:"Passeriformes",descripcion:{adulto:"Pajarito chico e inquieto, gris y amarillo. Cabeza gris, con una franja anaranjada o amarilla en el centro de la corona, semioculta, bordeada a cada lado por una línea negra. Ceja blanca o amarillenta y una línea negra que pasa por el ojo. Pico fino, pardo. Ojo pardo. Dorso gris oliváceo. Alas y cola pardas. Garganta, pecho y vientre amarillos. Patas anaranjado claro. Macho y hembra son iguales; el juvenil es más apagado y pardusco y casi no tiene el dibujo de la cabeza."},habitat:["bosque","monte","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"12-13.5",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Catamarca","Tucumán","Salta","Jujuy"],curiosidades:"Recorre los estratos bajo y medio de bosques, selvas y selvas en galería, muy movedizo, buscando insectos y arañas —de ahí su nombre— y también algunos frutos. Su canto es una serie aguda y fina, 'pit-sit-sit-sit-sit', y su llamado un 'tsip' seco. Hace un nido globular de fibras vegetales, raicillas y hojas, con la entrada al costado, escondido en el suelo del bosque bajo la hojarasca o en una barranca, y pone 2 o 3 huevos blancos con manchitas. Si un predador se acerca al nido, los padres fingen estar heridos para alejarlo.",sprites:{adulto:"Basileuterus_culicivorus_D"},audio_ebird_code:"gcrwar",mapa:"Maps/Basileuterus_culicivorus_map.png",thumb_sprite:"",exotica:false,amba:20.55},
{id:143,num:"#193",n_lista:967,nombre_comun:"Fueguero",nombre_cientifico:"Piranga flava",familia:"Cardinalidae",orden:"Passeriformes",descripcion:{macho:"Pájaro mediano, de pico grueso. El macho es todo rojo anaranjado, un poco más oscuro en el dorso y las alas. Pico con la parte de arriba negra y la de abajo córnea o amarillenta. Ojo pardo. Patas gris parduscas.",hembra:"La hembra es amarillo oliva por arriba y amarilla por abajo, con las alas y la cola pardas orilladas de amarillento."},habitat:["monte","bosque","arbolado","urbano"],residencia:"invernal",tamanio:"chico",largo_cm:"17",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Rioja","Misiones","Salta","San Juan","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"El macho, de un rojo anaranjado intenso, es de los pájaros más vistosos de los montes y arboledas. En Buenos Aires se ve sobre todo en otoño e invierno, cuando llegan individuos desde el norte y aparecen en parques y plazas. Anda solo o en pareja por la parte alta de los árboles, buscando insectos y frutos.",sprites:{macho:"Piranga_flava_M",hembra:"Piranga_flava_F"},audio_ebird_code:"heptan",mapa:"Maps/Piranga_flava_map.png",thumb_sprite:"",exotica:false,amba:6.77},
{id:67,num:"#194",n_lista:987,nombre_comun:"Jilguero Dorado",nombre_cientifico:"Sicalis flaveola",familia:"Thraupidae",orden:"Passeriformes",descripcion:{macho:"Ave pequeña y robusta (ssp pelzelni). Macho con cabeza uniformemente amarillo-dorado, sin naranja intenso en la corona. Dorso amarillo-oliváceo con finas estrías pardas. Pecho con estrías pardas finas. Partes inferiores amarillo limón. Pico corto y cónico, mandíbula superior gris oscuro, inferior gris-pálida. Patas gris oscuro. Ojo pardo oscuro.",hembra:"Pardo-estriada por encima con estrías oscuras bien marcadas en corona y dorso. Partes inferiores blancuzco-ante con estrías pardas en el pecho. Algo de tinte amarillo-oliváceo en los bordes de las alas y cola. Patas gris oscuro. Pico gris. Mucho menos vistosa que el macho."},habitat:["urbano","pastizal","agrícola","monte"],residencia:"permanente",tamanio:"chico",largo_cm:14,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Tucumán","Salta","Jujuy","Mendoza","San Luis"],curiosidades:"Uno de los canarios silvestres más comunes de Argentina. El macho tiene un canto melodioso y fluido que lo hace muy apreciado en la avicultura. Se alimenta principalmente de semillas y forma bandadas en los pastizales y bordes de camino. Anida en grietas de paredes, aleros y huecos de árboles.",sprites:{macho:"Sicalis_flaveola_M",hembra:"Sicalis_flaveola_F"},audio_ebird_code:"saffin",mapa:"Maps/Sicalis_flaveola_map.png",thumb_sprite:"",exotica:false,amba:43.47},
