{id:94,num:"#089",n_lista:426,nombre_comun:"Caracolero",nombre_cientifico:"Rostrhamus sociabilis",familia:"Accipitridae",orden:"Accipitriformes",descripcion:{macho:"Rapaz mediana de alas largas, anchas y redondeadas, especialista en comer caracoles. El macho es todo gris pizarra oscuro, casi negruzco, con las plumas de vuelo más oscuras. Pico negro, fino y con la punta muy ganchuda; la piel desnuda de la base del pico (cera) es roja. Ojo rojo. Base de la cola, rabadilla y la zona debajo de la cola blancas, que contrastan con el resto de la cola oscura de punta clara. Patas rojas.",hembra:"La hembra es parda oscura por arriba y blancuzca por abajo, con muchas estrías pardas en el pecho y el vientre. La cara es blancuzca, con manchas oscuras sobre y detrás del ojo. Ojo anaranjado. La cera y las patas son amarillas o anaranjadas. Tiene el mismo blanco en la base de la cola. Los jóvenes se parecen a la hembra, con la corona estriada y los ojos pardos."},habitat:["humedal","ribereño"],residencia:"estival",tamanio:"mediano",largo_cm:"36-48",envergadura_cm:"99-120",estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","Tucumán","Salta","Jujuy","La Pampa","Catamarca","San Luis"],curiosidades:"Come casi solo caracoles de agua dulce del género Pomacea (los 'caracoles manzana'), y su pico finito y muy ganchudo está hecho para eso: sostiene el caracol con una pata y, sin romper la concha, le mete la punta del pico por la abertura para sacarlo. Vuela lento y bajo sobre los bañados con la cabeza apuntando hacia abajo, buscando caracoles cerca de la superficie, y después se los come en su rama favorita: a orillas del Paraná se encuentran montoncitos de conchas vacías y opérculos debajo de esas perchas. Es muy sociable, como dice su nombre científico: forma grandes bandadas y duerme en grupo. En Florida (EE.UU.) su población está en peligro porque el manejo del agua en los Everglades redujo los caracoles.",sprites:{macho:"Rostrhamus_sociabilis_M"},audio_ebird_code:"snakit",mapa:"Maps/Rostrhamus_sociabilis_map.png",thumb_sprite:"",exotica:false,amba:6.38},
{id:98,num:"#090",n_lista:431,nombre_comun:"Gavilán Planeador",nombre_cientifico:"Circus buffoni",familia:"Accipitridae",orden:"Accipitriformes",descripcion:{macho:"Rapaz mediana, esbelta, de alas muy largas y cola larga y angosta. Capucha gris pizarra oscura que cubre la corona, la nuca y la zona detrás del ojo; ceja blanca, blanco alrededor de la base del pico y una medialuna blanca debajo del ojo, como el disco facial de las lechuzas. Garganta salpicada de blanco. Pico negro y ganchudo, con la base (cera) amarilla. Ojo pardo rojizo. Dorso negro; alas grises plateadas con las plumas de vuelo barradas de negro y la punta negra. Rabadilla blanca. Cola larga gris, con varias barras oscuras y la punta blanca. Pecho con un babero negro; resto de abajo blanco con algunas manchas oscuras, sobre todo en los costados. Patas largas y finas, anaranjadas.",hembra:"La hembra es algo más grande y más parda: dorso pardo oscuro, garganta salpicada de leonado y pecho y vientre blancuzcos con estrías pardas o canela. Mismo dibujo de alas y cola. Muslos leonados.",oscuro:"Forma oscura, igual en los dos sexos: todo negro hollín, con las mismas marcas blancas de la cara (ceja, base del pico y medialuna debajo del ojo), que resaltan mucho. Rabadilla blanca; plumas de vuelo grises barradas de negro y cola igual a la del morfo claro. El inmaduro oscuro tiene estrías blancas abajo y los muslos y la zona debajo de la cola castaño rojizos."},habitat:["pastizal","humedal","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:"46-60",envergadura_cm:"119-155",estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","Jujuy","San Luis","Mendoza","La Pampa","Río Negro"],curiosidades:"Es la única rapaz de día que, como las lechuzas, tiene un disco de plumas alrededor de la cara: le sirve para ubicar por el oído a sus presas escondidas entre el pasto. Caza volando bajo y lento sobre pastizales, bañados y campos, con las alas levantadas en forma de 'V' y balanceándose con el viento, de ahí su nombre de 'planeador'. Come roedores, pajaritos, ranas, reptiles e insectos grandes. Es poco ruidoso: en vuelo da un 'kli-kli-kli' rápido. Arma el nido en el suelo, escondido entre juncos o pastos altos de los bañados.",sprites:{macho:"Circus_buffoni_M",hembra:"Circus_buffoni_F"},audio_ebird_code:"lowhar1",mapa:"Maps/Circus_buffoni_map.png",thumb_sprite:"",exotica:false,amba:3.12},
{id:34,num:"#091",n_lista:442,nombre_comun:"Taguató",nombre_cientifico:"Rupornis magnirostris",familia:"Accipitridae",orden:"Accipitriformes",descripcion:{adulto:"Gavilán mediano y compacto. Los ejemplares del centro y sur de Argentina corresponden a la forma oscura: cabeza y nuca pardo-chocolate intenso. Iris amarillo pálido a marfil con fino anillo orbital amarillo. Pico corvo y robusto con cera naranja-amarillenta; punta gris oscuro. Dorso y alas pardo-chocolate cálido con bordes rufo-canela en las coberteras. Babero rufo-canela vivo en garganta y pecho superior, contrastando con el vientre. Vientre y flancos con barras finas alternas de pardo-rufo y blanco-crema. Cola rufa con 4-5 bandas negras anchas y punta clara. Patas naranja-amarillas robustas. La hembra es algo mayor que el macho."},habitat:["urbano","monte","pastizal","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:34,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","Tucumán","Salta","Jujuy","La Pampa"],curiosidades:"Es el gavilán más común y visible de la región. Su canto agudo y característico se escucha en todo tipo de ambientes, incluso en los suburbios de las ciudades. Se alimenta de lagartos, insectos y pequeños vertebrados. Es muy territorial y defiende su espacio con vuelos circulares y llamados frecuentes.",sprites:{adulto:"Rupornis_magnirostris_D",juvenil:"Rupornis_magnirostris_J"},audio_ebird_code:"roahaw",mapa:"Maps/Rupornis_magnirostris_map.png",thumb_sprite:"",exotica:false,amba:27.23},
{id:35,num:"#092",n_lista:443,nombre_comun:"Gavilán Mixto",nombre_cientifico:"Parabuteo unicinctus",familia:"Accipitridae",orden:"Accipitriformes",descripcion:{adulto:"Rapaz grande y robusta. Plumaje principalmente negro oscuro. Hombros y muslos de un castaño-rojizo intenso y llamativo. Base y punta de la cola blancas, con el resto negro. En vuelo se aprecia claramente esta combinación de negro, castaño y blanco. Pico gris con cera amarilla. Patas amarillas fuertes. La hembra es notablemente más grande que el macho.",juvenil:"Juvenil muy diferente al adulto. Partes superiores pardo oscuro. Partes inferiores crema-ocre con estrías pardas longitudinales densas en pecho y vientre. Hombros y flancos con manchas leonado-ocre pálido en lugar del rufo del adulto. Cola con múltiples barras oscuras. Cera y patas amarillas."},habitat:["pastizal","monte","agrícola"],residencia:"permanente",tamanio:"grande",largo_cm:56,envergadura_cm:113,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy"],curiosidades:"Puede cazar en grupos cooperativos de dos a seis individuos, coordinando el ataque para capturar presas más grandes que las que podría abatir un solo individuo. Es una de las pocas rapaces que puede exhibir este comportamiento de forma regular.",sprites:{adulto:"Parabuteo_unicinctus_D",juvenil:"Parabuteo_unicinctus_J",vuelo:"Parabuteo_unicinctus_V"},audio_ebird_code:"hrshaw",mapa:"Maps/Parabuteo_unicinctus_map.png",thumb_sprite:"",exotica:false,amba:52.74},
{id:195,num:"#093",n_lista:445,nombre_comun:"Aguilucho Alas Largas",nombre_cientifico:"Geranoaetus albicaudatus",familia:"Accipitridae",orden:"Accipitriformes",descripcion:{adulto:"Aguilucho grande, de alas muy largas. Cabeza negra. Pico gris con la punta negra y la cera amarilla. Ojo pardo. Dorso gris o negruzco, con las cubiertas de las alas canelas. Alas largas, negras. Rabadilla blanca barrada de ocráceo. Cola blanca con barras finas oscuras, una banda ancha negra cerca de la punta y la punta blanca. Partes inferiores blancas, con el vientre barrado. Patas amarillas. En vuelo, por debajo, las cubiertas de las alas son blancas con barras finas, las plumas largas grisáceas barradas y las puntas negras. La hembra es más grande que el macho.",juvenil:"El inmaduro es pardo oscuro por arriba y muy manchado de pardo por abajo."},habitat:["pastizal","agrícola","monte"],residencia:"estival",tamanio:"grande",largo_cm:"51-60",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","Misiones","Salta","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Planea alto sobre campos abiertos, a veces quieto en el aire contra el viento, buscando presas. Posado, las puntas de las alas pasan el final de la cola. Se lo ve en postes telefónicos y ramas, y acude a los incendios de pastizal para cazar los animales que escapan del fuego.",sprites:{adulto:"Geranoaetus_albicaudatus_D"},audio_ebird_code:"whthaw",mapa:"Maps/Geranoaetus_albicaudatus_map.png",thumb_sprite:"",exotica:false,amba:0.52},
{id:192,num:"#094",n_lista:447,nombre_comun:"Águila Mora",nombre_cientifico:"Geranoaetus melanoleucus",familia:"Accipitridae",orden:"Accipitriformes",descripcion:{adulto:"Águila grande, de alas largas y anchas y cola corta. Cabeza y partes de arriba gris plomizo. Pico gris con la cera amarilla. Ojo amarillo. Cubiertas de las alas grises barradas de oscuro; plumas largas negras. Cola pardo oscura con una banda fina blanca en la punta. Garganta blanquecina, un escudo gris en el pecho y el resto de abajo blanco crema. Patas amarillas. En vuelo, por debajo, las alas son blanquecinas barradas de oscuro con las puntas negras. La hembra es más grande que el macho.",juvenil:"El inmaduro es estriado de pardo negruzco y canela, sin el escudo del pecho, y con la cola finamente barrada."},habitat:["pastizal","monte","agrícola"],residencia:"permanente",tamanio:"grande",largo_cm:"60-80",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"],curiosidades:"En vuelo se la reconoce por la silueta: alas muy anchas y cola corta en forma de cuña. Planea mucho aprovechando el viento, a veces en círculos, y se posa en postes de luz o en la copa de los árboles. Caza sobre todo mamíferos como cuises y liebres, y también aves y reptiles.",sprites:{adulto:"Geranoaetus_melanoleucus_D"},audio_ebird_code:"bcbeag1",mapa:"Maps/Geranoaetus_melanoleucus_map.png",thumb_sprite:"",exotica:false,amba:0.11},
{id:171,num:"#095",n_lista:453,nombre_comun:"Aguilucho Langostero",nombre_cientifico:"Buteo swainsoni",familia:"Accipitridae",orden:"Accipitriformes",descripcion:{adulto:"Aguilucho mediano de alas largas y anchas, cuyas puntas llegan al final de la cola. Cabeza pardo oscura con la frente blanca. Pico gris oscuro con la cera amarilla. Ojo pardo oscuro. Dorso y alas pardo oscuros. Cola gris clara con muchas barras oscuras finas y la punta blanquecina. Garganta blanca. Pecho pardo, jaspeado de manchas pardo rojizas sobre blanco, que forma un babero. Vientre blanco. Patas amarillas. En vuelo, por debajo, las cubiertas de las alas son blancas y contrastan con las plumas largas grises, de puntas oscuras. Hay un morfo oscuro, todo pardo negruzco, con la frente y la garganta blancas.",juvenil:"El juvenil no tiene el babero. Cabeza estriada de pardo y blanquecino. Dorso pardo con los bordes de las plumas claros. Abajo blanquecino a ocráceo, con manchas pardas en forma de gota o corazón en el pecho y los costados."},habitat:["pastizal","agrícola"],residencia:"estival",tamanio:"mediano",largo_cm:"48-56",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Corrientes","Córdoba","Entre Ríos","Jujuy","La Pampa","Salta","Santa Fe","Santiago del Estero"],curiosidades:"Cría en América del Norte y cada año viaja más de 10.000 km para pasar el verano en la llanura pampeana, en bandadas que pueden sumar miles. Come sobre todo langostas y otros insectos grandes, que caza en el suelo o en el aire, y sigue a los tractores en los campos. En los años 90 murieron miles envenenados por insecticidas en el campo argentino, lo que llevó a prohibir esos productos.",sprites:{adulto:"Buteo_swainsoni_D"},audio_ebird_code:"swahaw",mapa:"Maps/Buteo_swainsoni_map.png",thumb_sprite:"",exotica:false,amba:0.71},
{id:172,num:"#096",n_lista:456,nombre_comun:"Lechuza de Campanario",nombre_cientifico:"Tyto furcata",familia:"Tytonidae",orden:"Strigiformes",descripcion:{adulto:"Lechuza mediana, de cabeza redonda sin orejas de plumas y cara blanca en forma de corazón, con un borde oscuro abajo, tono ocre arriba y castaño alrededor de los ojos. Pico claro. Ojos pardo oscuros. Dorso gris ocráceo moteado de blanco. Alas y cola ocre intenso con bandas y salpicaduras pardo oscuras. Garganta blanca; abajo ocrácea blanquecina con motas pardas. Patas largas, emplumadas. Hay una forma más rojiza."},habitat:["urbano","agrícola","pastizal"],residencia:"permanente",tamanio:"mediano",largo_cm:"45",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"],curiosidades:"Es totalmente nocturna y caza ratones guiándose casi solo por el oído: su cara en forma de disco funciona como una antena que dirige el sonido. Una pareja puede comer miles de roedores por año, por eso es una gran aliada del campo. De día descansa quieta en galpones, campanarios, altillos o árboles tupidos; si se la molesta se balancea de lado a lado y resopla.",sprites:{adulto:"Tyto_furcata_D"},audio_ebird_code:null,mapa:"Maps/Tyto_furcata_map.png",thumb_sprite:"",exotica:false,amba:0.54},
{id:140,num:"#097",n_lista:457,nombre_comun:"Alilicucú Común",nombre_cientifico:"Megascops choliba",familia:"Strigidae",orden:"Strigiformes",descripcion:{adulto:"Lechucita chica, con orejas cortas de plumas. Cara gris bordeada de oscuro. Pico gris verdoso. Ojo amarillo. Dorso pardo con rayas oscuras y puntitos blancos y ocres, y una línea blanca a cada lado del dorso. Alas y cola ocráceas con bandas pardas y blanquecinas. Garganta y parte alta del pecho grises con barritas oscuras; resto de abajo blanquecino con rayas gruesas verticales y finas transversales pardo oscuras. Patas gris parduscas. Hay una forma rojiza, de color general castaño con las mismas rayas."},habitat:["monte","bosque","urbano","arbolado"],residencia:"permanente",tamanio:"chico",largo_cm:"20-24",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Su nombre imita su canto, un trino que termina en dos notas cortas y que se oye de noche, incluso en plazas y parques de la ciudad. De día descansa quieto en un árbol, pegado al tronco y con el cuerpo estirado, y con su plumaje rayado se confunde con la corteza. Caza insectos grandes, ratones y pajaritos. Anida en huecos de árboles.",sprites:{adulto:"Megascops_choliba_D"},audio_ebird_code:"trsowl",mapa:"Maps/Megascops_choliba_map.png",thumb_sprite:"",exotica:false,amba:1.73},
{id:198,num:"#098",n_lista:463,nombre_comun:"Ñacurutú",nombre_cientifico:"Bubo virginianus",familia:"Strigidae",orden:"Strigiformes",descripcion:{adulto:"Búho grande, con dos penachos de plumas largas en la cabeza como orejas. Cara ocre blanquecina con una banda oscura a los costados. Pico gris. Ojo amarillo. Corona, nuca y parte alta del dorso ocres manchados de pardo oscuro; resto del dorso y cubiertas de las alas pardo y ocre, vermiculado de blanquecino. Alas y cola ocre oscuro con bandas pardas. Parte baja de la garganta blanca; resto de abajo blanquecino ondulado de pardo oscuro. Patas emplumadas. La hembra es más grande que el macho."},habitat:["monte","bosque","arbolado","pastizal"],residencia:"permanente",tamanio:"grande",largo_cm:"51-60",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Río Negro","Salta","Santa Fe"],curiosidades:"Es el búho más grande de la Argentina. De día descansa en la parte media o alta de árboles densos, quieto y camuflado, y de noche caza mamíferos como cuises, liebres y ratas, además de aves. Su canto es un ulular grave que se oye desde lejos.",sprites:{adulto:"Bubo_virginianus_D"},audio_ebird_code:"grhowl",mapa:"Maps/Bubo_virginianus_map.png",thumb_sprite:"",exotica:false,amba:1.47},
{id:203,num:"#099",n_lista:471,nombre_comun:"Caburé Chico",nombre_cientifico:"Glaucidium brasilianum",familia:"Strigidae",orden:"Strigiformes",descripcion:{adulto:"Lechucita muy chica, de cabeza redonda sin orejas de plumas. Cabeza parda con estrías ocráceas y una ceja fina blanquecina. Pico verde amarillento. Ojo amarillo. En la nuca, manchitas blancas y negras que parecen dos ojos falsos. Dorso pardo oscuro. Alas pardas con motas blanco ocráceas. Cola pardo oscura con cinco o seis barras angostas blancas. Abajo blanco jaspeado de pardo oscuro. Dedos verde amarillentos. La hembra es algo más grande que el macho.",oscuro:"Hay una forma rojiza o herrumbrosa, de color general rojizo, con las estrías de la cabeza más largas y la cola barrada de pardo oscuro y rojizo."},habitat:["monte","bosque","arbolado","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"17-18,5",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","Mendoza","Misiones","Río Negro","Salta","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Es activo de día y de noche. Las dos manchas negras de la nuca parecen ojos y confunden a quien lo mira por detrás. Aunque es chico, caza pájaros de su tamaño, insectos y lagartijas. Cuando los pájaros lo descubren se juntan a su alrededor para acosarlo con gritos.",sprites:{adulto:"Glaucidium_brasilianum_D"},audio_ebird_code:"fepowl",mapa:"Maps/Glaucidium_brasilianum_map.png",thumb_sprite:"",exotica:false,amba:3.24},
{id:36,num:"#100",n_lista:473,nombre_comun:"Lechucita Vizcachera",nombre_cientifico:"Athene cunicularia",familia:"Strigidae",orden:"Strigiformes",descripcion:{adulto:"Lechuza chica y terrícola. Cara redonda sin discos faciales marcados. Partes superiores pardo con manchas y barras blancas. Partes inferiores blancuzcas con barras pardas en el pecho. Ceja blanca. Ojos amarillos grandes y expresivos orientados hacia adelante. Patas largas para un estrigido, pardas con algo de plumaje en la base. Pico gris amarillento. Frecuentemente vista de día parada en el suelo o en postes."},habitat:["pastizal","agrícola","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:23,envergadura_cm:54,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"Nidifica en cuevas en el suelo, generalmente en vizcacheras abandonadas o túneles que excava ella misma. Es de actividad diurna y crepuscular, a diferencia de la mayoría de las lechuzas. Cuando se siente amenazada hace una reverencia repetida muy característica.",sprites:{adulto:"Athene_cunicularia_D"},audio_ebird_code:"burowl",mapa:"Maps/Athene_cunicularia_map.png",thumb_sprite:"",exotica:false,amba:3.9},
{id:156,num:"#101",n_lista:475,nombre_comun:"Lechuzón Orejudo",nombre_cientifico:"Asio clamator",familia:"Strigidae",orden:"Strigiformes",descripcion:{adulto:"Lechuzón mediano, con orejas largas de plumas negras. Cara blanquecina con las mejillas castañas, oscura alrededor de los ojos y bordeada por una línea oscura. Pico gris. Ojo pardo. Corona, nuca y dorso ocres con listas gruesas pardo oscuras. Alas y cola ocres con bandas pardo oscuras. Pecho blanquecino y ocráceo con listones pardo oscuros. Macho y hembra son iguales."},habitat:["pastizal","monte","urbano","arbolado"],residencia:"permanente",tamanio:"mediano",largo_cm:"30-38",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","Mendoza","Misiones","Neuquén","Río Negro","Salta","Santa Fe","Tucumán"],curiosidades:"Sus largas orejas de plumas no son orejas: son penachos que levanta cuando está alerta y que lo ayudan a camuflarse. Es nocturno y de día descansa en árboles densos, a veces en parques de la ciudad. Caza roedores, aves e insectos grandes, y su llamado es un ladrido o un silbido fuerte.",sprites:{adulto:"Asio_clamator_D"},audio_ebird_code:"strowl1",mapa:"Maps/Asio_clamator_map.png",thumb_sprite:"",exotica:false,amba:2.08},
{id:37,num:"#102",n_lista:477,nombre_comun:"Lechuzón de Campo",nombre_cientifico:"Asio flammeus",familia:"Strigidae",orden:"Strigiformes",descripcion:{adulto:"Lechuza mediana de aspecto estriado. Cabeza redondeada sin orejas visibles. Disco facial blancuzco bordeado de oscuro. Ojo amarillo-anaranjado intenso rodeado por un llamativo anillo negro. Dorso, alas y pecho pardo-amarillento con estrías oscuras densas. Vientre más claro con estrías más finas. Alas largas y angostas con parche negro en la muñeca. Cola parda barrada."},habitat:["pastizal","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:38,envergadura_cm:100,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","La Pampa","Córdoba","Mendoza","San Luis","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Cazador diurno y crepuscular, inusual entre las lechuzas. Vuela bajo sobre los pastizales con aleteos irregulares buscando ratones y otros roedores pequeños. Sus oídos están ubicados asimétricamente para localizar presas con gran precisión. Puede ser visto en bandadas durante migraciones.",sprites:{adulto:"Asio_flammeus_D"},audio_ebird_code:"sheowl",mapa:"Maps/Asio_flammeus_map.png",thumb_sprite:"",exotica:false,amba:0.14},
{id:38,num:"#103",n_lista:483,nombre_comun:"Martín Pescador Grande",nombre_cientifico:"Megaceryle torquata",familia:"Alcedinidae",orden:"Coraciiformes",descripcion:{macho:"Ave grande y robusta con cresta erizada azul-grisácea muy llamativa. Partes superiores azul-gris con manchas blancas dispersas. Collar blanco en la garganta. Pecho y vientre castaño-rufo intenso sin interrupción. Pico largo, robusto y oscuro con base amarillenta. Ojo pardo.",hembra:"Similar al macho pero con una banda pectoral azul-grisácea que separa la garganta blanca del vientre rufo."},habitat:["ribereño","humedal","costa"],residencia:"permanente",tamanio:"mediano",largo_cm:40,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut"],curiosidades:"Caza en picada desde una percha elevada sobre el agua, sumergiéndose completamente para atrapar peces. Su vuelo es rápido y directo, con aleteos rápidos alternados con planeos breves. Es el martín pescador más grande de Argentina.",sprites:{macho:"Megaceryle_torquata_M",hembra:"Megaceryle_torquata_F"},audio_ebird_code:"rinkin1",mapa:"Maps/Megaceryle_torquata_map.png",thumb_sprite:"",exotica:false,amba:4.01},
{id:39,num:"#104",n_lista:484,nombre_comun:"Martín Pescador Mediano",nombre_cientifico:"Chloroceryle amazona",familia:"Alcedinidae",orden:"Coraciiformes",descripcion:{macho:"Martín pescador mediano y robusto. Cabeza verde bronceado oscuro con cresta desgreñada característica. Pequeña mancha blanca bajo el ojo. Collar blanco estrecho en el cuello separado de la garganta blanca por una fina línea verde. Dorso y alas verde bronceado oscuro. Pecho rufo intenso. Flancos blancos con estrías verdes. Vientre blanco. Pico largo, recto y negro con marfil-amarillo pálido bajo la mandíbula inferior. Ojo pardo oscuro. Patas cortas gris oscuro.",hembra:"Similar al macho pero con pecho blanco y flancos verde-botella que casi se unen en el centro del pecho, sin rufo pectoral. Vientre blanco."},habitat:["ribereño","humedal","costa"],residencia:"permanente",tamanio:"mediano",largo_cm:28,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Córdoba","Tucumán","Salta","Jujuy"],curiosidades:"Se posa en ramas bajas sobre el agua y se lanza en picada para atrapar peces. Es más frecuente en ríos y arroyos de mediana anchura que su pariente mayor. Suele volar rasante sobre el agua llamando con un chasquido fuerte y seco.",sprites:{macho:"Chloroceryle_amazona_M",hembra:"Chloroceryle_amazona_F"},audio_ebird_code:"amakin1",mapa:"Maps/Chloroceryle_amazona_map.png",thumb_sprite:"",exotica:false,amba:1.07},
{id:102,num:"#105",n_lista:486,nombre_comun:"Martín Pescador Chico",nombre_cientifico:"Chloroceryle americana",familia:"Alcedinidae",orden:"Coraciiformes",descripcion:{macho:"El más chico de los tres martines pescadores comunes en Buenos Aires. Cabeza grande, sin copete marcado, verde bronceada. Pico largo, recto y puntiagudo, negro con la base de la parte de abajo amarillenta pálida. Ojo pardo. Dorso verde bronceado. Alas verdes con varias hileras de puntos blancos. Cola verde con manchas blancas en las plumas de los costados. Garganta y collar blancos. Pecho castaño rojizo. Vientre blanco, con manchas verdes en los costados. Patas cortas, grises.",hembra:"La hembra no tiene el pecho castaño: tiene la garganta y el pecho blanquecinos o apenas anteados, cruzados por dos bandas verdes, como un doble collar. El resto es igual al macho."},habitat:["ribereño","humedal"],residencia:"permanente",tamanio:"chico",largo_cm:"19-22",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","Tucumán","Salta","Jujuy","Catamarca","San Juan"],curiosidades:"Se posa en ramas bajas, postes o alambres junto al agua y desde ahí se tira de cabeza para atrapar pececitos; mientras espera, mueve la cabeza y la cola de forma acompasada. Vuela rápido y bajo, al ras del agua. Macho y hembra cavan juntos un túnel de hasta un metro en la barranca de un arroyo o río, con una cámara al fondo donde la hembra pone de 4 a 5 huevos blancos, sin ningún material de nido. Los pichones dejan el túnel unas cuatro semanas después de nacer, y al poco tiempo los padres los echan del territorio.",sprites:{macho:"Chloroceryle_americana_M",hembra:"Chloroceryle_americana_F"},audio_ebird_code:"grnkin",mapa:"Maps/Chloroceryle_americana_map.png",thumb_sprite:"",exotica:false,amba:5.54},
{id:175,num:"#106",n_lista:496,nombre_comun:"Carpinterito Barrado",nombre_cientifico:"Picumnus cirratus",familia:"Picidae",orden:"Piciformes",descripcion:{macho:"Carpintero diminuto, de cola corta. El macho tiene la parte de arriba de la cabeza negra con puntitos blancos, y la frente y la corona con puntitos rojos. Pico negro, más claro en la base. Ojo pardo. Dorso pardo grisáceo. Alas pardo grisáceas con bordes blanquecinos. Cola negra con franjas blancas. Garganta, cuello, pecho y vientre barrados de blanco grisáceo y negro. Patas grises.",hembra:"La hembra no tiene rojo en la cabeza y su dorso es pardo ocráceo."},habitat:["monte","bosque","ribereño"],residencia:"permanente",tamanio:"chico",largo_cm:"9",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Rioja","Misiones","Salta","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Es el carpintero más chico de la región, apenas más grande que un picaflor. No usa la cola de apoyo como otros carpinteros: se mueve por ramitas finas y tallos, golpeteándolos para abrirlos. Picotea los tallos secos y huecos de la chilca para sacar las hormigas y sus huevos de adentro. Por su golpeteo rítmico le dicen telegrafista.",sprites:{macho:"Picumnus_cirratus_M"},audio_ebird_code:"whbpic1",mapa:"Maps/Picumnus_cirratus_map.png",thumb_sprite:"",exotica:false,amba:2.22},
{id:190,num:"#107",n_lista:499,nombre_comun:"Carpintero Blanco",nombre_cientifico:"Melanerpes candidus",familia:"Picidae",orden:"Piciformes",descripcion:{macho:"Carpintero mediano, blanco y negro. El macho tiene la cabeza, la garganta, los costados y el frente del cuello y las partes inferiores blancos, con una línea negra que sale del ojo y baja por el cuello hasta el dorso. Pico negro, más claro en la base. Ojo blanco. Nuca, parte de atrás del cuello y vientre amarillos. Dorso y alas negros. Rabadilla y base de la cola blancas; resto de la cola negro. Patas gris verdosas o parduscas.",hembra:"La hembra no tiene el amarillo de la nuca."},habitat:["monte","arbolado","agrícola","urbano"],residencia:"permanente",tamanio:"mediano",largo_cm:"25",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Misiones","Salta","San Luis","Santa Fe","Santiago del Estero"],curiosidades:"A diferencia de casi todos los carpinteros, anda en grupos ruidosos de 4 o 5 o más, que vuelan en fila de árbol en árbol. Además de insectos come mucha fruta, y es conocido por atacar colmenas para comer la miel y las larvas de abejas.",sprites:{macho:"Melanerpes_candidus_M"},audio_ebird_code:"whiwoo1",mapa:"Maps/Melanerpes_candidus_map.png",thumb_sprite:"",exotica:false,amba:0.9},
{id:95,num:"#108",n_lista:504,nombre_comun:"Carpintero Bataraz Chico",nombre_cientifico:"Veniliornis mixtus",familia:"Picidae",orden:"Piciformes",descripcion:{macho:"Carpintero chiquito, del tamaño de un gorrión grande. Frente y corona pardo negruzcas, con algunas rayitas blancas en el macho, y la nuca roja. Cara blanca, con una franja parda oscura que sale desde atrás del ojo y un bigote fino pardo oscuro. Pico negro. Ojo pardo. Dorso y alas pardo negruzcos con muchas barras blancas; las plumas de vuelo pardas barradas de blanco. Cola pardo negruzca con barritas blancas finas. Garganta, pecho y vientre blancos con un tinte amarillento o acanelado, con estrías pardas oscuras en el pecho y el vientre y barras pardas en los costados. Patas grises. En el sudoeste de la provincia de Buenos Aires es más oscuro y más estriado abajo.",hembra:"La hembra es igual al macho pero con la nuca negra en lugar de roja y la corona toda negra, sin rayitas blancas. Los juveniles son más apagados y oscuros, con más estrías y barras abajo, y los dos sexos tienen algo de rojo en la corona."},habitat:["monte","bosque","ribereño","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"14-15",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Chaco","Formosa","Santiago del Estero","Córdoba","Salta","Jujuy","Tucumán","Catamarca","La Rioja","San Juan","San Luis","Mendoza","La Pampa","Neuquén","Río Negro"],curiosidades:"Es uno de los carpinteros más chicos de la Argentina y fue descripto por primera vez a partir de un ejemplar de Buenos Aires, en 1780, por el naturalista francés Buffon. Busca insectos solo o en pareja, sobre todo en ramitas finas de árboles y arbustos, apoyando la cola dura contra la corteza mientras recorre el tronco; también come semillas. Marca su territorio con un trino agudo 'ti-ti-ti-ti' y con golpeteos en troncos huecos. Macho y hembra excavan juntos el nido en un tronco seco o en una palmera muerta, a 3 a 6 metros del suelo, y crían entre septiembre y noviembre. Su nombre 'mixtus' quiere decir 'mezclado', por el dibujo bataraz blanco y negro.",sprites:{macho:"Veniliornis_mixtus_M",hembra:"Veniliornis_mixtus_F"},audio_ebird_code:"chewoo3",mapa:"Maps/Veniliornis_mixtus_map.png",thumb_sprite:"",exotica:false,amba:25.3},
{id:40,num:"#109",n_lista:520,nombre_comun:"Carpintero Real",nombre_cientifico:"Colaptes melanochloros",familia:"Picidae",orden:"Piciformes",descripcion:{macho:"Carpintero mediano de colores vivos. Frente negra; corona y nuca rojas. Cara blanca con bigote (malar) rojo llamativo. Dorso y alas verde-amarillentos densamente barrados de negro. Rabadilla amarilla. Pecho amarillento con grandes lunares negros redondeados. Vientre y flancos blancos barrados de negro. Cola negra rígida. Pico largo, en cincel, negro. Patas grises.",hembra:"Igual al macho pero con bigote (malar) negro-grisáceo oscuro en lugar de rojo. El resto del plumaje idéntico."},habitat:["monte","arbolado","urbano"],residencia:"permanente",tamanio:"mediano",largo_cm:23,envergadura_cm:38,estado:"LC",provincias:["CABA","Buenos Aires","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Córdoba","Salta","Jujuy","Tucumán","Santiago del Estero"],curiosidades:"A diferencia de la mayoría de los carpinteros, forrajea con frecuencia en el suelo buscando hormigas entre la hojarasca. Utiliza su rígida cola como soporte al escalar troncos. Los machos pueden tardar semanas en excavar la cavidad de nidificación.",sprites:{macho:"Colaptes_melanochloros_M",hembra:"Colaptes_melanochloros_F"},audio_ebird_code:"grbwoo3",mapa:"Maps/Colaptes_melanochloros_map.png",thumb_sprite:"",exotica:false,amba:41.22},
{id:83,num:"#110",n_lista:523,nombre_comun:"Carpintero Campestre",nombre_cientifico:"Colaptes campestris",familia:"Picidae",orden:"Piciformes",descripcion:{macho:"Carpintero mediano que anda mucho por el suelo. Corona y nuca negras. Cara, costados del cuello y parte alta del pecho amarillo intenso. Bigote rojo. Garganta blanca (la forma de Buenos Aires; más al norte es negra). Pico largo, negro y algo curvo. Ojo pardo rojizo. Dorso pardo oscuro barrado de blanquecino; rabadilla blanca con algunas barritas oscuras. Plumas del ala pardas con los ejes amarillos. Cola negruzca. Pecho y vientre blanquecinos barrados de pardo oscuro. Patas grises. Por debajo, las alas son amarillentas, con la punta y el borde de atrás más oscuros.",hembra:"Igual al macho pero sin rojo en el bigote: la banda malar es punteada de blanco y negro. El resto del plumaje es igual."},habitat:["pastizal","agrícola","urbano","monte"],residencia:"permanente",tamanio:"mediano",largo_cm:"28-32",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","Neuquén","Río Negro","Salta"],curiosidades:"A diferencia de la mayoría de los carpinteros, busca casi toda su comida en el suelo: picotea y escarba hormigueros, termiteros, tierra y troncos caídos, y puede romper termiteros grandes. Hormigas y termitas son la base de su dieta. Anda en parejas o grupos chicos y se lo ve seguido posado en postes y alambrados. Macho y hembra excavan juntos el nido en un termitero, una barranca, un árbol o un poste; ponen 4 o 5 huevos, y en la Argentina crían sobre todo en agosto y septiembre. A veces varias hembras de un grupo ponen en el mismo nido.",sprites:{macho:"Colaptes_campestris_M",hembra:"Colaptes_campestris_F"},audio_ebird_code:"camfli1",mapa:"Maps/Colaptes_campestris_map.png",thumb_sprite:"",exotica:false,amba:7.44},
{id:41,num:"#111",n_lista:530,nombre_comun:"Carancho",nombre_cientifico:"Caracara plancus",familia:"Falconidae",orden:"Falconiformes",descripcion:{adulto:"Ave grande y robusta. Corona negra con cresta achatada característica. Cara y cera rosada a anaranjada muy llamativa. Nuca y garganta color crema. Pecho y manto finamente barrado en negro y blanco. Alas y vientre pardo oscuro. Cola blanca con banda terminal negra. Patas amarillas. Pico gris-azulado con cera rosada-anaranjada.",juvenil:"Corona marrón. Pecho y manto superior estriados de color ante sobre marrón. Alas y vientre de un marrón más pálido que el adulto."},habitat:["pastizal","agrícola","urbano","ribereño","monte"],residencia:"permanente",tamanio:"grande",largo_cm:60,envergadura_cm:120,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Aunque se alimenta principalmente de carroña, también es capaz de atacar y matar presas de buen tamaño. Es común verlo caminando por el suelo en rutas y campos. Suele robar presas a otras aves rapaces.",sprites:{adulto:"Caracara_plancus_D",juvenil:"Caracara_plancus_J",vuelo:"Caracara_plancus_V"},audio_ebird_code:"y00678",mapa:"Maps/Caracara_plancus_map.png",thumb_sprite:"",exotica:false,amba:66.18},
{id:42,num:"#112",n_lista:535,nombre_comun:"Chimango",nombre_cientifico:"Daptrius chimango",familia:"Falconidae",orden:"Falconiformes",descripcion:{adulto:"Rapaz chica y esbelta. Plumaje pardo con variaciones. Partes superiores pardo oscuro con estrías oscuras. Partes inferiores con moteado y barrado rufo-pardo. Cola barrada con banda subterminal oscura y punta blancuzca. Base de las primarias blancuzca visible en vuelo. Pico gris con cera amarilla. Patas amarillas. Juvenil más oscuro y rayado."},habitat:["pastizal","agrícola","urbano","ribereño"],residencia:"permanente",tamanio:"mediano",largo_cm:38,envergadura_cm:76,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"El carroñero más común de la pampa. Oportunista por excelencia: come carroña, insectos, frutos, huevos y cualquier resto disponible. Es frecuente verlo caminando por el suelo en campos y basurales. A diferencia del carancho, rara vez caza presas vivas.",sprites:{adulto:"Daptrius_chimango_D"},audio_ebird_code:"chicar1",mapa:"Maps/Daptrius_chimango_map.png",thumb_sprite:"",exotica:false,amba:56.72},
{id:43,num:"#113",n_lista:536,nombre_comun:"Halconcito Colorado",nombre_cientifico:"Falco sparverius",familia:"Falconidae",orden:"Falconiformes",descripcion:{macho:"El halcón más chico de la región. Macho muy colorido. Corona azul-grisácea con mancha central rufa. Cara blanca con dos bigoteras negras características. Dorso rufo con barras negras. Alas azul-grises. Cola rufa con banda subterminal negra y punta blanca. Pecho y vientre ante con manchas negras redondas. Pico gris con cera amarilla. Patas amarillas.",hembra:"Dorso rufo con barras negras al igual que el macho. Alas pardas barradas. Sin el azul-gris del macho. Partes inferiores ante con rayas pardas. Cola rufa barrada."},habitat:["pastizal","agrícola","urbano","monte"],residencia:"permanente",tamanio:"chico",largo_cm:27,envergadura_cm:55,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"Caza desde perchas elevadas o en vuelo cernido, detectando insectos y pequeños vertebrados. Es capaz de ver en el ultravioleta, lo que le permite seguir los rastros de orina de roedores. El macho y la hembra difieren notablemente en plumaje, siendo el macho mucho más colorido.",sprites:{macho:"Falco_sparverius_M",hembra:"Falco_sparverius_F"},audio_ebird_code:"amekes",mapa:"Maps/Falco_sparverius_map.png",thumb_sprite:"",exotica:false,amba:7.71},
{id:139,num:"#114",n_lista:539,nombre_comun:"Halcón Plomizo",nombre_cientifico:"Falco femoralis",familia:"Falconidae",orden:"Falconiformes",descripcion:{adulto:"Halcón mediano y esbelto, de alas largas y angostas y cola larga. Cabeza negra, con la frente y una ceja larga ocráceas que llegan hasta la nuca. Bigote negro marcado y una línea negra detrás del ojo. Mejillas, garganta y costados del cuello blancos. Pico gris con la cera amarilla. Ojo pardo. Dorso gris pizarra. Alas grises oscuras con barras blancas finas. Pecho ocre pálido con algunas estrías oscuras. En la parte baja del pecho y alta del vientre, un chaleco negro finamente barrado de blanco. Resto del vientre y muslos marrón rojizos. Cola gris oscura con barras blancas finas. Patas amarillas. La hembra es igual pero más grande. El inmaduro es pardo por arriba, con el pecho estriado y el chaleco pardo."},habitat:["pastizal","agrícola","humedal"],residencia:"permanente",tamanio:"mediano",largo_cm:"35-45",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"],curiosidades:"Es un cazador muy veloz de campos abiertos: persigue aves en vuelo, a veces en pareja, y también come insectos grandes y murciélagos. Suele posarse en postes, alambrados y árboles aislados. No construye nido: usa nidos viejos de otras aves, como los de caranchos o chimangos.",sprites:{adulto:"Falco_femoralis_D"},audio_ebird_code:"aplfal",mapa:"Maps/Falco_femoralis_map.png",thumb_sprite:"",exotica:false,amba:0.97},
{id:44,num:"#115",n_lista:544,nombre_comun:"Cotorra",nombre_cientifico:"Myiopsitta monachus",familia:"Psittacidae",orden:"Psittaciformes",descripcion:{adulto:"Ave mediana y compacta. Frente, cara, garganta y pecho gris claro. Corona, dorso, rabadilla y cola verdes. Alas verde opaco con primarias y secundarias azules llamativas. Cola larga y escalonada. Pico grueso y redondeado, blanquecino. Ojo pardo oscuro. Patas grisáceas. Sexos similares. Vientre amarillento."},habitat:["urbano","pastizal","agrícola","monte","bosque"],residencia:"permanente",tamanio:"chico",largo_cm:29,envergadura_cm:53,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"Es el único loro del mundo que construye nidos comunales de palitos, a veces enormes, que comparte con toda la colonia durante todo el año. Se ha naturalizado en numerosas ciudades de Europa y América del Norte gracias al comercio de mascotas.",sprites:{adulto:"Myiopsitta_monachus_D"},audio_ebird_code:"monpar",mapa:"Maps/Myiopsitta_monachus_map.png",thumb_sprite:"",exotica:false,amba:91.56},
{id:147,num:"#116",n_lista:545,nombre_comun:"Catita Chirirí",nombre_cientifico:"Brotogeris chiriri",familia:"Psittacidae",orden:"Psittaciformes",descripcion:{adulto:"Loro chico, todo verde, de cola larga y en punta. En el ala plegada se ve una franja amarilla, que en vuelo resalta mucho. Pico claro, rosado o color hueso. Ojo oscuro, con un anillo de piel blanquecina. Patas rosadas. Macho y hembra son iguales."},habitat:["urbano","arbolado","monte"],residencia:"permanente",tamanio:"chico",largo_cm:"22",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Formosa","Misiones","Santa Fe"],curiosidades:"Es nativa del noreste argentino, pero en Buenos Aires se estableció a partir de aves escapadas de cautiverio y hoy es común en parques y arboledas de la ciudad. Vuela en grupos muy ruidosos y come frutos, flores, néctar y semillas.",sprites:{adulto:"Brotogeris_chiriri_D"},audio_ebird_code:"yecpar",mapa:"Maps/Brotogeris_chiriri_map.png",thumb_sprite:"",exotica:false,amba:24.08},
{id:138,num:"#117",n_lista:558,nombre_comun:"Loro Barranquero",nombre_cientifico:"Cyanoliseus patagonus",familia:"Psittacidae",orden:"Psittaciformes",descripcion:{adulto:"Loro grande, de cola larga y en punta. Cabeza, mejillas y hombros pardo oliváceos. Pico pardo oliváceo, grueso y ganchudo. Ojo blanco amarillento, rodeado de piel desnuda blanquecina. Garganta y pecho pardo grisáceos, con algunas plumas blanquecinas a los costados del cuello. Parte baja del dorso, rabadilla y costados amarillo claro. Vientre rojo bordeado de amarillo. Alas verdes, con las plumas de vuelo azules. Cola verde oliva. Patas pardas. Macho y hembra son iguales."},habitat:["pastizal","monte","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:"40-52",envergadura_cm:"65-66.5",estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chubut","Córdoba","La Pampa","La Rioja","Mendoza","Neuquén","Río Negro","Salta","San Juan","San Luis","Tucumán"],curiosidades:"Es el loro más grande del país. Su nombre viene de que anida en barrancas: cava túneles profundos en paredones de tierra, a veces de más de un metro, donde se juntan colonias de cientos o miles de parejas. La mayor colonia conocida del mundo está en los acantilados de El Cóndor, cerca de Viedma. Anda en bandadas ruidosas que recorren grandes distancias para comer semillas y frutos.",sprites:{adulto:"Cyanoliseus_patagonus_D"},audio_ebird_code:"burpar",mapa:"Maps/Cyanoliseus_patagonus_map.png",thumb_sprite:"",exotica:false,amba:0.23},
{id:45,num:"#118",n_lista:561,nombre_comun:"Ñanday",nombre_cientifico:"Aratinga nenday",familia:"Psittacidae",orden:"Psittaciformes",descripcion:{adulto:"Cotorra mediana de colorido llamativo. Cabeza negra intensa. Cuello y pecho con lavado azul verdoso. Cuerpo y alas verde brillante. Cola larga con punta azulada. Pequeña mancha roja en la base de los muslos. Pico negro curvo y robusto. Ojo oscuro rodeado por un anillo ocular blanco. Sexos similares."},habitat:["urbano","pastizal","monte"],residencia:"permanente",tamanio:"mediano",largo_cm:32,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa"],curiosidades:"Forma bandadas ruidosas que vuelan a alta velocidad. Anida preferentemente en palmeras. Aunque es nativo del nordeste argentino, se ha asentado en Buenos Aires y CABA, donde se lo ve con frecuencia. Su llamado estridente y agudo es inconfundible.",sprites:{adulto:"Aratinga_nenday_D"},audio_ebird_code:"bkhpar",mapa:"Maps/Aratinga_nenday_map.png",thumb_sprite:"",exotica:false,amba:32.93},
{id:153,num:"#119",n_lista:568,nombre_comun:"Calancate Ala Roja",nombre_cientifico:"Psittacara leucophthalmus",familia:"Psittacidae",orden:"Psittaciformes",descripcion:{adulto:"Loro mediano, verde, de cola larga y en punta. Algunas plumas rojas sueltas en la cabeza y el cuello. Pico claro, color hueso. Ojo anaranjado, rodeado de piel desnuda blanquecina. En el ala plegada se ve rojo en el borde de adelante; por debajo, las cubiertas del ala son rojas y amarillas, muy visibles en vuelo. Patas grisáceas. Macho y hembra son iguales."},habitat:["urbano","arbolado","monte"],residencia:"estival",tamanio:"mediano",largo_cm:"32-35",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Entre Ríos","Formosa","Jujuy","Misiones","Salta","Santa Fe"],curiosidades:"Es nativo del norte y noreste del país, y en Buenos Aires hay grupos que se establecieron a partir de aves escapadas de cautiverio. Vuela en bandadas muy ruidosas y duerme en dormideros comunales en árboles altos o edificios. Come frutos, semillas y flores.",sprites:{adulto:"Psittacara_leucophthalmus_D"},audio_ebird_code:"whepar2",mapa:"Maps/Psittacara_leucophthalmus_map.png",thumb_sprite:"",exotica:false,amba:22.01},
{id:160,num:"#120",n_lista:576,nombre_comun:"Choca Corona Rojiza",nombre_cientifico:"Thamnophilus ruficapillus",familia:"Thamnophilidae",orden:"Passeriformes",descripcion:{macho:"Pájaro mediano, de pico grueso y ganchudo y cola larga escalonada. El macho tiene la corona castaña, los costados de la cabeza y la garganta ocráceo pálidos con manchitas oscuras, el dorso pardo oscuro y las alas pardo rojizas. Cola negro parduzca con las puntas blancas. Abajo blanco teñido de ocráceo, con barras negras finas e irregulares en el pecho y los costados.",hembra:"La hembra tiene la corona canela parda, la cola pardo rojiza sin blanco y apenas un rastro de barras en el pecho."},habitat:["monte","ribereño","humedal"],residencia:"permanente",tamanio:"chico",largo_cm:"15-17",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Corrientes","Entre Ríos","Jujuy","Misiones","Salta","Tucumán"],curiosidades:"Vive escondida en matorrales densos y bordes de monte, y se la descubre más por su canto, una serie de notas que se aceleran, que por verla. Caza insectos entre las ramas con su pico ganchudo, moviéndose despacio.",sprites:{macho:"Thamnophilus_ruficapillus_M"},audio_ebird_code:"rucant1",mapa:"Maps/Thamnophilus_ruficapillus_map.png",thumb_sprite:"",exotica:false,amba:2.11},
{id:177,num:"#121",n_lista:577,nombre_comun:"Choca Corona Negruzca",nombre_cientifico:"Thamnophilus caerulescens",familia:"Thamnophilidae",orden:"Passeriformes",descripcion:{macho:"Pájaro chico de cabeza grande. El macho tiene la cabeza y la corona negras. Pico con la parte de arriba negra y la de abajo gris. Ojo pardo. Dorso gris. Alas pardas con las cubiertas negras y una franja blanca. Cola negra con las puntas de las plumas de los costados blancas. Partes inferiores grises, con las plumas de debajo de la cola blanquecinas. Patas grises.",hembra:"La hembra tiene la corona castaña, el dorso gris o pardo oliváceo, la garganta y el pecho grises y el resto de abajo canela. Las alas son pardas con bordes canela, y conserva la franja blanca del ala y las puntas blancas de la cola."},habitat:["monte","bosque","ribereño"],residencia:"permanente",tamanio:"chico",largo_cm:"14",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Rioja","Misiones","Salta","San Juan","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Anda solo o en pareja, revisando con calma el follaje denso de montes y talares en busca de insectos y arañas. Se lo oye más de lo que se lo ve: su canto es una serie de notas nasales que se aceleran hacia el final. Macho y hembra se llaman seguido mientras recorren su territorio.",sprites:{macho:"Thamnophilus_caerulescens_M"},audio_ebird_code:"varant1",mapa:"Maps/Thamnophilus_caerulescens_map.png",thumb_sprite:"",exotica:false,amba:1.0},
{id:87,num:"#122",n_lista:621,nombre_comun:"Chinchero Chico",nombre_cientifico:"Lepidocolaptes angustirostris",familia:"Furnariidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico y esbelto que trepa por los troncos. Corona y nuca negruzcas con estrías ocráceas. Ceja blanca muy marcada, que se ensancha hacia atrás y termina en una línea de puntitos, y una línea negra detrás del ojo. Pico largo, fino y curvado hacia abajo, gris claro a rosado. Ojo pardo. Dorso pardo rojizo; alas, rabadilla y cola color canela rojizo. Garganta y cachetes blancuzcos lisos. Pecho y vientre blancuzcos con estrías oscuras. Patas gris verdosas a gris oscuras. Macho y hembra son iguales."},habitat:["monte","bosque","urbano","agrícola"],residencia:"permanente",tamanio:"chico",largo_cm:"18-22",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","Catamarca","La Rioja","Tucumán","Salta","Jujuy","San Juan","Río Negro"],curiosidades:"Sube por los troncos en espiral, desde cerca del suelo hasta las ramas altas, revisando la corteza con su pico fino en busca de insectos y arañas; a diferencia de otros trepadores casi no se apoya en la cola. A veces baja al suelo a comer hormigas y hasta se lo vio cazando polillas alrededor de los faroles. Se acercó mucho a la gente: recorre árboles de plazas, frutales y postes de luz o alambrado. Anida en huecos de árboles, a menudo agujeros viejos de carpinteros, y también en estructuras como pilares de puentes; los dos padres incuban 2 a 4 huevos. Su canto es una serie fuerte de silbidos que bajan de tono.",sprites:{adulto:"Lepidocolaptes_angustirostris_D"},audio_ebird_code:"nabwoo1",mapa:"Maps/Lepidocolaptes_angustirostris_map.png",thumb_sprite:"",exotica:false,amba:34.34},
{id:46,num:"#123",n_lista:631,nombre_comun:"Hornero",nombre_cientifico:"Furnarius rufus",familia:"Furnariidae",orden:"Passeriformes",descripcion:{adulto:"Ave mediana y robusta. Cabeza parda con una ceja más clara. Dorso, alas y nuca pardo-rojizos. Cola y rabadilla de un rufo intenso y brillante. Garganta blancuzca que se funde con un pecho y vientre color ante pálido. Flancos algo más oscuros. Pico mediano casi recto. Patas pardo oscuras."},habitat:["urbano","pastizal","agrícola","ribereño"],residencia:"permanente",tamanio:"chico",largo_cm:19,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"Ave nacional argentina. Construye nidos de barro y paja con forma de horno de entre 20 y 30 cm de diámetro. La pareja casi nunca reutiliza el mismo nido, dejándolo disponible como refugio para otras aves y animales. Se alimenta principalmente de insectos que recoge caminando por el suelo.",sprites:{adulto:"Furnarius_rufus_D"},audio_ebird_code:"rufhor2",mapa:"Maps/Furnarius_rufus_map.png",thumb_sprite:"",exotica:false,amba:107.75},
{id:47,num:"#124",n_lista:634,nombre_comun:"Junquero",nombre_cientifico:"Phleocryptes melanops",familia:"Furnariidae",orden:"Passeriformes",descripcion:{adulto:"Ave pequeña y escurridiza. Corona negruzca con estrías pardas anchas y una ceja ante-crema bien marcada. Zona malar ante-buff. Dorso y alas pardo-estriados con tonos rufos en las alas. Cola corta y rufa. Garganta y pecho blancuzcos. Vientre crema. Patas largas de color gris cuerno. Se mueve con agilidad entre los tallos verticales de juncales y totorales."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"chico",largo_cm:14,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","La Pampa","Córdoba","Mendoza","San Luis","Neuquén","Río Negro","Chubut"],curiosidades:"Vive exclusivamente entre los juncales y totorales de lagunas y bañados. Construye un nido en forma de bola tejido con hojas de junco, atado a los tallos a pocos centímetros del agua. Su canto breve y repetitivo es la única señal de su presencia en la vegetación densa.",sprites:{adulto:"Phleocryptes_melanops_D"},audio_ebird_code:"wrlrus1",mapa:"Maps/Phleocryptes_melanops_map.png",thumb_sprite:"",exotica:false,amba:13.42},
{id:185,num:"#125",n_lista:635,nombre_comun:"Pajonalera Pico Curvo",nombre_cientifico:"Limnornis curvirostris",familia:"Furnariidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico de pico largo y algo curvo hacia abajo. Ceja blanquecina bien marcada y una línea pardo oscura detrás del ojo; mejillas con estrías finas blanquecinas. Pico con la parte de arriba parda a negruzca y la de abajo blanquecina. Ojo pardo. Corona y dorso pardo intenso, más oscuros en la frente y más rojizos en la rabadilla. Alas y cola pardo rojizas; la cola es escalonada. Garganta blanquecina; pecho ante; vientre ante cremoso pálido, con los costados más canela. Patas grisáceas. Macho y hembra son iguales."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"chico",largo_cm:"15-17",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos"],curiosidades:"Vive solo en los juncales y pajonales densos de los humedales del Río de la Plata, el Delta y la costa de Uruguay y el sur de Brasil. Es muy escurridiza: se mueve escondida entre los tallos buscando hormigas, saltamontes y escarabajos, y se la descubre sobre todo por su canto.",sprites:{adulto:"Limnornis_curvirostris_D"},audio_ebird_code:"cubree1",mapa:"Maps/Limnornis_curvirostris_map.png",thumb_sprite:"",exotica:false,amba:2.04},
{id:122,num:"#126",n_lista:639,nombre_comun:"Remolinera Parda",nombre_cientifico:"Cinclodes fuscus",familia:"Furnariidae",orden:"Passeriformes",descripcion:{adulto:"Pajarito de suelo, pardo, de pico corto y fino. Ceja ocrácea bien marcada. Mejillas pardo grisáceas oscuras y una mancha blanca debajo, en la base de la mejilla. Pico pardo negruzco. Ojo pardo oscuro. Corona y dorso pardo oscuros. Alas pardas con bordes claros en las plumas y una banda canela que las cruza, muy visible en vuelo. Cola parda oscura con las puntas de las plumas de los costados ocráceas. Garganta blanquecina punteada de pardo. Pecho pardo claro; vientre blanquecino. Patas pardo oscuras. Macho y hembra son iguales."},habitat:["ribereño","humedal","costa","pastizal"],residencia:"invernal",tamanio:"chico",largo_cm:"15-19",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","La Rioja","Catamarca","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Cría en la Patagonia, Tierra del Fuego y las montañas del oeste, y en otoño muchas bajan al norte y al este: por eso en Buenos Aires se la ve sobre todo en invierno, caminando por las orillas de lagunas, arroyos, bañados y la costa. Camina y corre por el suelo buscando insectos, crustáceos y caracoles, y a veces se posa en ramas o troncos bajos. En primavera el macho canta y aletea desde una percha para marcar territorio. Hace el nido al fondo de un túnel que cava en una barranca, o en grietas entre rocas y huecos de paredes, y lo acolcha con pasto, pelos y plumas.",sprites:{adulto:"Cinclodes_fuscus_D"},audio_ebird_code:"buwcin1",mapa:"Maps/Cinclodes_fuscus_map.png",thumb_sprite:"",exotica:false,amba:2.74},
{id:120,num:"#127",n_lista:665,nombre_comun:"Espinero Pecho Manchado",nombre_cientifico:"Phacellodomus striaticollis",familia:"Furnariidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico, de tonos castaños. Frente y corona pardo rojizas. Ceja blanquecina poco marcada. Pico fino y puntiagudo, pardo arriba y gris claro abajo. Ojo amarillo, muy llamativo. Dorso y alas castaños. Cola con las plumas del centro pardas y las de los costados castañas. Garganta blanquecina. Pecho ocre canela con pintitas castaño oscuras y estrías claras. Vientre blanquecino y costados pardo grisáceos. Patas pardo oliváceas. Macho y hembra son iguales."},habitat:["humedal","ribereño","monte"],residencia:"permanente",tamanio:"chico",largo_cm:"16-17",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Santiago del Estero","Córdoba","San Luis"],curiosidades:"Casi siempre vive cerca del agua, en matorrales de orillas, bordes de bañados y montes ribereños. Construye un nido enorme para su tamaño: un bulto alargado de palitos con espinas de hasta medio metro de largo, con un túnel corto y curvo que lleva a la cámara, forrada con pajitas, plumas, pelos y pelusa vegetal. Lo cuelga cerca de la punta de una rama, muchas veces sobre el agua. Su nombre científico lo cuenta: 'Phacellodomus' quiere decir 'casa de palitos amontonados'. Busca insectos y arañas en el suelo y en arbustos bajos.",sprites:{adulto:"Phacellodomus_striaticollis_D"},audio_ebird_code:"frbtho1",mapa:"Maps/Phacellodomus_striaticollis_map.png",thumb_sprite:"",exotica:false,amba:8.65},
{id:125,num:"#128",n_lista:667,nombre_comun:"Leñatero",nombre_cientifico:"Anumbius annumbi",familia:"Furnariidae",orden:"Passeriformes",descripcion:{adulto:"Pajarito pardo y rayado, de cola larga y escalonada, con aspecto de cachirla. Frente castaña. Corona parda con rayitas oscuras finas. Ceja blanquecina ancha y una línea parda detrás del ojo. Pico de mandíbula superior parda y la inferior gris clara. Ojo pardo castaño. Dorso pardo, rayado de oscuro sobre todo en la parte baja. Alas pardas con tono canela. Cola con las plumas centrales pardas y puntiagudas y las de los costados negruzcas con la punta blanca. Garganta blanca bordeada por una línea de puntitos negros. Pecho y vientre ocráceos, con rayas pálidas y difusas en el pecho. Patas crema oliváceas. Macho y hembra son iguales."},habitat:["pastizal","agrícola","monte"],residencia:"permanente",tamanio:"chico",largo_cm:"18-20",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","Neuquén","Río Negro"],curiosidades:"Su nombre viene del enorme nido que construye: un cilindro de palitos espinosos que puede medir más de un metro de alto, muy llamativo en árboles aislados, postes de luz y molinos del campo. Tiene la entrada arriba y un túnel en espiral que baja hasta la cámara, que acolcha con plumas y fibras suaves; en la entrada suele poner plumas, hilos, trozos de nylon o de tela. A veces los jóvenes de la primera cría ayudan a sus padres a armar el nido de la segunda. Anda en pareja, caminando por el suelo y los pastos bajos en busca de insectos y arañas, y la pareja canta a dúo un trino rápido que termina en un chirrido.",sprites:{adulto:"Anumbius_annumbi_D"},audio_ebird_code:"firgat1",mapa:"Maps/Anumbius_annumbi_map.png",thumb_sprite:"",exotica:false,amba:0.48},
{id:191,num:"#129",n_lista:679,nombre_comun:"Curutié Ocráceo",nombre_cientifico:"Limnoctites sulphuriferus",familia:"Furnariidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico de pico fino y cola larga. Ceja ocrácea. Pico negruzco con la base de abajo más clara. Ojo rojizo. Dorso pardo con tono canela. Alas pardas y canela, con las cubiertas castañas y pardas. Cola parda con tono castaño. Mancha amarilla en la garganta; resto de abajo grisáceo. Patas gris verdosas. Macho y hembra son iguales."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"chico",largo_cm:"15",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe"],curiosidades:"Vive escondido en juncales, pajonales y caraguatales de los humedales. La mancha amarilla de la garganta es chica y cuesta verla en el campo. Busca insectos trepando por los tallos y las hojas, y su canto es un trino agudo y seco.",sprites:{adulto:"Limnoctites_sulphuriferus_D"},audio_ebird_code:"sutspi1",mapa:"Maps/Limnoctites_sulphuriferus_map.png",thumb_sprite:"",exotica:false,amba:2.61},
{id:193,num:"#130",n_lista:685,nombre_comun:"Espartillero Enano",nombre_cientifico:"Spartonoica maluroides",familia:"Furnariidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico de cola larga, escalonada y terminada en puntas. Frente y parte de adelante de la corona castañas. Ceja blanquecina. Pico con la parte de arriba córnea oscura y la de abajo gris clara. Ojo amarillo. Dorso pardo oliváceo con un jaspeado negro grueso. Alas pardas con una franja canela. Cola castaña con una banda pardo oscura a lo largo de las plumas del centro. Partes inferiores blanquecinas, con un leve tono canela en el pecho, los costados y debajo de la cola. Patas córneo grisáceas. Macho y hembra son iguales."},habitat:["pastizal","humedal"],residencia:"estival",tamanio:"chico",largo_cm:"13",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Córdoba","Entre Ríos","La Pampa","Mendoza","Santa Fe"],curiosidades:"Vive en pastizales húmedos, espartillares y juncales bajos, donde se mueve escondido entre las matas buscando insectos y arañas. Su canto es un trino fino que parece de insecto. Con la cola larga y en punta levantada, recuerda a una ratona.",sprites:{adulto:"Spartonoica_maluroides_D"},audio_ebird_code:"bcwspi1",mapa:"Maps/Spartonoica_maluroides_map.png",thumb_sprite:"",exotica:false,amba:0.32},
{id:173,num:"#131",n_lista:689,nombre_comun:"Chotoy",nombre_cientifico:"Schoeniophylax phryganophilus",familia:"Furnariidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro mediano por su cola muy larga, de plumas centrales largas. Frente parda y corona con tono castaño; ceja fina ocrácea; cara parda y blanquecina. Pico gris negruzco arriba y claro abajo. Ojo pardo castaño. Dorso pardo estriado de pardo oscuro. Alas pardas con las cubiertas rojizas. Cola pardo grisácea. Garganta amarilla arriba y negra abajo; costados del cuello blancos. Pecho canela y vientre blanquecino. Patas rosadas. Macho y hembra son iguales."},habitat:["humedal","pastizal","monte"],residencia:"permanente",tamanio:"mediano",largo_cm:"22",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Misiones","Santa Fe","Santiago del Estero"],curiosidades:"Vive en matorrales y pastizales con arbustos cerca del agua, y se posa en los alambrados de los campos. Su canto es un trino largo y fuerte que a veces hacen a dúo macho y hembra. Construye un nido grande de palitos espinosos, cerrado, con un tubo de entrada.",sprites:{adulto:"Schoeniophylax_phryganophilus_D"},audio_ebird_code:"chospi2",mapa:"Maps/Schoeniophylax_phryganophilus_map.png",thumb_sprite:"",exotica:false,amba:2.38},
{id:184,num:"#132",n_lista:693,nombre_comun:"Pijuí Plomizo",nombre_cientifico:"Synallaxis spixi",familia:"Furnariidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico y delgado, de cola larga, escalonada y terminada en puntas. Corona rufa; cara pardo grisácea con una ceja fina más clara. Pico con la parte de arriba negra y la de abajo gris. Ojo de pardo rojizo a naranja pálido. Dorso y rabadilla pardo oscuros. Alas pardo oscuras con las cubiertas rufas o bordeadas de rufo. Cola pardo oscura. Garganta blanco grisácea con una mancha negra abajo. Pecho gris pardusco, vientre más claro y costados más pardos. Patas grises a gris verdosas. Macho y hembra son iguales."},habitat:["pastizal","monte","humedal","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"16-17",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Corrientes","Entre Ríos","Misiones"],curiosidades:"Su canto, un 'chi-chi-chi-chi' repetido sin descanso, le dio el nombre de 'chicli' en otras regiones. Busca insectos y arañas escondido en matorrales densos, y sale a la vista sobre todo para cantar. Arma un nido grande de palitos apilados, con una entrada lateral en forma de tubo.",sprites:{adulto:"Synallaxis_spixi_D"},audio_ebird_code:"spispi1",mapa:"Maps/Synallaxis_spixi_map.png",thumb_sprite:"",exotica:false,amba:6.49},
{id:166,num:"#133",n_lista:695,nombre_comun:"Pijuí Frente Gris",nombre_cientifico:"Synallaxis frontalis",familia:"Furnariidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro chico y delgado, de cola larga, escalonada y terminada en puntas. Frente gris y corona castaña. Pico fino, oscuro. Ojo pardo castaño. Dorso pardo. Alas pardas y castañas, con las cubiertas castañas. Cola castaña. Mancha negra en la garganta. Pecho y vientre gris ocráceos. Patas pardo grisáceas con tinte oliváceo. Macho y hembra son iguales."},habitat:["monte","ribereño","urbano"],residencia:"permanente",tamanio:"chico",largo_cm:"16",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Salta","San Juan","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Su nombre imita su canto, un 'pi-juí' insistente que repite escondido en el matorral. Busca insectos en el follaje y entre los pastos altos, casi siempre a poca altura. Construye un nido enorme para su tamaño, una bola de ramitas espinosas con un tubo de entrada a un costado.",sprites:{adulto:"Synallaxis_frontalis_D"},audio_ebird_code:"sofspi1",mapa:"Maps/Synallaxis_frontalis_map.png",thumb_sprite:"",exotica:false,amba:15.94},
{id:119,num:"#134",n_lista:701,nombre_comun:"Cortarramas",nombre_cientifico:"Phytotoma rutila",familia:"Cotingidae",orden:"Passeriformes",descripcion:{macho:"Pájaro robusto, de pico corto y grueso, y con un copetito corto. Frente castaño rojiza; corona y nuca grises con estrías tenues. Pico negruzco o grisáceo. Ojo amarillo anaranjado. Dorso gris pardusco con estrías tenues. Alas oscuras con dos bandas blancas. Cola oscura con la punta blanca en las plumas de los costados. Garganta, pecho y vientre castaño rojizos, con los costados más grisáceos. Patas pardo grisáceas.",hembra:"La hembra es muy distinta: arriba grisácea con estrías pardo oscuras, y abajo canela clara u ocrácea, toda cubierta de estrías pardo oscuras. Alas pardas con bordes claros y bandas blancas finas. Cola parda con blanco en las plumas de los costados."},habitat:["monte","bosque","agrícola","urbano"],residencia:"invernal",tamanio:"chico",largo_cm:"18-19.5",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","La Rioja","Catamarca","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut"],curiosidades:"Come sobre todo vegetales: brotes, hojas, flores, frutos y semillas, además de algunos insectos. Vive en montes, matorrales, arboledas, estepas arbustivas y también en quintas y jardines. Tiene decenas de nombres populares en todo el país, como 'bisagra', 'quejón', 'rechinador', 'corderito del monte' o 'dentudo'. Hace un nido en forma de taza de palitos, a veces con espinas, en arbustos o árboles bajos. Solo la hembra incuba los 2 a 4 huevos, durante unos 15 días, y después los dos padres alimentan a los pichones.",sprites:{macho:"Phytotoma_rutila_M"},audio_ebird_code:"whtpla1",mapa:"Maps/Phytotoma_rutila_map.png",thumb_sprite:"",exotica:false,amba:6.11},
{id:161,num:"#135",n_lista:713,nombre_comun:"Anambé Negro",nombre_cientifico:"Pachyramphus polychopterus",familia:"Tityridae",orden:"Passeriformes",descripcion:{macho:"Pájaro chico y robusto, de cabeza grande y redondeada. El macho tiene la frente y la corona negras. Pico gris plateado con la punta oscura. Ojo pardo. Dorso gris pardusco. Alas pardo oscuras con dos franjas blancas. Cola negra con las puntas de las plumas de los costados blancas. Garganta, pecho y vientre grises. Patas grisáceas.",hembra:"La hembra no tiene la corona negra: es gris parduzca arriba, gris abajo con el vientre blanquecino, tiene una franja canela en el ala en lugar de las blancas y la cola parda con una mancha canela en las plumas de los costados."},habitat:["monte","bosque","ribereño"],residencia:"estival",tamanio:"chico",largo_cm:"15",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","Misiones","Salta","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Llega a Buenos Aires en primavera y se va en otoño. Recorre despacio las copas de los árboles buscando insectos entre las hojas y se lo descubre por su canto, una serie de silbidos suaves que se aceleran. Cuelga de una rama alta un nido grande y desprolijo, en forma de bola, hecho con fibras vegetales.",sprites:{macho:"Pachyramphus_polychopterus_M"},audio_ebird_code:"whwbec1",mapa:"Maps/Pachyramphus_polychopterus_map.png",thumb_sprite:"",exotica:false,amba:8.65},
{id:157,num:"#136",n_lista:721,nombre_comun:"Mosqueta Carasucia",nombre_cientifico:"Phylloscartes ventralis",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Pajarito chico y verdoso. Corona, nuca y dorso oliva oscuros. Ceja fina blanquecina, una línea oscura que pasa por el ojo y las mejillas manchadas de blanquecino y oscuro, como sucias. Pico negro, largo, chato y fino, con la base de abajo rosada o amarillenta. Ojo pardo oscuro. Alas oscuras con dos bandas amarillentas y bordes oliva amarillentos. Cola oscura con bordes oliva. Garganta blanquecina; resto de abajo amarillento con tono oliva grisáceo en el pecho. Patas gris pizarra. Macho y hembra son iguales."},habitat:["monte","bosque","arbolado","ribereño"],residencia:"invernal",tamanio:"chico",largo_cm:"12",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Corrientes","Entre Ríos","Jujuy","Misiones","Salta","Tucumán"],curiosidades:"Su nombre viene de las mejillas manchadas de claro y oscuro. Se mueve sin parar entre el follaje, con la cola algo levantada, buscando insectos chicos en las hojas. En Buenos Aires se ve sobre todo en otoño e invierno, en montes ribereños y arboledas.",sprites:{adulto:"Phylloscartes_ventralis_D"},audio_ebird_code:"moctyr2",mapa:"Maps/Phylloscartes_ventralis_map.png",thumb_sprite:"",exotica:false,amba:2.48},
{id:141,num:"#137",n_lista:742,nombre_comun:"Fiofío Pico Corto",nombre_cientifico:"Elaenia parvirostris",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Pajarito chico y oliváceo, de cabeza redondeada; a veces eriza un copete corto. Corona con una mancha blanca escondida. Pico corto, negro, con la base de abajo rosada o amarillenta. Ojo pardo, con un anillo blanquecino. Dorso oliváceo. Alas negruzcas con los bordes de las plumas ocráceos y dos bandas ocráceas. Cola negruzca con los bordes oliváceos. Garganta y pecho grises; vientre blanquecino. Patas negras. Macho y hembra son iguales."},habitat:["monte","arbolado","urbano","bosque"],residencia:"estival",tamanio:"chico",largo_cm:"15",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Salta","San Juan","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Llega a Buenos Aires en primavera para criar y en otoño migra hacia el norte, hasta la Amazonia; en invierno prácticamente no se lo ve. Su nombre imita su llamado, un fio-fío que se escucha mucho en arboledas y parques. Come insectos y frutitos que busca saltando entre las ramas o revoloteando.",sprites:{adulto:"Elaenia_parvirostris_D"},audio_ebird_code:"smbela1",mapa:"Maps/Elaenia_parvirostris_map.png",thumb_sprite:"",exotica:false,amba:10.51},
{id:186,num:"#138",n_lista:761,nombre_comun:"Tachurí Canela",nombre_cientifico:"Polystictus pectoralis",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro muy chico. Cabeza negruzca con la corona estriada de blanco. Pico negro. Ojo pardo rojizo. Dorso pardo acanelado. Alas pardas con los bordes de las plumas ocres. Cola parda. Rabadilla, pecho y costados canela; vientre blanco ocráceo. Patas negras."},habitat:["pastizal","humedal"],residencia:"estival",tamanio:"chico",largo_cm:"10",envergadura_cm:null,estado:"NT",provincias:["Buenos Aires","CABA","Corrientes","Córdoba","Entre Ríos","Formosa","La Pampa","Misiones","San Luis","Santa Fe"],curiosidades:"Es uno de los pájaros más chicos de los pastizales. Llega en primavera a criar y se va en otoño. Anda solo o en pareja, posado en lo alto de un pasto o un cardo, desde donde sale a cazar insectos al vuelo. La pérdida de pastizales naturales lo volvió escaso, y está casi amenazado a nivel mundial.",sprites:{adulto:"Polystictus_pectoralis_D"},audio_ebird_code:"beatac1",mapa:"Maps/Polystictus_pectoralis_map.png",thumb_sprite:"",exotica:false,amba:0.42},
{id:167,num:"#139",n_lista:766,nombre_comun:"Doradito Pampeano",nombre_cientifico:"Pseudocolopteryx flaviventris",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Pájaro muy chico. Cabeza parda, con la frente y el borde de las plumas de la corona castaños. Pico negro con la base de abajo amarillenta. Ojo pardo. Dorso oliváceo. Alas pardas con los bordes de las plumas ocráceos. Cola parda con los bordes oliváceos. Partes inferiores amarillas. Patas negras. Macho y hembra son iguales."},habitat:["humedal"],residencia:"estival",tamanio:"chico",largo_cm:"12",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Corrientes","Córdoba","Entre Ríos","Formosa","Santa Fe"],curiosidades:"Vive en juncales y pajonales de lagunas y bañados, donde se mueve activo entre los tallos y hace vuelos cortos para cazar insectos. Es confiado y suele asomarse a la punta de los juncos. En Buenos Aires se ve sobre todo en primavera y verano, cuando cría.",sprites:{adulto:"Pseudocolopteryx_flaviventris_D"},audio_ebird_code:"wardor1",mapa:"Maps/Pseudocolopteryx_flaviventris_map.png",thumb_sprite:"",exotica:false,amba:2.1},
{id:116,num:"#140",n_lista:768,nombre_comun:"Piojito Gris",nombre_cientifico:"Serpophaga nigricans",familia:"Tyrannidae",orden:"Passeriformes",descripcion:{adulto:"Pajarito chico, todo gris oscuro, de cola negra. Corona algo más oscura, con una franja blanca en el centro que casi siempre está escondida. Pico negro, corto y fino. Ojo pardo. Dorso gris con un tono pardusco. Alas pardas, con las plumas de vuelo y las cubiertas orilladas de blanquecino. Cola negra. Barbilla blanquecina; pecho y vientre grises, más claros que el dorso. Patas negras. Macho y hembra son iguales."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"chico",largo_cm:"11-12.5",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Catamarca","Tucumán","Salta","Jujuy","Neuquén","Río Negro"],curiosidades:"Siempre anda cerca del agua: recorre las orillas de esteros, lagunas, arroyos y ríos, camina sobre los repollitos de agua y otras plantas acuáticas y hace carreritas por la orilla para atrapar mosquitos. Es inquieto y confiado, y también caza al vuelo o sube por las ramas bajas de los árboles. Hace un nido en forma de tacita colgante, con raicillas y fibras vegetales y forrado con plumas, atado a raíces, tallos o ramas que cuelgan sobre el agua; a veces lo construye debajo de puentes. Pone 3 huevos blancos.",sprites:{adulto:"Serpophaga_nigricans_D"},audio_ebird_code:"sootyr1",mapa:"Maps/Serpophaga_nigricans_map.png",thumb_sprite:"",exotica:false,amba:2.61},
