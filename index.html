{id:89,num:"#038",n_lista:179,nombre_comun:"Carau",nombre_cientifico:"Aramus guarauna",familia:"Aramidae",orden:"Gruiformes",descripcion:{adulto:"Ave grande de cuello largo y patas largas, parecida a una garza o a un cuervillo. Cabeza y cuello se ven grisáceos por la gran cantidad de estrías blancas; cara y garganta más claras. Pico largo, grueso y apenas curvado hacia abajo, amarillento con la punta más oscura. Ojo pardo. Dorso y alas pardo oscuros con brillo oliva, salpicados de manchitas blancas en forma de triángulo. Cola corta. Pecho pardo con estrías blancas y vientre pardo oscuro con manchas blancas, más liso hacia la parte trasera. Patas largas oscuras. Macho y hembra son iguales."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"grande",largo_cm:"64-73",envergadura_cm:"100-107",estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Salta","Jujuy","Catamarca","Tucumán","San Luis","Mendoza","San Juan"],curiosidades:"Se alimenta casi solo de caracoles de agua, sobre todo los grandes caracoles manzana (ampularias): su pico no cierra del todo cerca de la punta y funciona como una pinza para sacar el caracol de la concha sin romperla. Muchas veces la punta del pico está un poco torcida hacia la derecha, igual que las conchas que abre. Es más fácil oírlo que verlo: su grito fuerte y lastimero, 'carrau', se escucha sobre todo de noche y al amanecer, y le dio su nombre. En Paraguay y el Litoral hay una leyenda que cuenta que era un joven que siguió bailando cuando le avisaron que su madre había muerto y fue castigado a llorar para siempre en los esteros. Camina como si rengueara, y en inglés lo llaman 'limpkin' por eso.",sprites:{adulto:"Aramus_guarauna_D"},audio_ebird_code:"limpki",mapa:"Maps/Aramus_guarauna_map.png",thumb_sprite:"",exotica:false,amba:27.38},
{id:181,num:"#039",n_lista:184,nombre_comun:"Burrito Canela",nombre_cientifico:"Laterallus melanophaius",familia:"Rallidae",orden:"Gruiformes",descripcion:{adulto:"Ave chica de pantano. Cabeza pardo olivácea, con la zona entre el pico y el ojo gris. Pico verde. Ojo rojo. Oreja y costados del cuello y del pecho rojizos. Nuca y dorso pardo oliváceos; rabadilla y cola más oscuras. Alas pardas. Garganta y centro de abajo blancos. Costados rayados de blanco y negro, con las rayas negras más anchas. Plumas de debajo de la cola rojizas. Patas verde oliváceas. Macho y hembra son iguales."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"chico",largo_cm:"15-18",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","Misiones","Salta","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Es muy difícil de ver: camina escondido entre juncos, pajonales y camalotes, y casi nunca sale a lo abierto. Se lo detecta por la voz, un trino fuerte y descendente que suele cantar a dúo con la pareja. Come insectos, caracoles chicos y semillas.",sprites:{adulto:"Laterallus_melanophaius_D"},audio_ebird_code:"ruscra1",mapa:"Maps/Laterallus_melanophaius_map.png",thumb_sprite:"",exotica:false,amba:9.78},
{id:96,num:"#040",n_lista:193,nombre_comun:"Gallineta Pico Pintado",nombre_cientifico:"Pardirallus sanguinolentus",familia:"Rallidae",orden:"Gruiformes",descripcion:{adulto:"Gallineta mediana, de cuerpo alargado, cola corta y pico largo. Pico verdoso, con la base de arriba celeste y la base de abajo roja: de ahí su nombre de 'pico pintado'. Ojo rojo. Corona y nuca gris parduscas; cara gris lisa. Dorso y alas pardo oliváceos. Garganta, pecho y vientre gris plomizo; parte trasera del vientre, flancos y plumas de abajo de la cola gris parduscos. Patas rojas, con dedos largos. Macho y hembra son iguales.",juvenil:"El juvenil es pardo uniforme, sin el gris del pecho, y tiene el pico y las patas negros, y el ojo pardo en lugar de rojo."},habitat:["humedal","ribereño","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:"30-40",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Chaco","Santiago del Estero","Córdoba","Salta","Jujuy","Tucumán","Catamarca","San Juan","San Luis","Mendoza","La Pampa","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego","Misiones","Formosa"],curiosidades:"Es el rálido sudamericano que llega más al sur: se lo encuentra hasta Tierra del Fuego. Vive en juncales, lagunas con vegetación flotante, zanjas y canales, y hasta en arrozales y campos regados, casi siempre cerca de cobertura para esconderse. Se alimenta sobre todo al atardecer, aunque también de día y de noche, buscando larvas, lombrices e insectos en el barro. La pareja canta a dúo: el macho hace una serie de chillidos agudos y ondulantes y la hembra le responde con notas graves 'hu'. Arma un nido simple de pasto seco en el suelo, entre pajonales cerca del agua, donde pone de 4 a 6 huevos.",sprites:{adulto:"Pardirallus_sanguinolentus_D",juvenil:"Pardirallus_sanguinolentus_J"},audio_ebird_code:"plurai1",mapa:"Maps/Pardirallus_sanguinolentus_map.png",thumb_sprite:"",exotica:false,amba:11.18},
{id:142,num:"#041",n_lista:194,nombre_comun:"Ipacaá",nombre_cientifico:"Aramides ypecaha",familia:"Rallidae",orden:"Gruiformes",descripcion:{adulto:"Ave acuática grande, de patas largas, que camina mucho y lleva la cola levantada. Corona pardo grisácea y cara gris. Nuca y parte de atrás del cuello rojizas. Pico amarillo verdoso. Ojo rojo. Dorso pardo oliváceo. Alas pardo oliváceas, con las plumas de vuelo largas rojizas. Garganta blanca. Frente del cuello y pecho grises. Resto de abajo ocre rosado. Costados y plumas de debajo de la cola negros. Patas rojas. Macho y hembra son iguales."},habitat:["humedal","ribereño","monte"],residencia:"permanente",tamanio:"mediano",largo_cm:"43-46",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chaco","Corrientes","Entre Ríos","Formosa","Jujuy","Misiones","Salta","Santa Fe"],curiosidades:"Es la chiricota más grande de la Argentina y se hace notar por sus gritos fuertes, que suele dar en coro con otros ipacaá, sobre todo al atardecer. Vive en bañados, juncales y montes cercanos al agua, donde camina con la cola levantada y se esconde rápido entre la vegetación. Vuela poco. Come insectos, caracoles, cangrejos, semillas y a veces pequeños vertebrados.",sprites:{adulto:"Aramides_ypecaha_D"},audio_ebird_code:"giwrai1",mapa:"Maps/Aramides_ypecaha_map.png",thumb_sprite:"",exotica:false,amba:8.28},
{id:108,num:"#042",n_lista:195,nombre_comun:"Chiricote",nombre_cientifico:"Aramides cajaneus",familia:"Rallidae",orden:"Gruiformes",descripcion:{adulto:"Gallineta grande, de patas largas, que camina con el cuerpo erguido y la cola levantada. Cabeza y cuello grises, con la parte de atrás de la cabeza y la nuca más parduscas. Pico largo y fuerte, verde amarillento, más amarillo en la base. Ojo rojo. Dorso y alas pardo oliváceos, con las plumas largas del ala castañas. Rabadilla y cola negras. Garganta blanca. Pecho castaño rojizo. Vientre, costados y la parte de abajo de la cola negros. Patas rojas. Macho y hembra son iguales."},habitat:["humedal","ribereño","bosque"],residencia:"permanente",tamanio:"mediano",largo_cm:"33-40",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","Tucumán","Salta","Jujuy","Catamarca","San Luis"],curiosidades:"Es muy arisco y se esconde entre los pajonales y la vegetación de bañados, lagunas, ríos y montes húmedos, así que muchas veces se lo escucha antes que verlo: su grito fuerte es una de las mejores pistas para encontrarlo. Come de todo: insectos, arañas, gusanos, caracoles, cangrejitos, pequeños reptiles, semillas y frutos. Hace un nido en forma de plato hondo, con pajas, en arbustos o matorrales, y pone unos 5 huevos crema con pintas. Los pichones nacen cubiertos de plumón negro. Se parece al Ipacaá, pero es más chico y tiene el cuello gris y no rojizo.",sprites:{adulto:"Aramides_cajaneus_D"},audio_ebird_code:"gycwor1",mapa:"Maps/Aramides_cajaneus_map.png",thumb_sprite:"",exotica:false,amba:10.96},
{id:134,num:"#043",n_lista:197,nombre_comun:"Pollona Pintada",nombre_cientifico:"Porphyriops melanops",familia:"Rallidae",orden:"Gruiformes",descripcion:{adulto:"Ave acuática mediana, más chica que la Pollona Negra, de cola corta que suele llevar levantada. Frente, la zona entre el pico y el ojo y el centro de la corona negros; el resto de la cabeza gris pardusco. Pico y escudete de la frente verdes. Ojo rojo. Dorso pardo oliváceo. Alas pardas oscuras con las cubiertas castañas. Cola parda olivácea. Cuello, pecho y partes de abajo gris plomizo, con el vientre blanquecino. Costados pardos con lunares blancos. Plumas de debajo de la cola blancas. Patas verde amarillentas, de dedos largos. Macho y hembra son iguales."},habitat:["humedal"],residencia:"permanente",tamanio:"mediano",largo_cm:"28-30",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","Salta","Jujuy","Neuquén","Río Negro","Chubut"],curiosidades:"Su nombre viene de los lunares blancos que salpican sus costados, como si estuviera 'pintada'. Vive en lagunas, bañados y zanjas con mucha vegetación flotante, sobre la que camina apoyándose en sus dedos largos. Nada moviendo la cabeza y la cola a compás, y anda sola, en pareja o en grupitos dispersos. Es bastante tímida y ante un peligro se mete enseguida entre los juncos. En la ciudad de Buenos Aires es fácil de ver en las reservas con lagunas, donde se acostumbra a la gente.",sprites:{adulto:"Porphyriops_melanops_D"},audio_ebird_code:"spfgal1",mapa:"Maps/Porphyriops_melanops_map.png",thumb_sprite:"",exotica:false,amba:11.2},
{id:86,num:"#044",n_lista:200,nombre_comun:"Pollona Negra",nombre_cientifico:"Gallinula galeata",familia:"Rallidae",orden:"Gruiformes",descripcion:{adulto:"Ave acuática mediana, del tamaño de un pato chico. Escudete en la frente rojo brillante que sigue en un pico rojo con la punta amarilla. Ojo rojo. Cabeza y cuello negruzcos. Dorso gris pizarra, con tinte pardo oliváceo en la parte baja y la rabadilla; alas pardas; cola corta que mueve seguido al nadar. Cuerpo gris pizarra con una línea blanca bien marcada a lo largo del costado, y plumas blancas a los lados de la parte de abajo de la cola. Patas largas verde amarillentas con dedos muy largos y una 'liga' roja arriba del talón.",juvenil:"Más pardo y apagado que el adulto, sin el escudete rojo y con el pico pardo verdoso y un escudete chico, el ojo pardo y las patas gris oliváceo. Conserva la línea blanca del costado y el blanco debajo de la cola."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"mediano",largo_cm:"32-35",envergadura_cm:"54-62",estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","Tucumán","Salta","Jujuy","Catamarca","San Juan","La Rioja","Santa Cruz"],curiosidades:"Vive en lagunas, bañados, canales y orillas con mucha vegetación, y en parques de ciudad puede volverse bastante confiada. Nada moviendo la cabeza hacia adelante y la cola corta, y sus dedos largos le permiten caminar sobre plantas flotantes como los camalotes. Come de todo: plantas acuáticas, semillas, insectos, caracoles y otros bichitos del agua. Defiende su territorio a los picotazos y patadas. Arma el nido como una canasta entre la vegetación densa, y los dos padres incuban y alimentan a los pichones, que son negros y peludos. Hasta 2011 se la consideraba la misma especie que la polla de agua de Europa.",sprites:{adulto:"Gallinula_galeata_D",juvenil:"Gallinula_galeata_J"},audio_ebird_code:"comgal1",mapa:"Maps/Gallinula_galeata_map.png",thumb_sprite:"",exotica:false,amba:33.31},
{id:97,num:"#045",n_lista:201,nombre_comun:"Gallareta Escudete Rojo",nombre_cientifico:"Fulica rufifrons",familia:"Rallidae",orden:"Gruiformes",descripcion:{adulto:"Gallareta de tamaño intermedio entre la Gallareta Chica y la Gallareta Ligas Rojas. Cabeza y cuello negros. Escudete de la frente rojo oscuro, angosto y terminado en punta hacia arriba; la parte de arriba del pico también es roja y el resto del pico amarillo fuerte. Ojo rojo. Dorso, alas y cola gris plomizo oscuro. Plumas de abajo de la cola blancas a los costados, muy visibles cuando levanta la cola. Pecho y vientre gris plomizo algo más claro. Patas verdes, con los dedos lobulados. Macho y hembra son iguales.",juvenil:"El juvenil es gris pardusco, con el pico negruzco, pintitas blancas en la garganta y el mismo blanco debajo de la cola. Ya tiene el escudete de la frente terminado en punta."},habitat:["humedal"],residencia:"permanente",tamanio:"mediano",largo_cm:"38-45",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Santiago del Estero","Córdoba","Salta","Jujuy","Tucumán","San Juan","San Luis","Mendoza","La Pampa","Neuquén","Río Negro","Chubut","Santa Cruz","La Rioja","Catamarca"],curiosidades:"Se la reconoce entre las otras gallaretas por el escudete rojo oscuro y puntiagudo sobre el pico, y porque levanta la cola mostrando mucho blanco a los costados. Es la única gallareta sin lóbulos en los dedos. Vive en lagunas con juncales y vegetación flotante, como la lenteja de agua, y es muy abundante en los bañados de la región pampeana. Come sobre todo plantas que picotea en la superficie, aunque también se zambulle y sale a pastar a la orilla. Anda en grupos, muchas veces mezclada con la Gallareta Ligas Rojas y la Gallareta Chica. Hace el nido con plantas, flotando o entre los juncos, y el Pato Cabeza Negra suele poner sus huevos en él para que la gallareta se los incube.",sprites:{adulto:"Fulica_rufifrons_D",juvenil:"Fulica_rufifrons_J"},audio_ebird_code:"refcoo1",mapa:"Maps/Fulica_rufifrons_map.png",thumb_sprite:"",exotica:false,amba:17.71},
{id:17,num:"#046",n_lista:204,nombre_comun:"Gallareta Ligas Rojas",nombre_cientifico:"Fulica armillata",familia:"Rallidae",orden:"Gruiformes",descripcion:{adulto:"Ave acuática grande y rechoncha. Cuerpo pizarra oscuro, cabeza y cuello negros. Pico y escudete amarillos, separados por una línea roja. Ojo rojo. Patas oliváceas con una faja (liga) roja en la tibia; dedos lobulados gris oscuro. Pequeña mancha blanca bajo la cola."},habitat:["humedal","laguna","ribereño"],residencia:"permanente",tamanio:"mediano",largo_cm:43,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Chaco","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Su nombre viene de los anillos rojos en la articulación de las patas, visibles de cerca. Es territorial y agresiva, persigue a otras aves en el agua. Puede correr sobre la superficie del agua batiendo las alas antes de levantar vuelo.",sprites:{adulto:"Fulica_armillata_D"},audio_ebird_code:"regcoo1",mapa:"Maps/Fulica_armillata_map.png",thumb_sprite:"",exotica:false,amba:20.34},
{id:18,num:"#047",n_lista:206,nombre_comun:"Gallareta Chica",nombre_cientifico:"Fulica leucoptera",familia:"Rallidae",orden:"Gruiformes",descripcion:{adulto:"Gallareta mediana de plumaje gris pizarra, más oscuro en cabeza y cuello. Escudete frontal amarillo a amarillo-anaranjado. Pico amarillo a amarillo-verdoso con mancha oscura en la punta. Ojo rojo. Puntas blancas en las secundarias, visibles en vuelo (de ahí su nombre en inglés white-winged). Patas verdes con lóbulos en los dedos. Inmaduro más pardo y con partes inferiores más claras."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"mediano",largo_cm:37,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","La Pampa","Córdoba","Mendoza","Neuquén","Río Negro","Chubut"],curiosidades:"Es la gallareta más pequeña de las tres especies comunes en Buenos Aires. Se distingue de la Gallareta ligas rojas por su escudete y pico enteramente blancos, sin coloración roja ni amarilla. Bucea con frecuencia en busca de plantas acuáticas. Forma grandes bandadas en lagunas durante el invierno.",sprites:{adulto:"Fulica_leucoptera_D"},audio_ebird_code:"whwcoo1",mapa:"Maps/Fulica_leucoptera_map.png",thumb_sprite:"",exotica:false,amba:20.47},
{id:151,num:"#048",n_lista:208,nombre_comun:"Chorlo Pampa",nombre_cientifico:"Pluvialis dominica",familia:"Charadriidae",orden:"Charadriiformes",descripcion:{adulto:"Chorlo mediano, de cabeza redonda, pico corto y patas largas. En Buenos Aires se ve con plumaje de descanso: cara, cuello y pecho blanquecinos jaspeados de pardo claro, con la frente y una ceja blanquecinas. Pico negro. Ojo pardo. Dorso pardo oscuro con las plumas bordeadas de blanquecino o dorado. Alas pardo oscuras. Vientre blanquecino. Patas gris oscuras.",reproductivo:"Antes de irse al norte algunos ya muestran el plumaje de cría: cara, cuello y todo el frente negros, bordeados por una franja blanca desde la frente hasta el costado del pecho, y el dorso salpicado de dorado."},habitat:["pastizal","humedal","costa","agrícola"],residencia:"estival",tamanio:"mediano",largo_cm:"24-28",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","Mendoza","Río Negro","Salta","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego"],curiosidades:"Cría en la tundra de Alaska y Canadá y viaja más de 10.000 km para pasar nuestro verano en los pastizales pampeanos, en parte cruzando el Atlántico sin escalas. Anda en grupos que corren, se detienen y picotean en campos de pasto corto y orillas de lagunas.",sprites:{adulto:"Pluvialis_dominica_D"},audio_ebird_code:"amgplo",mapa:"Maps/Pluvialis_dominica_map.png",thumb_sprite:"",exotica:false,amba:0.12},
{id:19,num:"#049",n_lista:212,nombre_comun:"Tero",nombre_cientifico:"Vanellus chilensis",familia:"Charadriidae",orden:"Charadriiformes",descripcion:{adulto:"Ave mediana y llamativa. Cabeza gris con frente negra y una cresta fina y negra que cae hacia atrás. Banda ancha negra en el pecho. Dorso y alas pardo-grisáceos con un brillo bronceado y reflejos violáceos. Vientre blanco. Pico rojo-anaranjado con punta negra. Ojo rojo intenso con cera roja. Patas rojo oscuras. Posee espolones en las alas."},habitat:["pastizal","urbano","agrícola","ribereño","costa","humedal"],residencia:"permanente",tamanio:"mediano",largo_cm:33,envergadura_cm:75,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Uno de los pájaros más territoriales y ruidosos de la región. Defiende su nido con vuelos rasantes y llamadas estridentes contra cualquier intruso. Posee espolones en las alas que usa como arma. Se ha adaptado muy bien a ambientes urbanos.",sprites:{adulto:"Vanellus_chilensis_D"},audio_ebird_code:"soulap1",mapa:"Maps/Vanellus_chilensis_map.png",thumb_sprite:"",exotica:false,amba:50.36},
{id:145,num:"#050",n_lista:219,nombre_comun:"Chorlito Doble Collar",nombre_cientifico:"Charadrius falklandicus",familia:"Charadriidae",orden:"Charadriiformes",descripcion:{adulto:"Chorlito chico y rechoncho, de patas cortas. Así se lo ve en Buenos Aires, con plumaje de descanso: frente blanca, cabeza y dorso pardo grisáceos, y dos collares pardo grisáceos sobre el pecho blanco, uno fino en el cuello y otro más ancho. Pico corto y negro. Ojo pardo. Patas negras.",reproductivo:"En plumaje de cría tiene una banda negra adelante de la corona, la parte de atrás de la corona y la nuca canela rojizas, y los dos collares negros. La hembra tiene el canela más apagado y el negro más pardusco."},habitat:["costa","humedal","laguna"],residencia:"invernal",tamanio:"chico",largo_cm:"18-19",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Chubut","Neuquén","Río Negro","Santa Cruz","Tierra del Fuego"],curiosidades:"Cría en la Patagonia y en Malvinas, en pastizales inundados y orillas de lagunas, y en otoño e invierno muchos viajan hacia el norte para pasar la temporada fría en playas y estuarios de Buenos Aires, Uruguay y el sur de Brasil. Corre rápido por la arena o el barro, se detiene de golpe y picotea pequeños invertebrados.",sprites:{adulto:"Charadrius_falklandicus_D",reproductivo:"Charadrius_falklandicus_R"},audio_ebird_code:"twbplo1",mapa:"Maps/Charadrius_falklandicus_map.png",thumb_sprite:"",exotica:false,amba:0.0},
{id:99,num:"#051",n_lista:221,nombre_comun:"Ostrero Pardo",nombre_cientifico:"Haematopus palliatus",familia:"Haematopodidae",orden:"Charadriiformes",descripcion:{adulto:"Ave playera grande y robusta. Cabeza, cuello y pecho negros. Pico muy largo, recto, fuerte y aplanado de los costados, rojo anaranjado. Ojo amarillo, con un anillo rojo alrededor. Dorso, alas y cola pardo oscuros, con una franja blanca en el ala que se ve sobre todo en vuelo. Vientre blanco, bien separado del pecho negro. Patas rosadas pálidas. Macho y hembra son iguales.",juvenil:"El juvenil tiene el dorso con aspecto escamado por los bordes claros de las plumas, el pico más apagado con la punta oscura, el ojo oscuro y las patas más apagadas."},habitat:["costa"],residencia:"permanente",tamanio:"mediano",largo_cm:"40-44",envergadura_cm:"76-86",estado:"LC",provincias:["Buenos Aires","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Es el ostrero más común de la provincia de Buenos Aires y recorre toda la costa atlántica argentina hasta Tierra del Fuego. Usa su pico largo y aplanado como un cuchillo: lo mete entre las valvas de mejillones, ostras y almejas y corta el músculo que las cierra; también come cangrejos y gusanos que saca de la arena. Se alimenta con la marea baja y descansa con la marea alta, muchas veces cerca de bandadas de gaviotas. Hace el nido en un simple hoyo en la arena o el pedregullo de la playa, a veces forrado con conchillas, donde pone 2 o 3 huevos manchados que se confunden con el suelo.",sprites:{adulto:"Haematopus_palliatus_D",juvenil:"Haematopus_palliatus_J",vuelo:"Haematopus_palliatus_V"},audio_ebird_code:"ameoys",mapa:"Maps/Haematopus_palliatus_map.png",thumb_sprite:"",exotica:false,amba:0.0},
{id:20,num:"#052",n_lista:224,nombre_comun:"Tero Real",nombre_cientifico:"Himantopus mexicanus",familia:"Recurvirostridae",orden:"Charadriiformes",descripcion:{adulto:"Ave esbelta y elegante de patas extremadamente largas. Partes superiores negro intenso. Partes inferiores, cuello frontal y cara blancos. Pico fino, largo y recto, negro. Ojo rojo. Patas rosadas a rojas, notablemente largas, que sobresalen bien por detrás de la cola al volar. Sexos similares, con variación en el negro del cuello."},habitat:["humedal","ribereño","costa","pastizal"],residencia:"permanente",tamanio:"mediano",largo_cm:37,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Córdoba","La Pampa","Mendoza","Neuquén","Río Negro","Chubut"],curiosidades:"Sus patas rosadas son las más largas en proporción al cuerpo de cualquier ave argentina. Anida en el suelo cerca del agua y defiende activamente el nido ante cualquier intruso, incluyendo personas. Se lo ve en lagunas, bañados y costas, donde vadea en aguas poco profundas buscando invertebrados.",sprites:{adulto:"Himantopus_mexicanus_D"},audio_ebird_code:"bknsti",mapa:"Maps/Himantopus_mexicanus_map.png",thumb_sprite:"",exotica:false,amba:6.3},
{id:205,num:"#053",n_lista:226,nombre_comun:"Paloma Antártica",nombre_cientifico:"Chionis albus",familia:"Chionidae",orden:"Charadriiformes",descripcion:{adulto:"Ave mediana y robusta, parecida a una paloma, toda blanca. Cara con piel desnuda rosada y verrugas blanquecinas debajo del ojo. Pico corto y grueso, verdoso y amarillo en la base, con una vaina córnea, y negro o pardo en la punta. Ojo pardo. Patas grises o azuladas. Macho y hembra son iguales; el macho es algo más grande."},habitat:["costa"],residencia:"invernal",tamanio:"mediano",largo_cm:"38-41",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Chubut","Río Negro","Santa Cruz","Tierra del Fuego"],curiosidades:"Es la única ave de la Antártida que no tiene patas palmeadas: camina por las playas y las colonias de pingüinos y lobos marinos comiendo lo que encuentra, desde restos y huevos hasta excrementos. En invierno muchas viajan al norte y llegan a la costa bonaerense.",sprites:{adulto:"Chionis_albus_D"},audio_ebird_code:"snoshe2",mapa:"Maps/Chionis_albus_map.png",thumb_sprite:"",exotica:false,amba:0.0},
{id:121,num:"#054",n_lista:232,nombre_comun:"Becasa de Mar",nombre_cientifico:"Limosa haemastica",familia:"Scolopacidae",orden:"Charadriiformes",descripcion:{adulto:"Ave playera grande, de patas largas y postura erguida. Pico muy largo, apenas curvado hacia arriba en la punta, rojizo en la mitad de la base y negro hacia la punta. Ceja y garganta blancas. Ojo pardo oscuro. Dorso gris pardusco. Alas gris parduscas con una banda blanca que se ve en vuelo. Rabadilla blanca y cola negra con la base blanca. Cuello, pecho y costados grises; resto de abajo blanquecino. Patas gris azuladas. Así se ve en Argentina, con plumaje de descanso.",reproductivo:"Con plumaje de cría, antes de irse al norte, el cuello, el pecho y el vientre son castaño rojizos con barrado fino oscuro, y el dorso es pardo oscuro moteado de canela y blanco. La hembra es más pálida que el macho."},habitat:["costa","humedal"],residencia:"estival",tamanio:"mediano",largo_cm:"36-42",envergadura_cm:"74",estado:"VU",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Chaco","Formosa","Córdoba","La Pampa","Mendoza","Jujuy","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Es una gran viajera: cría en el norte de Canadá y Alaska y vuela sin escalas sobre el océano Atlántico hasta el sur de Sudamérica. Más de la mitad de la población mundial pasa el verano en Tierra del Fuego, sobre todo en la bahía San Sebastián; otras se quedan en Bahía Blanca, el cabo San Antonio o la laguna Mar Chiquita de Córdoba. Con su pico largo, que puede doblar en la punta, busca gusanos, moluscos, crustáceos e insectos en el barro de las marismas, metida en el agua hasta el vientre. Está considerada Vulnerable.",sprites:{adulto:"Limosa_haemastica_D",reproductivo:"Limosa_haemastica_R",vuelo:"Limosa_haemastica_V"},audio_ebird_code:"hudgod",mapa:"Maps/Limosa_haemastica_map.png",thumb_sprite:"",exotica:false,amba:0.06},
{id:90,num:"#055",n_lista:243,nombre_comun:"Playerito Rabadilla Blanca",nombre_cientifico:"Calidris fuscicollis",familia:"Scolopacidae",orden:"Charadriiformes",descripcion:{adulto:"Playero chico de alas muy largas, que en reposo sobresalen más allá de la cola. Corona gris parda y una línea oscura que pasa por el ojo, con una ceja blanca bien marcada. Pico negro, fino y de largo mediano. Ojo pardo. Dorso y alas gris pardo con el centro de las plumas más oscuro. Rabadilla blanca, que solo se ve cuando vuela. Pecho grisáceo con estrías finas que siguen por los flancos; garganta y vientre blancos. Patas negras. Es el plumaje que se ve en la Argentina durante nuestro verano.",reproductivo:"En plumaje reproductivo (a veces visible en aves que se van a fines del verano) la corona, las auriculares y los bordes de las escapulares tienen un tinte castaño canela pálido, el dorso tiene plumas negras con bordes claros y el pecho y los flancos están más estriados."},habitat:["costa","humedal","pastizal"],residencia:"estival",tamanio:"chico",largo_cm:"15-18",envergadura_cm:"36-38",estado:"VU",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","Mendoza","La Pampa","Río Negro","Chubut","Santa Cruz","Tierra del Fuego","Salta","Neuquén","Catamarca","Jujuy"],curiosidades:"Cría en la tundra del Ártico de Canadá y Alaska y pasa nuestro verano en las costas y lagunas del sur de Sudamérica: es uno de los migrantes más extremos del mundo, con más de 30.000 km de viaje por año y vuelos sin escalas de hasta 4.200 km. Llega en grandes bandadas a playas y marismas patagónicas, como las de Bahía San Antonio o Península Valdés, donde come almejitas, gusanos, crustáceos e insectos que busca picoteando en el barro. Su llamado es un 'tziit' agudo y metálico, parecido al ruido de dos piedritas frotadas. En 2024 fue recategorizado como Vulnerable porque su población cayó casi a la mitad en tres generaciones.",sprites:{adulto:"Calidris_fuscicollis_D",reproductivo:"Calidris_fuscicollis_R",vuelo:"Calidris_fuscicollis_V"},audio_ebird_code:"whrsan",mapa:"Maps/Calidris_fuscicollis_map.png",thumb_sprite:"",exotica:false,amba:0.62},
{id:149,num:"#056",n_lista:245,nombre_comun:"Playerito Pectoral",nombre_cientifico:"Calidris melanotos",familia:"Scolopacidae",orden:"Charadriiformes",descripcion:{adulto:"Playero chico. Dorso pardo oscuro con las plumas bordeadas de pardo claro. Ceja y garganta blanquecinas. Pico negro con la base amarilla. Ojo pardo oscuro. Cuello y pecho jaspeados y manchados de pardo, con un corte neto contra el vientre blanco, como un pechera. Alas pardas oscuras. Patas amarillentas."},habitat:["humedal","laguna","pastizal"],residencia:"estival",tamanio:"chico",largo_cm:"19-23",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"],curiosidades:"Cría en la tundra del Ártico y viaja hasta Sudamérica para pasar nuestro verano, uno de los viajes más largos de las aves. Prefiere pastizales húmedos y orillas con vegetación más que playas abiertas. Su pecho manchado que termina en un corte neto es la mejor marca para reconocerlo.",sprites:{adulto:"Calidris_melanotos_D"},audio_ebird_code:"pecsan",mapa:"Maps/Calidris_melanotos_map.png",thumb_sprite:"",exotica:false,amba:1.26},
{id:189,num:"#057",n_lista:253,nombre_comun:"Falaropo Común",nombre_cientifico:"Phalaropus tricolor",familia:"Scolopacidae",orden:"Charadriiformes",descripcion:{adulto:"Ave playera mediana, de pico negro largo y muy fino. Fuera de la época de cría es gris claro por arriba, con una ceja blanca y una línea oscura en el ojo. Ojo pardo. Alas gris oscuras, con las cubiertas bordeadas de blanquecino. Rabadilla blanca y cola grisácea. Partes inferiores blancas. Patas amarillas. Macho y hembra son iguales.",reproductivo:"En época de cría (que no pasa en la Argentina) la hembra tiene una franja negra del ojo al cuello que se vuelve castaña, y el macho es más apagado."},habitat:["laguna","humedal"],residencia:"estival",tamanio:"mediano",largo_cm:"22-25",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","Mendoza","Neuquén","Río Negro","Salta","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego"],curiosidades:"Cría en América del Norte y pasa el verano austral en lagunas de la Argentina, a veces en bandadas de miles. Nada mucho y gira sobre sí mismo como un trompo para levantar del fondo los bichitos que come. En los falaropos los roles están invertidos: la hembra es más colorida y el macho incuba y cría a los pichones.",sprites:{adulto:"Phalaropus_tricolor_D"},audio_ebird_code:"wilpha",mapa:"Maps/Phalaropus_tricolor_map.png",thumb_sprite:"",exotica:false,amba:0.47},
{id:114,num:"#058",n_lista:259,nombre_comun:"Pitotoy Grande",nombre_cientifico:"Tringa melanoleuca",familia:"Scolopacidae",orden:"Charadriiformes",descripcion:{adulto:"Ave playera mediana y esbelta, de patas muy largas. Es como el Pitotoy Chico pero más grande y con el pico proporcionalmente más largo. Ceja y garganta blanquecinas; los lados de la cabeza jaspeados de pardo. Pico largo y fino, más largo que la cabeza y apenas curvado hacia arriba, negro con la base amarilla. Ojo pardo oscuro. Dorso pardo grisáceo salpicado de blanco y pardo oscuro. Alas pardo oscuras con pintas blancas. Rabadilla blanca, que se ve bien en vuelo. Cola blanca barrada de pardo. Frente y costados del cuello, pecho y costados finamente jaspeados de pardo; resto de abajo blanco. Patas amarillas, largas. Así se ve en Argentina, con plumaje de descanso. En vuelo, el ala no muestra banda blanca, a diferencia de la Becasa de Mar."},habitat:["humedal","costa"],residencia:"estival",tamanio:"mediano",largo_cm:"29-40",envergadura_cm:"60",estado:"NT",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","La Rioja","Catamarca","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Cría en el norte de Canadá y el sur de Alaska y viaja hasta Sudamérica para pasar nuestro verano; en Argentina llega, por el interior y por la costa, hasta Tierra del Fuego. Camina por el agua baja de lagunas, bañados y playas buscando insectos, crustáceos, caracoles y pececitos, y a veces revuelve el agua con el pico. Es ruidoso: al volar da un silbido fuerte de tres notas, más fuerte y áspero que el del Pitotoy Chico. Anda en grupos, a veces junto con otros chorlos y playeros.",sprites:{adulto:"Tringa_melanoleuca_D",vuelo:"Tringa_melanoleuca_V"},audio_ebird_code:"greyel",mapa:"Maps/Tringa_melanoleuca_map.png",thumb_sprite:"",exotica:false,amba:1.03},
{id:76,num:"#059",n_lista:261,nombre_comun:"Pitotoy Chico",nombre_cientifico:"Tringa flavipes",familia:"Scolopacidae",orden:"Charadriiformes",descripcion:{adulto:"Playero esbelto de patas largas amarillo intenso y cuello fino. Pico negro, recto y fino, más o menos del largo de la cabeza. Ojo pardo oscuro. Corona, nuca y dorso pardo grisáceo estriados o salpicados de blanquecino; ceja jaspeada de pardo. Alas pardo grisáceo con las plumas bordeadas de blanco. Rabadilla blanca y cola blanca con finas barras pardas, muy visibles en vuelo. Garganta blanca, pecho jaspeado de pardo grisáceo y vientre blanco. Es el plumaje que se ve en la Argentina durante nuestro verano.",reproductivo:"En plumaje reproductivo (a veces visible en aves que llegan o se van) el dorso se ve más manchado de blanco y negro, y el pecho y los flancos más estriados y barrados de pardo."},habitat:["humedal","costa","pastizal"],residencia:"estival",tamanio:"mediano",largo_cm:"23-28",envergadura_cm:"59-64",estado:"VU",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Mendoza","San Luis","La Pampa","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Cría en claros de los bosques boreales de Alaska y Canadá y viaja miles de kilómetros para pasar nuestro verano en lagunas, bañados y campos inundados. Aunque todavía es común, su población cayó entre 60 y 80% en los últimos 50 años por la caza en el Caribe y el norte de Sudamérica y la pérdida de humedales, y hoy está considerado Vulnerable. Camina con pasos rápidos y picotea en el agua baja.",sprites:{adulto:"Tringa_flavipes_D",reproductivo:"Tringa_flavipes_R",vuelo:"Tringa_flavipes_V"},audio_ebird_code:"lesyel",mapa:"Maps/Tringa_flavipes_map.png",thumb_sprite:"",exotica:false,amba:2.63},
{id:21,num:"#060",n_lista:266,nombre_comun:"Jacana",nombre_cientifico:"Jacana jacana",familia:"Jacanidae",orden:"Charadriiformes",descripcion:{adulto:"Ave mediana inconfundible. Cabeza y cuello negros. Cuerpo castaño-rojizo intenso. Escudo frontal rojo brillante y lóbulos rícticos carnosos rojos en la base del pico, contrastando con el pico amarillo. Espolón rojo en el carpo, visible en vuelo. Primarias amarillo-verdosas pálidas con puntas oscuras. Patas y dedos extremadamente largos y delgados, oliváceos, que le permiten caminar sobre la vegetación flotante.",juvenil:"Juvenil muy diferente al adulto. Dorso castaño-pardo, partes inferiores blancas. Cara blanca con ancha ceja blanca y línea oscura por el ojo. Escudo frontal pequeño y rudimentario. Sin lóbulos rícticos ni espolón desarrollado. Pico amarillo-anaranjado. Patas y dedos larguísimos grises."},habitat:["humedal","laguna"],residencia:"permanente",tamanio:"mediano",largo_cm:23,envergadura_cm:40,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa"],curiosidades:"Camina sobre hojas de plantas flotantes gracias a sus dedos excepcionalmente largos que distribuyen su peso. Es una especie poliándrica — la hembra mantiene un territorio con varios machos que se encargan de incubar los huevos y cuidar los pichones.",sprites:{adulto:"Jacana_jacana_D",juvenil:"Jacana_jacana_J",vuelo:"Jacana_jacana_V"},audio_ebird_code:"watjac1",mapa:"Maps/Jacana_jacana_map.png",thumb_sprite:"",exotica:false,amba:25.51},
{id:130,num:"#061",n_lista:274,nombre_comun:"Rayador",nombre_cientifico:"Rynchops niger",familia:"Laridae",orden:"Charadriiformes",descripcion:{adulto:"Ave acuática mediana, parecida a un gaviotín, de alas muy largas y un pico único: largo, aplanado como una tijera, con la parte de abajo más larga que la de arriba. Frente y cara blancas. Pico rojo en la base y negro el resto. Ojo pardo oscuro. Fuera de la época de cría el dorso es pardo oscuro, con un collar blanco en la nuca. Alas largas, oscuras, con las puntas de las plumas de atrás blancas; por debajo son grisáceas. Cola parda con las plumas de los costados blancas. Garganta, pecho y vientre blancos. Patas cortas y rojas. El juvenil tiene el dorso moteado de pardo.",reproductivo:"En plumaje reproductivo la corona, la nuca, el dorso y las alas son negros, sin el collar blanco de la nuca."},habitat:["costa","ribereño","humedal"],residencia:"permanente",tamanio:"mediano",largo_cm:"44-50",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","Mendoza","Salta","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Es la única ave que pesca 'arando' el agua: vuela a ras de la superficie con el pico abierto y la parte de abajo, más larga, cortando el agua, y cuando toca un pez cierra el pico de golpe. Por eso le dicen 'cortador de agua' o 'pico tijera'. Anda en bandadas que descansan juntas en bancos de arena y playas, y a menudo pesca al atardecer o de noche. Cría en colonias, a veces junto a gaviotines, en bancos de arena de ríos: el nido es apenas un pocito excavado en el suelo, donde pone hasta 4 huevos cremas con pintas castañas, pardas y grises.",sprites:{adulto:"Rynchops_niger_D",reproductivo:"Rynchops_niger_R",vuelo:"Rynchops_niger_V"},audio_ebird_code:"blkski",mapa:"Maps/Rynchops_niger_map.png",thumb_sprite:"",exotica:false,amba:0.41},
{id:22,num:"#062",n_lista:277,nombre_comun:"Gaviota Capucho Café",nombre_cientifico:"Chroicocephalus maculipennis",familia:"Laridae",orden:"Charadriiformes",descripcion:{adulto:"Gaviota mediana y esbelta. En plumaje reproductivo tiene una capucha chocolate-café que cubre la cabeza hasta el cuello. Fuera de época reproductiva la capucha desaparece y la cabeza es blanca con una mancha oscura detrás del ojo. Cuerpo blanco. Alas grises con borde anterior blanco y punta negra. Cola blanca. Pico y patas rojos. La más común en costas y ríos de la región.",reproductivo:"Con capucha chocolate-café completa cubriendo cabeza y nuca."},habitat:["costa","ribereño","humedal","urbano"],residencia:"permanente",tamanio:"mediano",largo_cm:37,envergadura_cm:88,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Neuquén","Río Negro","Chubut"],curiosidades:"Es la gaviota más abundante en el Río de la Plata y costas bonaerenses. Muy oportunista, sigue barcos y barcazas para aprovechar los descartes. Forma grandes colonias reproductivas en islas del Delta del Paraná.",sprites:{adulto:"Chroicocephalus_maculipennis_D",reproductivo:"Chroicocephalus_maculipennis_R"},audio_ebird_code:"brhgul2",mapa:"Maps/Chroicocephalus_maculipennis_map.png",thumb_sprite:"",exotica:false,amba:15.66},
{id:117,num:"#063",n_lista:278,nombre_comun:"Gaviota Capucho Gris",nombre_cientifico:"Chroicocephalus cirrocephalus",familia:"Laridae",orden:"Charadriiformes",descripcion:{adulto:"Gaviota mediana. Cabeza y garganta grises, formando un capuchón que conserva todo el año; fuera de la época de cría tiene además una línea oscura en la nuca. Pico rojo. Ojo amarillo. Dorso y alas grises; la punta del ala es negra con manchas blancas y la base de las plumas largas del ala blanca. Cuello, rabadilla, cola y partes de abajo blancos. Patas rojas.",juvenil:"El juvenil tiene la cabeza y el dorso blanquecinos moteados de pardo, las alas pardas y la cola blanca con una banda oscura cerca de la punta. El ojo es oscuro, el pico pardo anaranjado oscuro con la punta negruzca y las patas pardo anaranjadas apagadas. Tarda dos años en tener el plumaje de adulto."},habitat:["humedal","costa","agrícola","urbano"],residencia:"permanente",tamanio:"mediano",largo_cm:"38-46",envergadura_cm:"100-105",estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Santiago del Estero","Córdoba","Tucumán","Río Negro","Mendoza","La Pampa","Neuquén"],curiosidades:"Además de Sudamérica vive en África y Madagascar. Es muy gritona, sobre todo en las colonias, y su llamado es un 'caa-caa' ronco, parecido al de un cuervo. Come peces, crustáceos, gusanos que saca de la tierra recién arada, carroña y restos que encuentra en basurales. Anida en colonias en esteros e islotes: arma en el suelo una plataforma de palitos, tallos y pajas y pone unos 3 huevos manchados. Fuera de la época de cría pierde el capuchón gris y se parece mucho a la Gaviota Capucho Café.",sprites:{adulto:"Chroicocephalus_cirrocephalus_D",juvenil:"Chroicocephalus_cirrocephalus_J"},audio_ebird_code:"grhgul",mapa:"Maps/Chroicocephalus_cirrocephalus_map.png",thumb_sprite:"",exotica:false,amba:2.86},
{id:135,num:"#064",n_lista:283,nombre_comun:"Gaviota Cangrejera",nombre_cientifico:"Larus atlanticus",familia:"Laridae",orden:"Charadriiformes",descripcion:{adulto:"Gaviota grande, parecida a la Gaviota Cocinera. Fuera de la época de cría la cabeza es pardusca. Pico amarillo y grueso, con una franja negra y la punta roja. Ojo pardo oscuro, con párpados blancos. Dorso y cubiertas de las alas negros. Plumas de vuelo largas de la punta del ala negras; las de la parte interna grises con puntas blancas. Rabadilla blanca. Cola blanca con una ancha banda negra cerca de la punta. Cuello y partes de abajo blancos. Patas amarillas. Macho y hembra son iguales.",reproductivo:"En época de cría la cabeza es completamente blanca.",juvenil:"El juvenil es muy distinto: partes de arriba moteadas de pardo y partes de abajo blanquecinas jaspeadas de pardo. Pico amarillo con la punta negra. Patas grisáceas. Tarda varios años en tener el plumaje de adulto."},habitat:["costa","marino"],residencia:"permanente",tamanio:"mediano",largo_cm:"49-56",envergadura_cm:null,estado:"NT",provincias:["Buenos Aires","CABA","Río Negro","Chubut","Santa Cruz"],curiosidades:"Se llama así porque se alimenta sobre todo de cangrejos, que caza en las marismas y planicies de barro de la costa durante la marea baja. Solo cría en la costa atlántica argentina, en unas pocas colonias del sur de Buenos Aires y la Patagonia; por eso está considerada casi amenazada. Fuera de la época de cría se dispersa hacia el norte por la costa, y en invierno es cuando más se la ve en la provincia de Buenos Aires. También se la conoce como Gaviota de Olrog, en honor al ornitólogo Claes Olrog, que la describió en 1958.",sprites:{adulto:"Larus_atlanticus_D"},audio_ebird_code:"olrgul1",mapa:"Maps/Larus_atlanticus_map.png",thumb_sprite:"",exotica:false,amba:0.28},
{id:23,num:"#065",n_lista:284,nombre_comun:"Gaviota Cocinera",nombre_cientifico:"Larus dominicanus",familia:"Laridae",orden:"Charadriiformes",descripcion:{adulto:"La gaviota más grande de la región. Adulto con cabeza, cuello, pecho y vientre blancos. Dorso y alas gris oscuro casi negro. Puntas de las alas negras con manchas blancas. Cola blanca. Pico amarillo robusto con mancha roja en el gonys. Ojo amarillo con anillo orbital rojo. Patas amarillas. El juvenil es pardo moteado y tarda cuatro años en adquirir el plumaje adulto.",juvenil:"Plumaje pardo moteado con escamado en dorso y alas. Pico oscuro. Patas rosadas. Cola con banda subterminal oscura."},habitat:["costa","marino","ribereño","urbano"],residencia:"permanente",tamanio:"grande",largo_cm:58,envergadura_cm:128,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"Carroñera y predadora oportunista. En costas patagónicas depreda colonias de pingüinos y lobos marinos, picoteando heridas en los adultos. Su nombre 'cocinera' se debe a que solía seguir a los barcos pesqueros para aprovechar los descartes.",sprites:{adulto:"Larus_dominicanus_D",juvenil:"Larus_dominicanus_J"},audio_ebird_code:"kelgul",mapa:"Maps/Larus_dominicanus_map.png",thumb_sprite:"",exotica:false,amba:8.57},
{id:201,num:"#066",n_lista:294,nombre_comun:"Gaviotín Golondrina",nombre_cientifico:"Sterna hirundo",familia:"Laridae",orden:"Charadriiformes",descripcion:{adulto:"Gaviotín mediano, de cola ahorquillada. Fuera de la época de cría tiene la frente blanca y una gorra negra desde el ojo hacia la nuca. Pico negruzco. Ojo pardo oscuro. Dorso y alas gris claro, con una barra oscura en el hombro del ala. Rabadilla y cola blancas. Partes inferiores blancas. Patas rojo apagado a negruzcas, cortas. Macho y hembra son iguales.",reproductivo:"En época de cría (que no pasa en la Argentina) tiene toda la corona negra, el pico rojo con la punta negra y las patas rojo brillante."},habitat:["costa","marino","laguna"],residencia:"estival",tamanio:"mediano",largo_cm:"31-35",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Chubut"],curiosidades:"Cría en América del Norte y en el verano austral llega a las costas de la Argentina, donde se junta en grandes bandadas para descansar en playas y bancos de arena. Es uno de los viajeros más largos: algunos recorren más de 10.000 km en cada sentido. Pesca zambulléndose en picada.",sprites:{adulto:"Sterna_hirundo_D"},audio_ebird_code:"comter",mapa:"Maps/Sterna_hirundo_map.png",thumb_sprite:"",exotica:false,amba:0.02},
{id:197,num:"#067",n_lista:296,nombre_comun:"Gaviotín Sudamericano",nombre_cientifico:"Sterna hirundinacea",familia:"Laridae",orden:"Charadriiformes",descripcion:{adulto:"Gaviotín mediano, de cola larga y ahorquillada. Fuera de la época de cría tiene la frente blanca y la corona y la nuca negras. Pico rojo, algo más oscuro. Ojo pardo. Dorso y alas gris pálido. Rabadilla y cola blancas. Partes inferiores blancas a gris muy pálido. Patas rojas, cortas. Macho y hembra son iguales.",reproductivo:"En época de cría tiene toda la corona negra, el pico y las patas rojo brillante, y las plumas de afuera de la cola más largas."},habitat:["costa","marino"],residencia:"invernal",tamanio:"mediano",largo_cm:"40-44",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chubut","Río Negro","Santa Cruz","Tierra del Fuego"],curiosidades:"Cría en colonias en la costa patagónica y en otoño muchos suben hacia el norte, por eso en Buenos Aires se ve más en invierno. Pesca zambulléndose en picada desde el aire. Tiene las patas tan cortas que en el suelo casi no camina.",sprites:{adulto:"Sterna_hirundinacea_D"},audio_ebird_code:"soater1",mapa:"Maps/Sterna_hirundinacea_map.png",thumb_sprite:"",exotica:false,amba:0.08},
{id:93,num:"#068",n_lista:298,nombre_comun:"Gaviotín Lagunero",nombre_cientifico:"Sterna trudeaui",familia:"Laridae",orden:"Charadriiformes",descripcion:{adulto:"Gaviotín mediano de cabeza cuadrada, cuello grueso, alas largas y cola ahorquillada. Cabeza y cuello blancos, con una banda gris oscura que pasa por el ojo como un antifaz. Pico negro con la punta amarillenta. Ojo pardo. Dorso y alas gris claro, con las puntas de las alas plateadas. Rabadilla blancuzca. Partes de abajo blanco grisáceas. Patas anaranjado rojizas. Macho y hembra son iguales. El juvenil tiene el dorso y las cubiertas jaspeados de pardo, la frente blanca y el pico negruzco.",reproductivo:"En plumaje reproductivo el antifaz es negro y más marcado, y el pico se vuelve anaranjado con la punta amarilla, separadas por una banda negra."},habitat:["humedal","ribereño","costa","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:"28-35",envergadura_cm:"76-78",estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Córdoba","Santiago del Estero","Tucumán","La Pampa","Mendoza","Río Negro","Chubut","Santa Cruz"],curiosidades:"Es el único gaviotín con la cabeza casi toda blanca y un antifaz oscuro, lo que le da su otro nombre: gaviotín de antifaz. Prefiere las lagunas de agua dulce de la región pampeana y patagónica, donde cría en colonias entre octubre y diciembre, muchas veces junto a la Gaviota Capucho Café. Arma un nido flotante de plantas en el agua baja, suelto o sujeto a la vegetación, y la pareja lo defiende con mucha energía. Come sobre todo peces, que atrapa zambulléndose de cabeza desde el aire, y también insectos; a veces se lo ve pescando insectos sobre campos recién arados. Su nombre científico homenajea a James Trudeau, un amigo de Audubon, que supuestamente lo encontró en Nueva Jersey, aunque nunca se confirmó su presencia en Norteamérica.",sprites:{adulto:"Sterna_trudeaui_D",reproductivo:"Sterna_trudeaui_R",vuelo:"Sterna_trudeaui_V"},audio_ebird_code:"truter",mapa:"Maps/Sterna_trudeaui_map.png",thumb_sprite:"",exotica:false,amba:2.67},
{id:180,num:"#069",n_lista:300,nombre_comun:"Gaviotín Real",nombre_cientifico:"Thalasseus maximus",familia:"Laridae",orden:"Charadriiformes",descripcion:{adulto:"Gaviotín grande. Fuera de la época de cría tiene la frente, la zona entre el pico y el ojo y la corona blancas, a veces con estrías negras, y una máscara negra que une los ojos por la nuca, donde forma un copete corto. Pico grueso anaranjado. Ojo pardo muy oscuro. Dorso y alas gris pálido, más claros hacia la rabadilla; plumas largas del ala gris pálido plateadas. Cola blanca, apenas ahorquillada. Costados de la cabeza, cuello y partes inferiores blanco brillante. Patas negras. Macho y hembra son iguales.",reproductivo:"En época de cría tiene la frente, la corona y la nuca negro brillante, con un copete desgreñado, y la cola más larga y ahorquillada."},habitat:["costa","marino"],residencia:"permanente",tamanio:"grande",largo_cm:"45-51",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Chubut","Río Negro","Santa Cruz"],curiosidades:"Pesca volando a unos metros del agua y zambulléndose en picada, sin llegar a sumergirse del todo. Come peces chicos, calamares y camarones. Anida en colonias apretadas sobre playas e islas de la costa, junto a otros gaviotines, y pone uno o dos huevos directamente en el suelo.",sprites:{adulto:"Thalasseus_maximus_D"},audio_ebird_code:"royter1",mapa:"Maps/Thalasseus_maximus_map.png",thumb_sprite:"",exotica:false,amba:0.34},
{id:24,num:"#070",n_lista:306,nombre_comun:"Pingüino Patagónico",nombre_cientifico:"Spheniscus magellanicus",familia:"Spheniscidae",orden:"Sphenisciformes",descripcion:{adulto:"Pingüino de cuerpo torpedo. Partes superiores, corona y cara enteramente negras. Ceja blanca ancha que arranca justo arriba de la piel desnuda rosada de los lados de la frente y baja por los costados de la corona hasta la parte alta de la garganta. Piel desnuda rosada alrededor y encima del ojo. Lores negros entre el ojo y el pico. Collar negro ancho en el cuello. Banda negra en forma de herradura que cruza el pecho superior y baja por los flancos, de ancho variable. Vientre blanco. Pico negro con una banda subterminal gris pálida cerca de la punta. Ojo pardo rojizo oscuro. Patas gris oscuro con manchas irregulares rosado carnoso."},habitat:["costa","marino"],residencia:"visitante invernal",tamanio:"grande",largo_cm:"70-76",envergadura_cm:null,estado:"LC",provincias:[],curiosidades:"Nidifica en cuevas excavadas en el suelo, formando colonias de miles de parejas en la costa patagónica. Migra hacia el norte en invierno, alcanzando ocasionalmente las costas bonaerenses.",sprites:{adulto:"Spheniscus_magellanicus_D"},audio_ebird_code:"magpen1",mapa:"Maps/Spheniscus_magellanicus_map.png",thumb_sprite:"",exotica:false,amba:0.0},
{id:199,num:"#071",n_lista:322,nombre_comun:"Albatros Ceja Negra",nombre_cientifico:"Thalassarche melanophris",familia:"Diomedeidae",orden:"Procellariiformes",descripcion:{adulto:"Ave marina muy grande, de alas largas y angostas. Cabeza, cuello, rabadilla y partes inferiores blancos, con una mancha pardo negruzca alrededor del ojo, ancha delante y más fina detrás, que forma una ceja. Pico grande, amarillo con la punta anaranjada. Ojo oscuro. Dorso gris oscuro a gris pardo; alas por arriba pardo oscuras. Cola gris. Por debajo, las alas son blancas con un borde negro ancho, sobre todo adelante. Patas gris rosadas. Macho y hembra son iguales."},habitat:["marino"],residencia:"permanente",tamanio:"grande",largo_cm:"80-95",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Chubut","Río Negro","Santa Cruz","Tierra del Fuego"],curiosidades:"Es el albatros más común en el mar argentino. Cría en colonias en las islas Malvinas, que tienen la mayor parte de la población mundial, y recorre enormes distancias planeando casi sin aletear. Sigue a los barcos pesqueros, y muchos mueren enganchados en los anzuelos de los palangres.",sprites:{adulto:"Thalassarche_melanophris_D"},audio_ebird_code:"bkbalb",mapa:"Maps/Thalassarche_melanophris_map.png",thumb_sprite:"",exotica:false,amba:0.0},
{id:207,num:"#072",n_lista:359,nombre_comun:"Pardela Cabeza Negra",nombre_cientifico:"Ardenna gravis",familia:"Procellariidae",orden:"Procellariiformes",descripcion:{adulto:"Ave marina grande, de alas largas y angostas. Gorra pardo negruzca bien marcada, separada del dorso por un collar blanquecino en la nuca. Pico oscuro y fino. Ojo oscuro. Dorso y alas pardo grisáceos, con los bordes de las plumas más claros que forman un escamado. Una franja blanca en forma de herradura sobre la base de la cola. Cola oscura. Partes inferiores blancas, con una mancha parda en el centro del vientre. Por debajo, las alas son blancas con marcas pardas y el borde oscuro. Patas rosadas. Macho y hembra son iguales."},habitat:["marino"],residencia:"estival",tamanio:"grande",largo_cm:"43-51",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","Chubut","Río Negro","Santa Cruz","Tierra del Fuego"],curiosidades:"Cría casi solo en las islas Tristán da Cunha y Gough, en medio del Atlántico, donde anidan unos cinco millones de parejas, y una colonia chica en Malvinas. Después de criar hace un enorme circuito por el Atlántico que la lleva hasta Groenlandia. Vuela muy bajo sobre el mar, alternando aleteos rígidos y planeos.",sprites:{adulto:"Ardenna_gravis_D"},audio_ebird_code:"greshe",mapa:"Maps/Ardenna_gravis_map.png",thumb_sprite:"",exotica:false,amba:0.0},
{id:25,num:"#073",n_lista:366,nombre_comun:"Cigüeña Americana",nombre_cientifico:"Ciconia maguari",familia:"Ciconiidae",orden:"Ciconiiformes",descripcion:{adulto:"Ave grande, la única cigüeña de cabeza blanca de América. Cabeza, cuello y cuerpo blancos. Plumas de vuelo y coberteras del ala negras. Cola negra y ahorquillada, con las coberteras infracaudales blancas que se extienden más allá de la mitad de la cola. Pico largo y recto, blanquecino verdoso con la punta rojiza. Lores rojos. Piel desnuda naranja-rojiza alrededor del ojo. Ojo amarillo pálido. Patas largas y rojas.",juvenil:"El juvenil tiene la cabeza y el cuello grisáceo-pardusco con aspecto desgreñado. Cuerpo mayormente negruzco con algunos parches blancos irregulares en el dorso. Pico oscuro. Patas rosado-grisáceas apagadas."},habitat:["humedal","pastizal"],residencia:"estival",tamanio:"grande",largo_cm:"97-120",envergadura_cm:null,estado:"LC",provincias:[],curiosidades:"Se distingue de la cigüeña europea por su cola negra ahorquillada y sus patas rojas. Anida en colonias sobre juncales o plataformas bajas en humedales.",sprites:{adulto:"Ciconia_maguari_D",juvenil:"Ciconia_maguari_J",vuelo:"Ciconia_maguari_V"},audio_ebird_code:"magsto1",mapa:"Maps/Ciconia_maguari_map.png",thumb_sprite:"",exotica:false,amba:10.0},
{id:164,num:"#074",n_lista:368,nombre_comun:"Tuyuyú",nombre_cientifico:"Mycteria americana",familia:"Ciconiidae",orden:"Ciconiiformes",descripcion:{adulto:"Cigüeña grande. Cabeza y parte alta del cuello sin plumas, con la piel pardo negruzca. Pico largo, grueso y apenas curvado hacia abajo, blanquecino. Ojo pardo oscuro. Cuerpo blanco, con las plumas largas de las alas y la cola negras, que forman un borde negro en el ala plegada. Patas largas negruzcas. Macho y hembra son iguales."},habitat:["humedal"],residencia:"estival",tamanio:"grande",largo_cm:"95-102",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Misiones","Salta","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Pesca tanteando: camina en el agua barrosa con el pico entreabierto sumergido y lo cierra de golpe, en una fracción de segundo, cuando toca un pez. Por su cabeza pelada le dicen cabeza de hueso. Planea en grupos aprovechando las corrientes de aire caliente y anida en colonias sobre árboles; a Buenos Aires llega sobre todo en los meses cálidos.",sprites:{adulto:"Mycteria_americana_D"},audio_ebird_code:"woosto",mapa:"Maps/Mycteria_americana_map.png",thumb_sprite:"",exotica:false,amba:1.0},
{id:26,num:"#075",n_lista:375,nombre_comun:"Biguá",nombre_cientifico:"Nannopterum brasilianum",familia:"Phalacrocoracidae",orden:"Suliformes",descripcion:{adulto:"Ave grande y oscura. Plumaje negro con brillo azulado y patrón escamado sutil en alas y dorso. Piel facial desnuda naranja-amarilla en la base del pico. Ojo verde-turquesa. Pico largo y ganchudo oscuro. Cuello largo sostenido en curva característica. Cola larga y redondeada. Patas y pies palmeados negros. En época de cría tiene un borde blanco en la cara y la garganta y un penacho de plumas blancas a los lados de la cabeza."},habitat:["humedal","ribereño","costa"],residencia:"permanente",tamanio:"grande",largo_cm:70,envergadura_cm:110,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut","Santa Cruz","Tierra del Fuego"],curiosidades:"A diferencia de la mayoría de las aves acuáticas sus plumas no son impermeables, por lo que debe secar las alas al sol con los brazos abiertos luego de bucear. Es un buceador experto que puede alcanzar varios metros de profundidad para atrapar peces.",sprites:{adulto:"Nannopterum_brasilianum_D"},audio_ebird_code:"neocor",mapa:"Maps/Nannopterum_brasilianum_map.png",thumb_sprite:"",exotica:false,amba:41.81},
{id:112,num:"#076",n_lista:382,nombre_comun:"Hocó Colorado",nombre_cientifico:"Tigrisoma lineatum",familia:"Ardeidae",orden:"Pelecaniformes",descripcion:{adulto:"Garza grande y robusta, de cuello grueso. Cabeza y cuello castaño rojizos. Por delante del cuello, una franja clara jaspeada de negro y blanco que baja desde la barbilla hasta el pecho. Pico fuerte, amarillo oscuro con la parte de arriba negruzca. Ojo amarillo, con la piel entre el pico y el ojo también amarilla. Dorso gris pardusco con finísimas líneas onduladas ocráceo rojizas. Alas grises, con finas rayas y la punta blanca en algunas plumas. Cola gris pardusca. Costados barrados de blanco y negro. Vientre gris ceniciento con barras canela. Patas amarillo verdosas oscuras. Macho y hembra son iguales.",juvenil:"El juvenil es muy distinto: castaño ocráceo, todo barrado y jaspeado de pardo oscuro, con aspecto 'atigrado'. Garganta, frente del cuello, pecho y vientre blanquecinos con barras y manchas ocres y pardas. Tarda unos cinco años en tener el plumaje de adulto."},habitat:["humedal","ribereño"],residencia:"permanente",tamanio:"grande",largo_cm:"66-76",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Santiago del Estero","Córdoba","Mendoza","Salta","Jujuy","Formosa","Catamarca"],curiosidades:"Es solitario y de movimientos lentos: se queda quieto, encorvado, en la orilla de bañados, esteros y lagunas con juncales o árboles, esperando que pase un pez, un cangrejo o un insecto acuático. Su llamado principal es un ulular grave y doble que suele dar de noche; entre sus muchos nombres populares están 'toro del agua' y 'garza tigre'. Hace una plataforma de palitos o juncos en árboles o juncales y pone 2 o 3 huevos blancos o celestes pálidos. El juvenil, todo atigrado, tarda unos cinco años en tener el plumaje de adulto.",sprites:{adulto:"Tigrisoma_lineatum_D",juvenil:"Tigrisoma_lineatum_J",alternativa:"Tigrisoma_lineatum_A"},audio_ebird_code:"ruther1",mapa:"Maps/Tigrisoma_lineatum_map.png",thumb_sprite:"",exotica:false,amba:23.99},
{id:27,num:"#077",n_lista:388,nombre_comun:"Garza Bruja",nombre_cientifico:"Nycticorax nycticorax",familia:"Ardeidae",orden:"Pelecaniformes",descripcion:{adulto:"Garza mediana y robusta de aspecto compacto. Frente y cejas blancas. Corona, nuca y dorso negro-verdosos brillantes. Piel desnuda de la cara verde amarillenta. Alas y cola grises. Cara y partes inferiores blancas o gris muy pálido. Dos o tres plumas blancas largas y finas cuelgan de la nuca en época reproductiva. Ojo rojo vivo y llamativo. Pico robusto y negro. Patas amarillo-verdosas. En juvenil el plumaje es pardo rayado con manchas blancas.",juvenil:"Plumaje pardo con manchas y rayas blancas en dorso y alas. Partes inferiores blancuzcas con rayas pardas. Ojo amarillo."},habitat:["humedal","ribereño","laguna"],residencia:"permanente",tamanio:"mediano",largo_cm:60,envergadura_cm:112,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","San Luis","Tucumán","Salta","Jujuy","Catamarca","La Rioja","San Juan","Neuquén","Río Negro"],curiosidades:"De hábitos principalmente nocturnos y crepusculares, de ahí su nombre. Durante el día descansa en grupos en árboles sobre el agua. Su canto es un 'quack' ronco que se escucha al anochecer. El juvenil es tan diferente del adulto que durante mucho tiempo se lo describió como una especie separada.",sprites:{adulto:"Nycticorax_nycticorax_D",juvenil:"Nycticorax_nycticorax_J"},audio_ebird_code:"bcnher",mapa:"Maps/Nycticorax_nycticorax_map.png",thumb_sprite:"",exotica:false,amba:14.63},
{id:148,num:"#078",n_lista:390,nombre_comun:"Garcita Azulada",nombre_cientifico:"Butorides striata",familia:"Ardeidae",orden:"Pelecaniformes",descripcion:{adulto:"Garza chica y compacta, de cuello corto. Corona y copete negros con brillo verdoso. Pico negruzco verdoso. Ojo amarillo. Garganta ocrácea; frente del cuello y pecho rayados de castaño y ocráceo. Resto del cuello, vientre y costados grises. Dorso gris. Alas grises, con las cubiertas gris verdosas bordeadas de ocráceo y castaño. Cola gris. Patas amarillo verdosas. Macho y hembra son iguales."},habitat:["humedal","ribereño","laguna"],residencia:"estival",tamanio:"mediano",largo_cm:"35-40",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Fe","Santiago del Estero","Tucumán"],curiosidades:"Llega a Buenos Aires en primavera y se va en otoño. Pesca quieta en la orilla o sobre una rama baja, encogida, y lanza el cuello de golpe para atrapar peces chicos. Es una de las pocas aves que usa herramientas: a veces tira al agua un insecto o una miga como carnada para atraer a los peces.",sprites:{adulto:"Butorides_striata_D"},audio_ebird_code:"strher",mapa:"Maps/Butorides_striata_map.png",thumb_sprite:"",exotica:false,amba:4.86},
{id:170,num:"#079",n_lista:391,nombre_comun:"Garcita Bueyera",nombre_cientifico:"Bubulcus ibis",familia:"Ardeidae",orden:"Pelecaniformes",descripcion:{adulto:"Garza chica y robusta, de cuello corto y grueso. Toda blanca. Pico amarillo, más corto y grueso que el de la Garcita Blanca. Ojo amarillo. Patas amarillas con los dedos negruzcos. Macho y hembra son iguales.",reproductivo:"En época de cría tiene la corona y unas plumas largas del dorso y del pecho de color canela."},habitat:["pastizal","agrícola","humedal"],residencia:"estival",tamanio:"mediano",largo_cm:"47-51",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Corrientes","Córdoba","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"],curiosidades:"Acompaña al ganado: camina entre vacas y caballos, y hasta se les sube al lomo, para atrapar los insectos que espantan al moverse. También sigue a los tractores cuando aran. Es originaria de África y llegó sola a Sudamérica a fines del siglo XIX; desde entonces se expandió por todo el continente. Duerme en grandes dormideros, a menudo en eucaliptos.",sprites:{adulto:"Bubulcus_ibis_D"},audio_ebird_code:"categr1",mapa:"Maps/Bubulcus_ibis_map.png",thumb_sprite:"",exotica:false,amba:2.75},
{id:28,num:"#080",n_lista:392,nombre_comun:"Garza Mora",nombre_cientifico:"Ardea cocoi",familia:"Ardeidae",orden:"Pelecaniformes",descripcion:{adulto:"Ave muy alta y esbelta. Parte de arriba de la cabeza negra, con plumas largas negras en la nuca; resto de la cabeza, garganta y cuello blancos. Cuello blanco con estriado negro fino en la parte delantera. Pico largo, anaranjado con la base amarilla. Ojo amarillo. Dorso gris con plumas alargadas color crema; plumas de vuelo negras. Pecho blanco con los costados negros; vientre negro, con muslos y plumas de abajo de la cola blancos. Cola negra. Patas amarillas y negruzcas.",reproductivo:"Similar al no reproductivo pero con corona negra bien definida, dos largas plumas negras cayendo de la nuca, pico naranja-rosado intenso, penacho escapular negro visible sobre el hombro, plumas ornamentales blancas en el pecho y patas rosado-salmón."},habitat:["humedal","ribereño","costa","pastizal"],residencia:"permanente",tamanio:"grande",largo_cm:110,envergadura_cm:180,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut"],curiosidades:"Es la garza más grande de Sudamérica. Caza solitaria, generalmente inmóvil a la orilla del agua esperando que el pez se acerque. A pesar de su gran tamaño es un volador elegante con el cuello recogido en S característico de las garzas.",sprites:{adulto:"Ardea_cocoi_D",reproductivo:"Ardea_cocoi_R"},audio_ebird_code:"cocher1",mapa:"Maps/Ardea_cocoi_map.png",thumb_sprite:"",exotica:false,amba:29.64},
{id:29,num:"#081",n_lista:393,nombre_comun:"Garza Blanca",nombre_cientifico:"Ardea alba",familia:"Ardeidae",orden:"Pelecaniformes",descripcion:{adulto:"Ave alta y esbelta, enteramente blanca. Pico largo y amarillo, patas largas y negras. En vuelo el cuello se recoge en forma de S y las patas sobrepasan la cola. Alas anchas y vuelo lento y pausado.",reproductivo:"Igual que el plumaje anterior pero con la región alrededor del ojo de color verde brillante y largas plumas ornamentales sobre el dorso."},habitat:["humedal","ribereño","costa","pastizal","agrícola"],residencia:"permanente",tamanio:"grande",largo_cm:95,envergadura_cm:150,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Córdoba","La Pampa","Mendoza","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut","Santa Cruz"],curiosidades:"Es una de las aves acuáticas más distribuidas del mundo. A fines del siglo XIX estuvo al borde de la extinción por la caza masiva de sus plumas nupciales. Caza inmóvil, esperando que el pez se acerque antes de asestar un golpe de pico fulminante.",sprites:{adulto:"Ardea_alba_D",reproductivo:"Ardea_alba_R",vuelo:"Ardea_alba_V"},audio_ebird_code:"greegr",mapa:"Maps/Ardea_alba_map.png",thumb_sprite:"",exotica:false,amba:39.1},
{id:30,num:"#082",n_lista:394,nombre_comun:"Chiflón",nombre_cientifico:"Syrigma sibilatrix",familia:"Ardeidae",orden:"Pelecaniformes",descripcion:{adulto:"Garza mediana de aspecto elegante. Corona, nuca y copete largo gris azulados, con las puntas del copete amarillentas; región de la oreja canela. Piel desnuda alrededor del ojo azul. Ojo blanco grisáceo. Cuello y pecho ocráceo amarillentos; garganta y rabadilla blancas. Dorso gris; alas grises con las cubiertas amarillentas ribeteadas de gris oscuro. Resto de abajo blanco amarillento. Cola blanca. Pico largo y recto, rosa violáceo con la punta negra. Patas negras. Emite un silbido agudo y penetrante característico."},habitat:["pastizal","agrícola","humedal"],residencia:"permanente",tamanio:"mediano",largo_cm:53,envergadura_cm:95,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Tucumán","Salta","Jujuy"],curiosidades:"A diferencia de la mayoría de las garzas, prefiere los pastizales secos y campos abiertos al borde del agua. Su canto es un silbido muy agudo y fuerte, escuchable a gran distancia, que da origen a su nombre vulgar.",sprites:{adulto:"Syrigma_sibilatrix_D"},audio_ebird_code:"whiher1",mapa:"Maps/Syrigma_sibilatrix_map.png",thumb_sprite:"",exotica:false,amba:10.49},
{id:31,num:"#083",n_lista:396,nombre_comun:"Garcita Blanca",nombre_cientifico:"Egretta thula",familia:"Ardeidae",orden:"Pelecaniformes",descripcion:{adulto:"Garza pequeña de plumaje enteramente blanco. Pico negro largo y delgado. Patas negras con dedos amarillo brillante, diagnósticos de la especie. Iris amarillo. En plumaje nupcial desarrolla aigretes largas y vaporosas sobre el pecho y la espalda, y la piel ocular vira a anaranjada."},habitat:["humedal","laguna","ribereño","costa"],residencia:"permanente",tamanio:"mediano",largo_cm:55,envergadura_cm:100,estado:"LC",provincias:["CABA","Buenos Aires","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Córdoba","Mendoza","Salta","Jujuy"],curiosidades:"Sus plumas nupciales blancas fueron tan codiciadas por la industria de la moda a fines del siglo XIX que la especie estuvo al borde de la extinción. La campaña para protegerla impulsó la creación de las primeras leyes de conservación de aves en América del Norte.",sprites:{adulto:"Egretta_thula_D"},audio_ebird_code:"snoegr",mapa:"Maps/Egretta_thula_map.png",thumb_sprite:"",exotica:false,amba:29.87},
{id:32,num:"#084",n_lista:398,nombre_comun:"Cuervillo de Cañada",nombre_cientifico:"Plegadis chihi",familia:"Threskiornithidae",orden:"Pelecaniformes",descripcion:{adulto:"Ave mediana de cuello largo y pico largo, curvo y oscuro. La mayor parte del año (fuera de la época de cría) es pardo negruzco, con brillos verdes y violáceos en las alas y el dorso. Ojo rojo. Patas rojizas. El juvenil es pardo negruzco con manchitas blancas en la cabeza y el cuello, pico grisáceo y patas verdosas.",reproductivo:"En época de cría el plumaje es marrón rojizo con reflejos violetas, las cubiertas del ala castañas y la cola con reflejos verde purpúreos. La cara tiene piel desnuda rosada bordeada de plumas blancas."},habitat:["humedal","pastizal","agrícola"],residencia:"permanente",tamanio:"mediano",largo_cm:58,envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Tucumán","Salta","Jujuy","Mendoza"],curiosidades:"Forma bandadas numerosas que vuelan en formaciones con el cuello extendido y el pico apuntando ligeramente hacia abajo. Se alimenta de insectos, lombrices y crustáceos que sondea con el pico en el barro. Los adultos tienen un brillo metálico espectacular cuando los ilumina el sol.",sprites:{adulto:"Plegadis_chihi_D",reproductivo:"Plegadis_chihi_R"},audio_ebird_code:"whfibi",mapa:"Maps/Plegadis_chihi_map.png",thumb_sprite:"",exotica:false,amba:9.97},
{id:81,num:"#085",n_lista:401,nombre_comun:"Cuervillo Cara Pelada",nombre_cientifico:"Phimosus infuscatus",familia:"Threskiornithidae",orden:"Pelecaniformes",descripcion:{adulto:"Ibis mediano, algo más chico que el Cuervillo de Cañada. Cara con piel desnuda rojiza a rosada, desde la base del pico hasta detrás del ojo. Pico largo y curvado hacia abajo, rosado. Ojo pardo rojizo. Plumaje negruzco opaco en todo el cuerpo, con brillos verdosos o bronceados en el cuello y las alas según la luz. Patas rosadas. Macho y hembra son iguales; el macho tiene el pico algo más largo. El juvenil es todo negruzco, incluso la cara, el pico y las patas."},habitat:["humedal","pastizal","agrícola","ribereño"],residencia:"permanente",tamanio:"mediano",largo_cm:"45-56",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","Tucumán","Salta","Jujuy","Catamarca","San Juan"],curiosidades:"Casi siempre anda en bandadas, a veces de cientos de individuos, y se mezcla con otros cuervillos y con el ganado. Busca comida en bañados, pastizales inundados y arrozales, clavando el pico curvo en el barro y en el agua para sacar lombrices, caracoles, insectos acuáticos y pececitos; también come granos. Cría en colonias sobre árboles y arbustos de los bañados, junto a garzas, biguás, espátulas y otros cuervillos. El nido es una plataforma de pastos y ramitas donde pone de uno a seis huevos verde azulados, que incuban ambos padres.",sprites:{adulto:"Phimosus_infuscatus_D"},audio_ebird_code:"bafibi1",mapa:"Maps/Phimosus_infuscatus_map.png",thumb_sprite:"",exotica:false,amba:15.01},
{id:88,num:"#086",n_lista:406,nombre_comun:"Espátula Rosada",nombre_cientifico:"Platalea ajaja",familia:"Threskiornithidae",orden:"Pelecaniformes",descripcion:{adulto:"Ave grande de patas largas, inconfundible por su pico largo, chato y ensanchado en la punta como una cuchara. Cabeza pelada de piel verdosa, cruzada por una franja negra en la nuca. Ojo rojo. Cuello, parte alta del dorso y pecho blancos. El resto del cuerpo y las alas rosados, con el hombro y la rabadilla rojo carmín bien intenso. Cola anaranjada. Patas largas rojizas.",juvenil:"Más pálido que el adulto: cabeza cubierta de plumas blancas, cuerpo blancuzco con tintes rosados apagados, pico amarillento o rosado y ojo amarillo. Las patas son oscuras, pardo grisáceas."},habitat:["humedal","ribereño","costa"],residencia:"estival",tamanio:"grande",largo_cm:"71-86",envergadura_cm:"120-133",estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Salta","Jujuy","San Luis","Tucumán","Mendoza","Misiones","Catamarca"],curiosidades:"Come caminando despacio por el agua baja con el pico entreabierto, moviéndolo de un lado a otro para filtrar del barro crustáceos, insectos acuáticos, caracoles, peces chiquitos y semillas. Muchas veces la siguen garzas que aprovechan los bichos que ella espanta. Su color rosado viene de pigmentos de lo que come, como pasa con los flamencos, y puede ir de rosa pálido a magenta. Vuela con el cuello estirado, a diferencia de las garzas. Anida en colonias sobre arbustos o árboles y pone de 2 a 5 huevos blancuzcos con manchas pardas. En el siglo XIX casi desaparece por la caza para sacarle las plumas.",sprites:{adulto:"Platalea_ajaja_D",juvenil:"Platalea_ajaja_J",vuelo:"Platalea_ajaja_V"},audio_ebird_code:"rosspo1",mapa:"Maps/Platalea_ajaja_map.png",thumb_sprite:"",exotica:false,amba:3.26},
{id:33,num:"#087",n_lista:410,nombre_comun:"Jote Cabeza Colorada",nombre_cientifico:"Cathartes aura",familia:"Cathartidae",orden:"Cathartiformes",descripcion:{adulto:"Ave grande de silueta inconfundible en vuelo. Plumaje corporal negro profundo con irisaciones pardo-bronceadas. Cabeza pequeña y desnuda, roja en el adulto, oscura en el juvenil. Cuello corto. Pico corto y ganchudo, de color marfil. En vuelo, las plumas de vuelo muestran envés gris plateado que contrasta con las coberteras oscuras. Planea con las alas en ligera V."},habitat:["aéreo","pastizal","agrícola","monte"],residencia:"permanente",tamanio:"grande",largo_cm:72,envergadura_cm:175,estado:"LC",provincias:["Buenos Aires","CABA","Santa Fe","Entre Ríos","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","La Pampa","Mendoza","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut"],curiosidades:"A diferencia de la mayoría de las aves, localiza los cadáveres principalmente por el olfato, gracias a un sentido del olfato excepcionalmente desarrollado. Cumple un rol ecológico fundamental al eliminar carroña y controlar enfermedades. Regurgita una sustancia ácida maloliente como defensa contra depredadores.",sprites:{adulto:"Cathartes_aura_D",vuelo:"Cathartes_aura_V"},audio_ebird_code:"turvul",mapa:"Maps/Cathartes_aura_map.png",thumb_sprite:"",exotica:false,amba:0.27},
{id:128,num:"#088",n_lista:415,nombre_comun:"Milano Blanco",nombre_cientifico:"Elanus leucurus",familia:"Accipitridae",orden:"Accipitriformes",descripcion:{adulto:"Rapaz mediana, gris y blanca, de alas largas y puntiagudas. Cabeza gris clara con la frente blanca y una línea oscura alrededor del ojo. Pico negro y ganchudo, con la base (cera) amarilla. Ojo rojo. Dorso gris. Alas grises con una gran mancha negra en el hombro; por debajo son blancas con una mancha negra en el doblez y las plumas largas grises. Cola blanca, con las dos plumas del centro gris pálido. Garganta, pecho y vientre blancos. Patas amarillas. Macho y hembra son iguales.",juvenil:"El juvenil tiene la corona y las partes de abajo estriadas de pardo y canela, las plumas de las alas con la punta blanquecina y la cola con una banda grisácea cerca de la punta."},habitat:["pastizal","agrícola","monte"],residencia:"permanente",tamanio:"mediano",largo_cm:"35-43",envergadura_cm:null,estado:"LC",provincias:["Buenos Aires","CABA","Entre Ríos","Santa Fe","Corrientes","Misiones","Chaco","Formosa","Santiago del Estero","Córdoba","San Luis","La Pampa","Mendoza","San Juan","La Rioja","Catamarca","Tucumán","Salta","Jujuy","Neuquén","Río Negro","Chubut"],curiosidades:"Es el rapaz que 'baila' en el aire: para cazar aletea suspendido en un mismo punto, a cierta altura sobre el campo, y después se deja caer sobre la presa con las alas levantadas y las patas estiradas hacia abajo. Come sobre todo ratones y otros roedores, y también insectos y ranas, por eso en el campo le dicen 'halcón lauchero'. Se lo ve posado en postes, cables o árboles, solo o en pareja. Arma en lo alto de un árbol un nido hondo como un tazón, de palitos con y sin espinas, forrado de pajitas, y pone de 2 a 4 huevos cremas con manchas castañas.",sprites:{adulto:"Elanus_leucurus_D",juvenil:"Elanus_leucurus_J",vuelo:"Elanus_leucurus_V"},audio_ebird_code:"whtkit",mapa:"Maps/Elanus_leucurus_map.png",thumb_sprite:"",exotica:false,amba:1.29},
